      if (!bin){
        const g=guessClass(it.name) || {d:0, s:1};
        const key=g.d+"|"+g.s;
        if (nextFree[key]===undefined) nextFree[key]=await nextFreeBin(g.d, g.s);
        bin=nextFree[key]++;
      }
      draftRows.push({name:tidyName(it.name), bin,
        qty:it.qty||0, min:it.min||1, value:it.value||"", pkg:it.pkg||"", part:it.part||"",
        supplier:it.supplier||"", source:it.source||"", link:it.link||"", notes:it.notes||""});
    }
    let added=0;
    try {
      // one transaction, one log entry: the whole sheet undoes as a single step
      const res=await DB.bulk(draftRows, w.src);
      added=res.added;
    } catch(e){ print("import failed: "+e.message,"a"); importWiz=null; endMode(); return; }
    importWiz=null;
    await refreshSummary(); deptCache=null; updateBadge(); graphSync();
    endMode(`imported ${added} item${added===1?"":"s"}${skipped.length?`, skipped ${skipped.length}`:""}. checkup: doctor`,"g");
    return;
  }
  if (tl==="header on"||tl==="header off"){
    w.hasHeader = tl==="header on";
    w.header = w.hasHeader ? w.rows[0] : w.rows[0].map((_,i)=>"col"+(i+1));
    w.map = autoMap(w.header);
    renderImportWizard(); return;
  }
  const m=t.match(/^map\s+(\d+)\s+(\w[\w-]*)$/i);
  if (m){
    const ci=parseInt(m[1],10)-1; let field=m[2].toLowerCase();
    const valid=["name","bin","qty","min","value","pkg","part","supplier","source","link","notes","ignore"];
    if (ci<0||ci>=w.header.length){ print("no such column.","a"); return; }
    if (!valid.includes(field)){ print("field must be one of: "+valid.join(" "),"a"); return; }
    // remove any existing mapping to this field (fields are unique), then set
    for (const k of Object.keys(w.map)) if(w.map[k]===field) delete w.map[k];
    if (field==="ignore") delete w.map[ci]; else w.map[ci]=field;
    renderImportWizard(); return;
  }
  print("try:  map <col#> <field>  ·  header on|off  ·  apply  ·  cancel","a");
}

async function importCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  let added=0, skipped=0;
  const newCids=[];
  for (const l of lines){
    const c=parseCSVLine(l);
    if (c[0].toLowerCase()==="name") continue;
    // detect layout: legacy had a category column after name (non-numeric at idx1)
    const off = isNaN(parseInt(c[1],10)) ? 1 : 0;
    if (!c[0] || isNaN(parseInt(c[1+off],10))){ skipped++; continue; }
    // new format has supplier/source/link before notes (11 cols); old had 8.
    const hasExtras = c.length >= (11+off);
    state.items.push({cid:state.nextCid++, name:c[0], bin:parseInt(c[1+off],10),
      qty:parseInt(c[2+off],10)||0, min:parseInt(c[3+off],10)||0,
      value:c[4+off]||"", pkg:c[5+off]||"", part:c[6+off]||"",
      supplier: hasExtras ? (c[7+off]||"") : "",
      source:   hasExtras ? (c[8+off]||"") : "",
      link:     hasExtras ? (c[9+off]||"") : "",
      notes:    hasExtras ? (c[10+off]||"") : (c[7+off]||"")});
    newCids.push(state.nextCid-1);
    added++;
  }
  if (added) logAct(`imported ${added} components`, {type:"import", cids:newCids});
  await save();
  print(`imported ${added} component${added===1?"":"s"}${skipped?`, skipped ${skipped} bad line${skipped===1?"":"s"}`:""}.`, skipped?"a":"g");
  if (added) print("  checkup: doctor","d");
}

   area: sections, projects with their BOMs, the activity log and the count history.
   Everything is read from the database, not from whatever is on screen. */

  const X=await loadSheetJS();
  if (!X){ print("couldn't load the spreadsheet engine (xlsx.full.min.js).","a"); return; }
  if (!await loadAll("export")) return;
  const wb=X.utils.book_new();
  const itemRows=[["ID","Name","Dept","Section","Bin","Qty","Min","Low","Value","Package",
    "Part #","Supplier","Source","Link","Notes"]];
  state.items.slice().sort((a,b)=>a.bin-b.bin).forEach(c=>itemRows.push([
    cidStr(c), c.name, clsLabel(clsNum(c.bin)), secLabel(clsNum(c.bin),secOf(c.bin))||"",
    binStr(c.bin), c.qty, c.min, c.qty<=c.min?"LOW":"", c.value||"", c.pkg||"",
    c.part||"", c.supplier||"", c.source||"", c.link||"", c.notes||""]));
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(itemRows), "Items");
  if (full){
    const secRows=[["Code","Department/Section"]];
    for (let d=0;d<10;d++){ secRows.push([d+"000", clsLabel(d)]);
      Object.keys(state.sections||{}).filter(k=>+k[0]===d).sort().forEach(k=>secRows.push([k+"0", state.sections[k]])); }
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(secRows), "Sections");

    await loadProjects();
    const projRows=[["Project","Status","Created","Part ID","Part","Need","Have"]];
    (state.projects||[]).forEach(p=>{
      const when=p.created?new Date(p.created).toISOString().slice(0,10):"";
      if (!p.bom.length) projRows.push([p.name,p.status||"",when,"","","",""]);
      p.bom.forEach(l=>projRows.push([p.name,p.status||"",when,
        "C-"+String(l.cid).padStart(3,"0"), l.name||"(deleted)", l.need, l.have]));
    });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(projRows), "Projects");

    const logRows=[["Time","Action"]];
    try { (await DB.log(1000)).rows.slice().reverse()
      .forEach(l=>logRows.push([new Date(l.ts).toISOString(), l.text])); }catch(e){}
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(logRows), "Activity");

    const cRows=[["Time","ID","Name","Expected","Actual","Delta"]];
    try { (await DB.countLog(1000)).forEach(e=>cRows.push([new Date(e.ts).toISOString(),
      "C-"+String(e.cid).padStart(3,"0"), e.name, e.expected, e.actual, e.actual-e.expected])); }catch(e){}
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(cRows), "Counts");
  }
  const out2=X.write(wb,{type:"array",bookType:"xlsx"});
  dlBytes(new Uint8Array(out2), `inventory-${new Date().toISOString().slice(0,10)}.xlsx`);
  try { await DB.setMeta("last_export", String(Date.now())); }catch(e){}
  print(`exported ${full?"full workbook (Items · Sections · Projects · Activity · Counts)":"Items"} to .xlsx — opens in Excel/Sheets.`,"g");
}

/* ---------- projects / BOM ---------- */
function resolveProj(q){
  if (!q) return {err:"which project? — proj new <name>"};
  const exact=state.projects.find(p=>p.name.toLowerCase()===q.toLowerCase());
  if (exact) return {p:exact};
  const part=state.projects.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  if (part.length===1) return {p:part[0]};
  if (part.length>1) return {err:`ambiguous: ${part.map(p=>p.name).join(", ")}`};
  return {err:`no project "${q}" — create it: proj new ${q}`};
}
function projStats(p){
  let need=0, have=0; const shorts=[];
  p.bom.forEach(l=>{
    const c = l.name!==undefined ? {cid:l.cid, name:l.name, qty:l.have, bin:l.bin, min:l.min} : null;
    const h=c?c.qty:0;
    need+=l.need; have+=Math.min(h,l.need);
    if (h<l.need) shorts.push({l, c, short:l.need-h});
  });
  return {ready: need? Math.round(100*have/need):100, shorts};
}
function printProj(p){
  const st=projStats(p);
  print(`PROJECT ${p.name}   [${p.status}]   ${st.ready}% ready`,"w");
  if (!p.bom.length){
    print(`  no parts yet — proj add ${p.name} 2x <part>, or press p on any selected row`,"d");
    return;
  }
  p.bom.forEach(l=>{
    const c = l.name!==undefined ? {cid:l.cid, name:l.name, qty:l.have, bin:l.bin, min:l.min} : null;
    if (!c){ print(`  ${l.need}x  (part deleted from inventory)`,"a"); return; }
    const ok=c.qty>=l.need;
    print(`  ${(l.need+"x").padEnd(5)}${c.name.slice(0,26).padEnd(28)}have ${String(c.qty).padEnd(5)}BIN ${binStr(c.bin)}  ${ok?"ok":"short "+(l.need-c.qty)}`,
          ok?"g":"a", "info "+cidStr(c));
  });
  if (st.shorts.length) print(`  ${st.shorts.length} shortage${st.shorts.length===1?"":"s"} — proj shop ${p.name} · build ${p.name} partial`,"a");
  else print(`  all parts on hand — build ${p.name}`,"g");
}

}

/* ---------- commands ---------- */
async function exec(line){
  browseSel=-1;
  const t=line.trim(); if(!t) return;
  const [verb]=t.split(/\s+/);
  const rest=t.slice(verb.length).trim();
  const v=verb.toLowerCase();

  if (/^\d{1,4}$/.test(t)){
    const n=parseInt(t,10);
    if (t.length===1){ await listClass(n); return; }
    if (t.length===2){ await listSection(Math.floor(n/10), n%10); return; }
    const binHit=(await DB.items({bin:n, sort:"bin"})).rows;
    if (binHit.length){
      const d=clsNum(n), sc=secOf(n), sl=secLabel(d,sc);
      focusHeader(`BIN ${binStr(n)}  ${clsLabel(d)}${sl?"  /  "+sl:""}`);
      printRows(binHit); term.scrollTop=0; return;
    }
    print(`BIN ${binStr(n)} is empty — file something there: add <name> @${t}`,"d");
    return;
  }

  switch(v){
    case "help": case "?": case "menu": menu(rest); return;

    case "health": case "status": {
      out.innerHTML=""; live.innerHTML=""; browseSel=-1; atHome=false;
      print("DATA HEALTH","w"); print("");
      const primary = openEnvelope(await store.get(KEY));
      const mirror  = openEnvelope(await idbGet(MIRROR_KEY).catch(()=>null));
      const snaps   = await readSnapshots();
      const dot=ok=>ok?"[OK] ":"[!!] ";
      const ago=ts=>{ if(!ts) return "never"; const s2=Math.round((Date.now()-ts)/1000);
        return s2<60?s2+"s ago":s2<3600?Math.round(s2/60)+"m ago":Math.round(s2/3600)+"h ago"; };
      print("  "+dot(primary.ok)+"primary store   "+(primary.ok?"verified":("CORRUPT: "+(primary.reason||"?"))),primary.ok?"g":"a");
      print("  "+dot(mirror.ok)+"mirror (backup) "+(mirror.ok?"verified":"missing/corrupt"),mirror.ok?"g":"a");
      print("  "+dot(snaps.length>0)+"snapshots       "+snaps.length+" kept (newest "+(snaps.length?ago(snaps[snaps.length-1].ts):"—")+")",snaps.length?"g":"d");
      print("  "+dot(lastSaveOk)+"last save       "+(lastSaveOk?"confirmed ":"FAILED ")+ago(lastSaveTs),lastSaveOk?"g":"a");
      print("  "+dot(!!backupHandle)+"file auto-backup "+(backupHandle?"on":"off — run 'backup'"),backupHandle?"g":"d");
      if (SERVER.on()) print("  "+dot(serverLive)+"server sync     "+(serverLive?"connected "+SERVER.url():"unreachable (local fallback)"),serverLive?"g":"a");
      else print("  [--] server sync     off (local-only)","d");
      print("  "+dot(!!dbHandle)+"physical db     "+(dbHandle?"invos.db attached (auto-sync)":"off — run 'db' for a real SQLite file"),dbHandle?"g":"d");
      { const days = state.lastExport ? Math.round((Date.now()-state.lastExport)/864e5) : null;
        print("  "+dot(days!==null && days<=14)+"off-machine copy "+(days===null?"never — run export/backup":days+" days ago"),(days!==null&&days<=14)?"g":"a"); }
      print("");
      print(`  ${summary.items} items · ${state.projects.length} projects · schema v${SCHEMA}`,"d");
      { const srv=serverInfo&&serverInfo.build;
        print(`  build     page ${loadedBuild||"?"} · server ${srv||"?"}`
          + (updateReady?"   ⟳ RELOAD to pick up the newer build":""), updateReady?"a":"d"); }
      print("  commands: rollback (undo a bad state) · export · backup","d");
      return;
    }

    case "rollback": {
      // The old build kept checksummed snapshots of a JSON blob. The database keeps a
      // transactional log instead, so rolling back IS repeated undo — same capability,
      // and every step is a real, reversible transaction rather than a whole-state swap.
      const n = parseInt(rest.trim(), 10);
      if (!rest.trim() || isNaN(n)){
        out.innerHTML=""; live.innerHTML=""; browseSel=-1; atHome=false;
        print("ROLLBACK","w"); print("");
        let L=[];
        try { L=(await DB.log(15)).rows; }catch(e){ print(e.message,"a"); return; }
        const open2=L.filter(e=>e.undoable && !e.undone);
        if (!open2.length){ print("  nothing to roll back — no reversible changes yet.","d"); return; }
        print("  recent reversible changes, newest first:","d"); print("");
        open2.forEach((e,i)=>print(`  ${String(i+1).padStart(2)}  ${new Date(e.ts).toLocaleString()}  ${e.text}`,"g"));
        print("");
        print("  roll back N steps:  rollback 3      one step:  undo","d");
        return;
      }
      if (n<1){ print("rollback <how many steps>","a"); return; }
      let done=0;
      for (let i=0;i<n;i++){
        let res;
        try { res=await DB.undo(); }catch(e){ print("stopped: "+e.message,"a"); break; }
        if (!res.undone){ print(`  nothing left to undo after ${done} step${done===1?"":"s"}.`,"d"); break; }
        print(`  reversed: ${res.entry.text}`,"g");
        done++;
      }
      await refreshSummary(); deptCache=null; updateBadge(); graphSync();
      if (done) print(`rolled back ${done} step${done===1?"":"s"}.`,"a");
      return;
    }

    case "db": case "database": {
      const a=rest.trim().toLowerCase();
      if (a==="export"||a==="save"||a==="download"){
        // a consistent copy taken with SQLite's own VACUUM INTO — safe to run while
        // the shop is working, and it opens in any SQLite tool
        print("preparing a copy of the database…","d");
        try {
          const r2=await fetch("/api/db");
          if (!r2.ok) throw new Error("server said "+r2.status);
          const blob=await r2.blob();
          const url=URL.createObjectURL(blob);
          const el=document.createElement("a");
          el.href=url; el.download=`invos-${new Date().toISOString().slice(0,10)}.db`;
          el.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
          print(`invos.db downloaded (${(blob.size/1048576).toFixed(1)} MB) — opens in DB Browser, sqlite3, Python or Excel.`,"g");
        } catch(e){ print("could not download the database: "+e.message,"a"); }
        return;
      }
      out.innerHTML=""; live.innerHTML=""; browseSel=-1; atHome=false;
      print("DATABASE","w"); print("");
      try {
        const info=await DB.get("/api/server");
        print("  file   "+info.dbPath,"g");
        print("  size   "+(info.dbBytes/1048576).toFixed(1)+" MB","d");
      } catch(e){ print("  (could not reach the server: "+e.message+")","a"); }
      print("");
      print("  This is a real SQLite file and it is the live database — not a mirror,","d");
      print("  not an export. Every change is written to it as it happens.","d");
      print("");
      print("  db export     download a consistent copy right now","d");
      print("  backup        download everything as JSON instead","d");
      return;
    }

    case "__shopdefault": {
      if (await saveShopDefaults()){
        print("saved as the shop default.","g");
        print("  a device opening this shop for the first time starts with these.","d");
        print("  devices already set up keep their own — a default is a starting point.","d");
      }
      renderSettings();
      return;
    }

    case "__toggle": {
      // The settings rows use this rather than the plain commands, because those end by
      // showing their OWN screen (theme cores opens the theme list) — which would throw
      // you out of settings every time you flipped something.
      const what=rest.trim().toLowerCase();
      if (what==="cores"){ gCores=!gCores; state.cores=gCores; }
      else if (what==="hud"){ hudOn=!hudOn; state.hud=hudOn; updateHud(); }
      else if (what==="bar"){
        state.barOff=!state.barOff;
        document.body.classList.toggle("bar-off", !!state.barOff);
      }
      await save(); gWake(); renderSettings();
      return;
    }

    case "__lantoggle": {
      const on = !!(serverInfo && serverInfo.lan);
      await run("lan " + (on ? "off" : "on"));
      await refreshServerInfo();
      renderSettings();
      return;
    }

    case "lan": case "shop": {
      const want=rest.trim().toLowerCase();

      /* `lan http` / `lan https` — encryption stays the default and stays recommended.
         The reason to be able to turn it off is that the certificate is self-signed: a
         browser can be told to accept it once, but a label printer, an ESP32 on the
         bench, a curl script or a home-automation box polling for low stock often
         cannot. Refusing those encryption-or-nothing does not make the shop safer, it
         makes the shop keep a second, worse copy of the data somewhere else. */
      if (want==="http" || want==="https" || want==="tls on" || want==="tls off"){
        const secure = (want==="https" || want==="tls on");
        let r2;
        try { r2 = await DB.setLan(true, secure); }
        catch(e){ print("could not change it: "+e.message,"a"); return; }
        await refreshServerInfo(); updateBadge();
        if (secure){
          print("shop access is encrypted (https).","g");
          print("  each device warns once about the certificate, then it is trusted.","d");
        } else {
          print("shop access is now PLAIN HTTP.","a");
          print("  anything on this network can read what crosses it — quantities, part","d");
          print("  numbers, and your shop key if one is set. Use it for devices that","d");
          print("  cannot be taught a self-signed certificate, not for tablets.","d");
          print("  back to encrypted:  lan https","d");
        }
        (r2.urls||[]).forEach(u=>print("  "+u,"g"));
        print("  devices already connected must reload — the listener was rebuilt.","d");
        return;
      }

      if (want!=="on" && want!=="off"){
        // no argument: show the same screen the `server` command does
        await run("server"); return;
      }
      let res;
      try { res=await DB.setLan(want==="on"); }
      catch(e){ print("could not change shop access: "+e.message,"a"); return; }
      await refreshServerInfo(); updateBadge();
      if (!res.lan){ print("shop access off — only this machine can reach the app now.","d"); return; }
      print("shop access ON","g");
      (res.urls||[]).forEach(u=>print("  "+u,"g"));
      print("  devices on this network can open those and share this inventory. 'server' shows a QR code.","d");
      if (res.secure===false) print("  PLAIN HTTP — not encrypted. 'lan https' turns it back on.","a");
      if (res.unprotected) print("  no key set — anyone on the network can edit. restart with -token to require one.","a");
      return;
    }

    case "server": {
      out.innerHTML=""; live.innerHTML=""; browseSel=-1; atHome=false;
      print("SERVER","w"); print("");
      let info=null;
      try { info=await DB.get("/api/server"); }
      catch(e){ print("  could not reach the server: "+e.message,"a"); return; }
      print("  This build IS the server — the app you are looking at is served by it,","d");
      print("  and it owns the database. There is nothing to connect to.","d");
      print("");
      print("  version  "+info.version,"d");
      print("  shop access  "+(info.lan?"ON":"off"), info.lan?"g":"d");
      print("  auth         "+(info.tokenSet?"key required on other devices":"none"), info.tokenSet?"g":"d");
      if (info.lan) print("  encryption   "+(info.secure===false?"OFF — plain http":"on — https"),
                          info.secure===false?"a":"g");
      print("");
      if (info.lan){
        const shopUrls=(info.urls||[]).filter(u=>!/localhost|127\.0\.0\.1/.test(u));
        if (shopUrls.length){
          print("  Open this on a tablet or phone on the same network:","w");
          shopUrls.forEach(u=>print("    "+u,"g"));
          // No QR here: the built-in encoder is version 1 only (14 bytes), which is
          // right for a bin code like INV:1101 but cannot hold a URL. A QR that
          // scans to nothing is worse than typing the address, so it stays out until
          // the encoder handles larger versions.
        } else {
          print("  On, but no network address was found — is this machine on a network?","a");
        }
        print("");
        if (!info.tokenSet) print("  no token set: anyone who can reach this machine can edit inventory","a");
        print("  turn it off:  lan off","d");
      } else {

      if (sub==="done"||sub==="status"){
        const t2=r2.split(/\s+/);
        const stt = sub==="done" ? "done" : (t2.pop()||"").toLowerCase();
        const pname = sub==="done" ? r2 : t2.join(" ");
        if (!["planning","building","done"].includes(stt)){ print("status: planning | building | done","a"); return; }
        const pr=resolveProj(pname); if (pr.err){ print(pr.err,"a"); return; }
        try { await DB.editProject(pr.p.pid, {status:stt}); }
        catch(e){ print("could not change the status: "+e.message,"a"); return; }
        await loadProjects(); graphSync();
        print(`${pr.p.name} -> [${stt}]`,"g"); return;
      }
      if (sub==="del"){
        const pr=resolveProj(r2); if (pr.err){ print(pr.err,"a"); return; }
        try { await DB.delProject(pr.p.pid); }
        catch(e){ print("could not delete it: "+e.message,"a"); return; }
        await loadProjects(); graphSync();
        print(`project ${pr.p.name} deleted. (undo restores it and its parts list)`,"a"); return;
      }
      if (sub==="print"){
        const pr=resolveProj(r2); if (pr.err){ print(pr.err,"a"); return; }
        if (!pr.p.bom.length){ print("nothing to print — the BOM is empty.","a"); return; }
        printSheet(pr.p);
        print(`pick list for ${pr.p.name} sent to print — sorted by bin.`,"g");
        return;
      }
      if (sub==="use"){
        const pr=resolveProj(r2); if (pr.err){ print(pr.err,"a"); return; }
        try { await DB.activate(pr.p.pid); } catch(e){ print(e.message,"a"); return; }
        await loadProjects(); graphSync();
        print(`${pr.p.name} is now active — p on any selected row adds to it`,"g"); return;
      }
      const pr=resolveProj(rest); if (pr.err){ print(pr.err,"a"); return; }
      try { await DB.activate(pr.p.pid); } catch(e){ print(e.message,"a"); return; }
      await loadProjects(); graphSync();
      printProj(resolveProj(pr.p.name).p || pr.p); return;
    }

    case "build": {
      await loadProjects();
      const t2=rest.split(/\s+/);
      const partial=t2[t2.length-1]?.toLowerCase()==="partial";
      const pname=partial?t2.slice(0,-1).join(" "):rest;
      const pr=resolveProj(pname); if (pr.err){ print(pr.err,"a"); return; }
      if (!pr.p.bom.length){ print("project has no parts yet.","a"); return; }
      // The whole build is ONE server transaction: every part comes off the shelf and
      // the status changes together, under a single log entry. Doing it as a loop of
      // per-part adjustments meant `undo` reversed only the last thing that happened —
      // the status — and left the parts off the shelf.
      let res;
      try { res = await DB.build(pr.p.pid, partial); }
      catch(e){
        if (e.short){
          print(`can't build ${pr.p.name} — ${e.short.length} shortage${e.short.length===1?"":"s"}:`,"a");
          e.short.forEach(l=>print(`  need ${l.need-l.have} more ${l.name}`,"a"));
          print(`proj shop ${pr.p.name} for the buy list · or: build ${pr.p.name} partial`,"d");
        } else print("could not build: "+e.message,"a");
        return;
      }
      const taken=res.taken;
      await loadProjects(); await refreshSummary(); deptCache=null; updateBadge(); graphSync();
      print(`built ${pr.p.name} — took ${taken} pcs across ${pr.p.bom.length} BOM line${pr.p.bom.length===1?"":"s"}. (one undo returns everything)`,"g");
      if (res.short && res.short.length)
        print(`  ${res.short.length} line${res.short.length===1?"":"s"} came up short — 'proj shop ${pr.p.name}'`,"a");
      print(`  paper pick list: proj print ${pr.p.name}`,"d");
      const lows=summary.low;
      if (lows) print(`  ${lows} part${lows===1?"":"s"} now low — 'low'`,"a");
      return;

    case "labels": case "label": {
      let bins=[];
      const binQuery = async o => [...new Set((await DB.peek(Object.assign({limit:1000, sort:"bin"}, o))).rows.map(c=>c.bin))].sort((a,b)=>a-b);
      if (!rest) bins=await binQuery({});
      else if (/^\d$/.test(rest)) bins=await binQuery({dept:+rest});
      else if (/^\d\d$/.test(rest)) bins=await binQuery({dept:+rest[0], sec:+rest[1]});
      else if (/^\d{3,4}$/.test(rest)) bins=[parseInt(rest,10)];
      else { print("labels · labels 1 (dept) · labels 15 (section) · label 1101 (one bin)","d"); return; }
      if (!bins.length){ print("no bins in that range yet.","a"); return; }
      await labelSheet(bins);
      print(`${bins.length} label${bins.length===1?"":"s"} sent to print — 62×29 mm with QR codes. any printer works; a label printer's driver will fit them to its media.`,"g");

    case "scan": await startScan(); return;

    case "count": {
      const a=rest.trim().toLowerCase();

        out.innerHTML=""; live.innerHTML=""; browseSel=-1; atHome=false;
        print("COUNT HISTORY","w"); print("");
        let L=[];
        try { L=await DB.countLog(50); }
        catch(e){ print("could not read the count history: "+e.message,"a"); return; }
        if(!L.length){ print("  no counts logged yet — run 'count'","d"); return; }
        const p2=x=>String(x).padStart(2,"0");
        L.forEach(e=>{ const d=new Date(e.ts); const diff=e.actual-e.expected;
          print(`  ${p2(d.getMonth()+1)}-${p2(d.getDate())} C-${String(e.cid).padStart(3,"0")} ${e.name.slice(0,22).padEnd(24)} ${e.expected} → ${e.actual} ${diff===0?"(ok)":(diff>0?"+"+diff:diff)}`,
            diff===0?"g":"a"); });
        return;
      }
      // The scope is a QUERY, so counting one shelf walks that shelf whatever its size
      // instead of filtering whatever happened to be on screen.
      const cq={sort:"bin", limit:1000};
      let scope="all";
      if (/^\d$/.test(a)){ cq.dept=+a; scope=clsLabel(+a); }
      else if (/^\d\d$/.test(a)){ cq.dept=+a[0]; cq.sec=+a[1]; scope=secLabel(+a[0],+a[1])||a; }
      let items=(await DB.peek(cq)).rows;
      if (a==="due"){
        // never counted, or not counted in the last 30 days (counted_at is on the item)
        const cutoff=Date.now()-30*864e5;
        items=items.filter(c=>!c.counted || c.counted<cutoff); scope="due (30d+)";
      }
      if (!items.length){ print("nothing to count in that scope.","d"); return; }
      items.sort((x,y)=>((x.counted||0)-(y.counted||0)) || x.bin-y.bin);
      mode={type:"count", queue:items, idx:0, scope, fixed:0, checked:0};
      print(`CYCLE COUNT — ${scope} · ${items.length} items · blank=confirm · number=correct · skip · stop`,"w");
      countStep();
      return;
    }

    case "graph": {
      const m=rest.trim(), ml=m.toLowerCase();
      if (["pop","popout","window","monitor","2"].includes(ml)){ popGraph(); return; }
      if (["dock","back","1"].includes(ml)){ dockGraph(); return; }
      if (["3d","3","cube"].includes(ml)){ g3d=true; if(graphMode==="off")setGraph("split"); graphHome(); print("graph 3D — drag to orbit, it drifts on its own. graph home recenters · graph 2d flattens.","d"); return; }
      if (["2d","flat"].includes(ml)){ g3d=false; if(graphMode==="off")setGraph("split"); graphHome(); print("graph 2D.","d"); return; }
      if (ml==="style"){ gStyle = gStyle==="holo"?"clean":"holo"; print(`graph style: ${gStyle==="holo"?"holographic glow":"clean minimal"}`,"d"); return; }
      if (ml==="hud"){ hudOn=!hudOn; state.hud=hudOn; updateHud(); gWake(); await save(); print(`HUD frame ${hudOn?"on":"off"}`,"d"); return; }
      if (ml==="sweep"){ sweepT=performance.now(); print("sweep","d"); return; }
      /* An exported graph is the one thing from this app that other people see. It used
         to be a raw dump of the pane: whatever odd shape the split happened to be, with
         nothing in the picture saying what it was or whose shop it came from.

         It now gets a caption strip — the shop's name, what the view is, how many things
         are in it, and the product name. That costs nothing and means a screenshot
         someone shares carries its own context instead of being a pretty blob.

         The graph is drawn at its NATIVE size and never upscaled: enlarging a 640px pane
         to something "shareable" just produces a soft 1600px image. `graph full` first
         is the way to get a big one, and it says so. */
      if (["png","image","snapshot","shot"].includes(ml)){
        if (graphMode==="off"){ print("open the graph first (graph / graph galaxy), then: graph png","a"); return; }
        const cv = gPopped() ? gPopCanvas : gc;
        if (!cv){ print("no graph canvas to export.","a"); return; }

        const scale = Math.max(1, cv.width/900);          // caption scales with the image
        const barH  = Math.round(54*scale);
        const out   = document.createElement("canvas");
        out.width = cv.width; out.height = cv.height + barH;
        const o = out.getContext("2d");

        const css = getComputedStyle(document.documentElement);
        const pick = (n,f)=>(css.getPropertyValue(n)||"").trim()||f;
        o.fillStyle = pick("--bg","#0c0c0c");
        o.fillRect(0,0,out.width,out.height);
        o.drawImage(cv,0,0);

        o.fillStyle = "rgba(255,255,255,.06)";
        o.fillRect(0,cv.height,out.width,Math.max(1,Math.round(scale)));

        const viewName = gView.kind==="inv" ? "inventory"
                       : gView.kind==="galaxy" ? "project galaxy"
                       : gView.kind==="projects" ? "projects" : "project";
        const left = (state.shopName ? state.shopName + " — " : "") + viewName;
        const count = gView.kind==="inv"
          ? `${graphItemsTotal||gNodes.length} items`
          : `${(state.projects||[]).length} projects`;

        o.textBaseline = "middle";
        o.font = `600 ${Math.round(17*scale)}px ui-monospace, monospace`;
        o.fillStyle = pick("--white","#fff");
        o.fillText(left, Math.round(20*scale), cv.height + barH*0.38);

        o.font = `${Math.round(13*scale)}px ui-monospace, monospace`;
        o.fillStyle = pick("--dimgreen","#767676");
        o.fillText(`${count} · ${new Date().toLocaleDateString()}`,
                   Math.round(20*scale), cv.height + barH*0.72);

        o.textAlign = "right";
        o.font = `600 ${Math.round(15*scale)}px ui-monospace, monospace`;
        o.fillStyle = pick("--cyan","#61d6d6");
        o.fillText("INV.OS", out.width - Math.round(20*scale), cv.height + barH*0.38);
        o.font = `${Math.round(11*scale)}px ui-monospace, monospace`;
        o.fillStyle = pick("--dimgreen","#767676");
        o.fillText("workshop inventory", out.width - Math.round(20*scale), cv.height + barH*0.72);

        out.toBlob(b=>{ if(!b){ print("couldn't capture the graph.","a"); return; }
          const shop=(state.shopName||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
          const el=document.createElement("a"); el.href=URL.createObjectURL(b);
          el.download=`${shop?shop+"-":""}${gView.kind}-graph-${new Date().toISOString().slice(0,10)}.png`;
          el.click(); setTimeout(()=>URL.revokeObjectURL(el.href),1000);
          print(`graph saved — ${out.width}x${out.height} PNG.`,"g");
          if (graphMode!=="full") print("  bigger picture: graph full, then graph png","d");
        },"image/png");
        return;
      }
      if (["orbit","orbits","planets","spin"].includes(ml)){
        gOrbit = !gOrbit; gOrbitInit = false;
        setCfg("orbit", gOrbit ? 1 : 0); await save();   // remembered per device
        if (gOrbit && gView.kind!=="galaxy" && gView.kind!=="projects") setGraphView({kind:"galaxy"});
        if (gOrbit && graphMode==="off") setGraph("split");
        gAlpha = Math.max(gAlpha, 0.6);   // re-heat, so it settles then takes off
        print(gOrbit
          ? "orbit mode ON — parts revolve around their project, projects wheel around the sun"
          : "orbit mode off — back to the static force graph","d");
        print(gOrbit
          ? "  it repaints continuously; 'graph orbit' again stops it. remembered on this device."
          : "  also in 'settings' as orbit motion.","d");
        return;
      }
      if (["home","reset","center","recenter"].includes(ml)){ graphHome(); print("view recentered.","d"); return; }
      if (ml==="off"){ if (gPopped()) dockGraph("off"); else setGraph("off"); return; }
      if (ml==="full"){ setGraph("full"); print("graph full — esc for split.","d"); return; }
      if (!ml){
        if (graphMode!=="off"){ setGraph("off"); return; }
        setGraph("split");
      }
      else if (["inv","inventory","all"].includes(ml)){
        setGraphView({kind:"inv"});
        if (graphMode==="off") setGraph("split");
      }
      else if (["projects","proj","projs"].includes(ml)){
        setGraphView({kind:"projects"});
        if (graphMode==="off") setGraph("split");
      }
      else if (["galaxy","universe","clusters"].includes(ml) && !galaxyOn()){
        print("the galaxy view is switched off — showing projects instead.","a");
        print("  turn it on in 'settings' (galaxy view), or: set galaxy 1","d");
        if (graphMode==="off") setGraph("split");
        setGraphView({kind:"projects"});
        return;
      }
      else if (["galaxy","universe","clusters"].includes(ml)){
        if (!state.projects.length){ print("no projects yet — the galaxy needs projects. proj new <name>","a"); return; }
        if (graphMode==="off") setGraph("split");
        g3d=true;                       // galaxy is best in 3D
        setGraphView({kind:"galaxy"});
        print("galaxy: each project is a cluster · bright stars are shared parts · drag to orbit · 'graph grow' replays the timeline","d");
      }
      else if (["next","cycle","switch","toggle"].includes(ml)){ cycleView(); return; }
      else if (["grow","timeline","play"].includes(ml)){
        if (gView.kind!=="galaxy"){ setGraphView({kind:"galaxy"}); }
        galaxyGrow();
      }
      else {
        const pr=resolveProj(m); if (pr.err){ print(pr.err,"a"); return; }
        if (graphMode==="off") setGraph("split");
        setGraphView({kind:"proj", pid:pr.p.pid});
      }
      const what = gView.kind==="inv" ? "inventory — every part clustered by shelf"
                 : gView.kind==="projects" ? "all projects — links are shared parts, click one to drill in"
                 : "one project and only its parts";
      print(`graph ${graphMode}: ${what}. graph inv · graph projects · graph <name> · graph full · esc backs out.`,"d");
      return;
    }

    case "tidy": {
      if (!await loadAll("tidy")) return;
      const props = state.items.map(c=>({c, after:tidyName(c.name)})).filter(x=>x.after!==x.c.name);
      if (!props.length){ print("nothing to tidy — names are already consistent.","g"); return; }
      if (rest.toLowerCase()==="apply"){
        // one request, one transaction, one undo entry — renaming 400 items must not
        // cost 400 presses of undo to reverse
        let n=0;
        try {
          const res = await DB.bulkUpdate(
            props.map(x=>({cid:x.c.cid, patch:{name:x.after}})),
            `tidied ${props.length} name${props.length===1?"":"s"}`);
          n = res.changed;
        } catch(e){ print("could not apply: "+e.message,"a"); return; }
        await refreshSummary(); deptCache=null; updateBadge(); graphSync();
        print(`tidied ${n} name${n===1?"":"s"}. (one undo reverts the whole batch)`,"g");
        return;
      }
      print("PROPOSED CLEANUP  (dry run — nothing changed yet)","w");
      props.forEach(x=>print(`  ${x.c.name.slice(0,28).padEnd(30)} -> ${x.after}`,"g"));
      print("apply with:  tidy apply   (one undo reverts the whole batch)","d");
      return;
    }

    case "doctor": case "normalize": case "fsck": {
      if (!await loadAll("the database doctor")) return;
      const d=doctorScan();
      const issues=d.nameFixes.length+d.fldFixes.length+d.exact.length;
      if (!issues && !d.review.length){ print("database clean — no duplicates or messy entries.","g"); return; }
      if (rest.toLowerCase()==="apply"){
        if (!issues){ print("nothing to auto-fix. review items need manual 'merge'.","a"); return; }
        // Names and fields go in one bulk write; each duplicate merge is its own
        // transaction because merging moves stock and BOM lines as well as text.
        const patches=new Map();
        const add=(cid,patch)=>patches.set(cid, Object.assign(patches.get(cid)||{}, patch));
        d.nameFixes.forEach(x=>add(x.c.cid, {name:x.after}));
        d.fldFixes.forEach(x=>x.f.forEach(f=>add(x.c.cid, {[f.k]: f.after})));
        let fixed=0, merged=0;
        try {
          if (patches.size){
            const res=await DB.bulkUpdate(
              [...patches].map(([cid,patch])=>({cid,patch})),
              `doctor: cleaned ${patches.size} entr${patches.size===1?"y":"ies"}`);
            fixed=res.changed;
          }
          for (const g of d.exact){
            for (let i=1;i<g.length;i++){ await DB.merge(g[0].cid, g[i].cid); merged++; }
          }
        } catch(e){ print("could not apply everything: "+e.message,"a"); }
        await refreshSummary(); deptCache=null; updateBadge(); graphSync();
        print(`fixed: ${fixed} entr${fixed===1?"y":"ies"} cleaned, merged ${merged} duplicate${merged===1?"":"s"}.`,"g");
        print(`  undo reverses the merges one at a time, then the cleanup in one step.`,"d");
        if (d.review.length) print(`${d.review.length} possible duplicate pair${d.review.length===1?"":"s"} still need review — run 'doctor'`,"a");
        return;
      }
      print("DOCTOR REPORT  (dry run — nothing changed)","w");
      if (d.nameFixes.length){
        print(`  names — ${d.nameFixes.length} to tidy`,"w");
        d.nameFixes.forEach(x=>print(`    ${x.c.name.slice(0,26).padEnd(28)} -> ${x.after}`,"g"));
      }
      if (d.fldFixes.length){
        print(`  fields — ${d.fldFixes.length} entr${d.fldFixes.length===1?"y":"ies"} to clean`,"w");
        d.fldFixes.forEach(x=>x.f.forEach(f=>
          print(`    ${cidStr(x.c)} ${f.k}: "${String(x.c[f.k]??"")}" -> "${f.after}"`,"g")));
      }
      if (d.exact.length){
        print(`  duplicates — ${d.exact.length} auto-merge${d.exact.length===1?"":"s"}`,"w");
        d.exact.forEach(g=>{
          const total=g.reduce((s,c)=>s+c.qty,0);
          print(`    ${g.slice(1).map(c=>cidStr(c)).join("+")} -> into ${cidStr(g[0])} ${g[0].name} (qty ${total}, BIN ${g[0].bin})`,"a");
        });
      }
      if (d.review.length){
        print(`  review — ${d.review.length} possible duplicate${d.review.length===1?"":"s"} (never auto-merged)`,"w");
        d.review.forEach(([a,b])=>{
          print(`    ${cidStr(a)} ${a.name}  ~  ${cidStr(b)} ${b.name}`,"a");
          print(`      same thing? ->  merge ${cidStr(a)} ${cidStr(b)}`,"d");
        });
      }
      if (issues) print("apply safe fixes:  doctor apply   (single undo reverts)","d");
      return;
    }

    case "merge": {
      const parts=rest.split(/\s+/).filter(Boolean);
      if (parts.length!==2){ print("usage: merge <keep> <remove>  (names or C-IDs)","a"); return; }
      const ra=await resolve(parts[0]), rb=await resolve(parts[1]);
      for (const [r,lbl] of [[ra,parts[0]],[rb,parts[1]]]){
        if (r.err){ print(r.err,"a"); return; }
        if (r.many){ print(`"${lbl}" is ambiguous — use a C-ID:`,"a"); printRows(r.many); return; }
      }
      if (ra.c.cid===rb.c.cid){ print("that's the same component twice.","a"); return; }
      const dupName=rb.c.name;
      try { await DB.merge(ra.c.cid, rb.c.cid); }
      catch(e){ print("could not merge: "+e.message,"a"); return; }
      const kept=await DB.item(ra.c.cid);
      await refreshSummary(); deptCache=null; updateBadge(); graphSync();
      print(`merged ${dupName} into ${kept.name} — now qty ${kept.qty} in BIN ${binStr(kept.bin)}. (undo reverts)`,"g");
      return;
    }

    case "undo": case "u": await doUndo(); return;

    /* `who` says who is at this station. It is stored per DEVICE, like a theme: the
       bench tablet is "bench", the office PC is whoever sits there. There is no password
       and no login — this is ATTRIBUTION, not authentication, and the wording below says
       so rather than implying an audit trail it cannot deliver. */
    /* The shop key for THIS device. Deliberately not a login: there are no accounts, and
       everyone who has the key has the same access. It exists so a station on a network
       you do not trust can refuse strangers — not so it can tell two people apart. `who`
       is the one that answers who did something. */
    case "key": case "shopkey": {
      const k = rest.trim();
      if (!k){
        print(state.shopKey ? "this device is holding a key." : "this device has no key set.", state.shopKey?"g":"d");
        print("  set it:  key <the shop key>    ·  forget it:  key -","d");
        print("  the station itself never needs one — only devices reaching it over the network.","d");
        return;
      }
      if (k === "-" || k.toLowerCase() === "forget"){
        state.shopKey = ""; await save();
        print("key forgotten on this device.","d");
        return;
      }
      state.shopKey = k;
      await save();
      // Prove it before saying it worked: a key that is quietly wrong is worse than one
      // that is obviously wrong.
      try {
        await DB.stats();
        print("key accepted — this device can reach the shop.","g");
        await loadAll(); refreshHome(false); graphSync();
      } catch(e){
        state.shopKey = ""; await save();
        print("that key was refused. check it and try again.","a");
      }
      return;
    }

    case "who": case "iam": {
      const name = rest.trim();
      if (!name){
        if (state.operator){
          print(`this station is ${state.operator}.`,"g");
          print("  change it: who <name>   ·  clear it: who -","d");
        } else {
          print("nobody is set at this station — changes are logged as unattributed.","a");
          print("  set it: who <your name>","d");
        }
        return;
      }
      if (name === "-" || name.toLowerCase() === "nobody"){
        state.operator = ""; await save();
        print("cleared. changes from this station are logged as unattributed.","d");
        return;
      }
      state.operator = name.slice(0,40);
      await save();
      print(`this station is now ${state.operator}.`,"g");
      print("  every change made here is logged under that name.","d");
      print("  anyone can type any name — it answers who took the last one, not more.","d");
      return;
    }

    case "recent": case "log": {
      const p2=x=>String(x).padStart(2,"0");
      const stamp=l=>{ const d=new Date(l.ts);
        return `${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
      if (rest.toLowerCase()==="export"){
        const logRows=(await DB.log(1000)).rows.slice().reverse();
        const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
        const csv=["time,who,action"].concat(logRows.map(l=>
          `${new Date(l.ts).toISOString()},${q(l.operator)},${q(l.text)}`)).join("\n");
        print("ACTIVITY LOG CSV:","w");
        print("─".repeat(46),"d"); print(csv,"g"); print("─".repeat(46),"d");
        try{ await navigator.clipboard.writeText(csv); print("(copied to clipboard)","d"); }catch(e){}
        return;
      }
      let L=[], label="", opts=null;
      /* `recent by <name>` filters in the DATABASE, not in the page. Filtering a fetched
         page would silently mean "the last 200 rows, of which some are Dave's" rather
         than "Dave's last 200", which is a different and wrong answer. */
      const byM = rest.match(/^by\s+(.+)$/i);
      if (byM){ opts={by: byM[1].trim()}; label=` — by ${byM[1].trim()}`; }
      try { L=(await DB.log(200, opts)).rows.slice().reverse(); }
      catch(e){ print("could not read the activity log: "+e.message,"a"); return; }
      if (byM){ /* already filtered by the server */ }
      else if (rest.toLowerCase()==="today"){
        const mid=new Date(); mid.setHours(0,0,0,0);
        L=L.filter(l=>l.ts>=mid.getTime()); label=" — today";
      } else if (rest){
        const q=rest.toLowerCase();
        L=L.filter(l=>l.text.toLowerCase().includes(q)); label=` — "${rest}"`;
      }
      L=L.slice(-30).reverse();
      if (!L.length){ print("no matching activity.","d"); return; }
      print("RECENT ACTIVITY"+label+"  (newest first)","w");
      // Only pad a WHO column when there is something in it, so a single-operator shop
      // does not read a column of blanks.
      const anyWho = L.some(l=>l.operator);
      L.forEach(l=>{
        const who = anyWho ? "  " + (l.operator || "—").slice(0,12).padEnd(12) : "";
        print(`  ${stamp(l)}${who}  ${l.text}`, l.text.startsWith("undid")?"a":"g");
      });
      print("filter: recent take · recent today · recent by <name> · recent export · undo reverses","d");
      if (!anyWho) print("  nobody is set here — `who <name>` records who makes changes.","d");
      return;
    }

    case "stats": {
      await refreshSummary();
      const total=summary.pieces;
      print("STATS","w");
      print(`  unique components   ${summary.items}\n  total items         ${total}\n  bins used           ${summary.bins}\n  low stock           ${summary.low}`,"g");
      return;
    }

    case "export": {
      const ea=rest.trim().toLowerCase();
      if (ea==="xlsx"||ea==="excel"||ea==="xls"||ea.startsWith("xlsx ")||ea==="full"){
        await exportXlsx(ea==="full"||ea.includes("full")); return;
      }
      if (ea==="report"||ea==="pdf"){ await exportReport(); return; }
      if (ea==="photos"){ await exportPhotos(); return; }
      if (!await loadAll("export")) return;
      try { await DB.setMeta("last_export", String(Date.now())); }catch(e){}
      const csv=toCSV();
      print("CSV EXPORT — copy everything between the lines:","w");
      print("─".repeat(46),"d"); print(csv,"g"); print("─".repeat(46),"d");
      try{ await navigator.clipboard.writeText(csv); print("(also copied to clipboard)","d"); }catch(e){}
      print("also: export xlsx · export full (multi-sheet) · export report (pdf) · export photos · graph png","d");
      return;
    }

    case "import": {
      const a=rest.trim().toLowerCase();

      /* Moving a shop off the v20.2 HTML build. Deliberately two steps: the first run
         only REPORTS what would happen — how many items and projects, and every row that
         cannot come across — because an import that silently drops rows is worse than
         one that refuses. Nothing is written until `import legacy confirm`. */
      if (a==="legacy" || a.startsWith("legacy ")){
        const arg = rest.trim().slice(6).trim();
        if (arg.toLowerCase()==="confirm"){
          if (!legacyPending){ print("nothing staged — run: import legacy <file>","a"); return; }
          await runLegacyImport(legacyPending, false);
          return;
        }
        if (arg){ await runLegacyImport({path:arg}, true); return; }
        // no path: pick the .json the old download button produced. A .db has to come
        // by path — a browser cannot read a SQLite file.
        const inp=document.getElementById("legacyinput"); inp.value=""; inp.click();
        print("pick the .json the old build exported.","d");
        print("  an old invos.db must come by path:  import legacy C:/shop/invos.db","d");
        return;
      }

      if (a==="paste"){
        mode={type:"importpaste", buf:[]};
        setPS1("paste > ");
        print("paste rows from Excel/Google Sheets (or CSV), then type 'end'. 'cancel' aborts.","d");
        return;
      }
      // default: file picker (xlsx/xls/ods/csv…)
      importTarget=true;
      const inp=document.getElementById("sheetinput"); inp.value=""; inp.click();
      print("pick a spreadsheet — .xlsx .xls .xlsm .ods .csv .tsv  (or: import paste)","d");
      return;
    }

    case "template": {
      const csv="name,bin,qty,min,value,package,part,supplier,source,link,notes\n"
        +"Example Resistor 10k,1101,100,20,10kΩ 1/4W,THT,,Digikey,drawer A3,https://example.com,starter row — delete me\n";
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      a.download="inventory-template.csv"; a.click(); URL.revokeObjectURL(a.href);
      print("blank template downloaded — fill it in Excel/Sheets, then: import","g");
      return;
    }

    case "reset":
      if (rest.toLowerCase()==="confirm"){
        state={items:JSON.parse(JSON.stringify(SEED)), nextCid:SEED.length+1, seeded:true, seededDemo:true,
               classes:[...DEFAULT_CLASSES], sections:{...DEFAULT_SECTIONS}, log:[], undo:[],
               projects:[], nextPid:1, activePid:null, shopName:"", firstRun:true,
               counted:{}, countlog:[]};
        await save(); home(); print("inventory reset to demo seed.","a");
      } else print("this replaces ALL data with the demo seed. type: reset confirm","a");
      return;

    default: {
      const r=await search(t, {limit:200});
      if (r.length) printRows(r);
      else { print(`no matches for "${t}"`,"a"); print(`  add it:  add ${t} x1`,"d"); }
    }
  }
}

/* ---------- brain graph: zero-dependency force-directed canvas ---------- */
/* The graph gets its OWN bounded fetch. state.items is just the current screen, and
   a force simulation over 100,000 nodes is neither drawable nor useful, so the
   inventory view draws the first graphItemCap() parts and the label says when it is
   showing a sample. */
/* How many parts the graph will draw. Raised from 1,500 once the renderer stopped
   drawing each one as shapes — measured at 20,000 nodes the frame costs about 13ms,
   which leaves room to spare at 60fps.

   It used to ask for 1,500 in a single request while the server caps a page at 1,000,
   so the graph was quietly drawing 1,000 and the constant was lying. It pages now. */
const GRAPH_PAGE = 1000;              // the server's own per-request ceiling
function graphItemCap(){ return cfg("graphNodes"); }
let graphItems = [], graphItemsTotal = 0;
let graphItemsLoaded = false, graphItemsLoading = false;

async function refreshGraphItems(){
  try {
    const out = [];
    let total = 0;
    const cap = graphItemCap();
    while (out.length < cap){
      const page = await DB.peek({limit:GRAPH_PAGE, offset:out.length, sort:"bin"});
      total = page.total;
      out.push(...page.rows);
      if (!page.rows.length || out.length >= page.total) break;
    }
    graphItems = out; graphItemsTotal = total;
    graphItemsLoaded = true;
  } catch(e){ graphItems = []; graphItemsTotal = 0; }
}

/* ensureGraphItems fetches the graph's parts the first time they are needed.
   buildGraphData is synchronous and called from a dozen places (view switches, the
   HUD buttons, the physics loop), so it cannot await — it asks for the data and
   rebuilds itself once it lands. Without this the inventory graph drew its sun and
   nothing else, because the only thing that ever fetched was a save. */
function ensureGraphItems(){
  if (graphItemsLoaded || graphItemsLoading) return;
  graphItemsLoading = true;
  refreshGraphItems()
    .then(()=>{
      graphItemsLoading = false;
      if (graphMode!=="off"){
        buildGraphData(); updateGLabel();
        gAlpha = Math.max(gAlpha, 0.6);   // re-heat so the new nodes lay themselves out
        if (!gRAF) gTick();
      }
    })
    .catch(()=>{ graphItemsLoading = false; });
}
let graphMode="off", gNodes=[], gEdges=[], gAlpha=0, gRAF=null;
let gView={kind:"inv"};
let gWin=null, gPopCanvas=null, gPollTimer=null;      // second-monitor window
const gPopped = () => !!(gWin && !gWin.closed && gPopCanvas);
function gDims(){
  return gPopped()
    ? {cv:gPopCanvas, W:gWin.innerWidth,  H:gWin.innerHeight,  dpr:gWin.devicePixelRatio||1}
    : {cv:gc,         W:gpane.clientWidth, H:gpane.clientHeight, dpr:devicePixelRatio||1};
}
let gScale=1.6, gOX=0, gOY=0, gHover=null, gDrag=null, gPanning=false, gMoved=false, gLastXY=null;
let g3d=false, gStyle="holo", gCores=true;  // 3D toggle + look + white node cores
let gYaw=0.5, gPitch=-0.35, gAutoRot=true, gCamZ=520;
/* Where the drift is heading, and when it is allowed to start again.

   gSpinAx/gSpinAy is a unit vector in drag space: (1,0) is the plain horizontal spin the
   graph has always had, and a drag sets it to the direction the pointer actually moved,
   so letting go leaves the scene turning the way you were turning it. gSpinIdleAt is the
   moment the pointer was released; `spin resumes in` is measured from there. */
let gSpinAx=1, gSpinAy=0, gSpinIdleAt=0;
const PITCH_HOME = -0.35;     // the tilt a fresh graph opens at
let gHoming = false;          // easing the tilt back after a drag
let gHomeFrom = 0, gHomeT = 0;
const HOME_MS = 2600;         // deliberately unhurried; see gDrift
let gSpinFade = 1;            // 0..1, eases the spin back in instead of snapping it on
let gDriftT = 0;              // timestamp of the last drift step, for time-based motion
const gc=$("gcanvas"), gpane=$("graphpane");

let hudOn=true, sweepT=0;   // HUD frame + boot-sweep animation clock
// tunable settings (persisted in state.cfg) with metadata for the settings screen
const SETTINGS = [
  {k:"launchZoom", label:"launch zoom",    min:0.6, max:3,   step:0.1,  def:1.8,  fmt:v=>v.toFixed(1)+"x"},
  {k:"driftSpeed", label:"auto-orbit",     min:0,   max:0.01,step:0.0002,def:0.0022,fmt:v=>v===0?"off":(v*1000).toFixed(1)},
  {k:"glow",       label:"glow strength",  min:0,   max:2,   step:0.1,  def:1,    fmt:v=>Math.round(v*100)+"%"},
  {k:"dust",       label:"dust field",     min:0,   max:1,   step:1,    def:1,    fmt:v=>v?"on":"off"},
  {k:"labelZoom",  label:"part-label zoom", min:0.8,max:2.5, step:0.1,  def:1.1,  fmt:v=>v.toFixed(1)+"x"},
  // The galaxy view used to be a separate fork of the whole app. It is a setting now:
  // off, projects/parts is the only project view and the galaxy is hidden everywhere.
  {k:"galaxy",     label:"galaxy view",    min:0,   max:1,   step:1,    def:1,    fmt:v=>v?"on":"off"},
  // Orbit motion repaints every frame, so it is off by default and remembered per
  // device — turning it on is a deliberate choice about spending the GPU.
  {k:"orbit",      label:"orbit motion",   min:0,   max:1,   step:1,    def:0,    fmt:v=>v?"on":"off"},
  // The master speed from the orbit spec's tuning notes, which was buried in the code.
  {k:"orbitSpeed", label:"orbit speed",    min:0.2, max:3,   step:0.1,  def:1,    fmt:v=>v.toFixed(1)+"x"},
  {k:"orbitSize",  label:"orbit size",     min:0.3, max:1.5, step:0.05, def:1,    fmt:v=>v.toFixed(2)+"x"},
  // Dragging stops the drift. It used to stop it for good — the only way back was to
  // close the graph. These two decide what happens after you let go.
  {k:"spinResume", label:"spin resumes in", min:0,  max:15,  step:0.5,  def:4,    fmt:v=>v===0?"never":v.toFixed(1)+"s"},
  /* What the spin does when it comes back, as ONE choice rather than two settings that
     could contradict each other.

     auto-home   — eases the TILT back to level and spins the way it always does. The yaw
                   is left alone: yaw is the spin axis, so winding it back to a fixed
                   angle would read as the scene rewinding.
     follow drag — picks up the direction the drag was going, so it can come back turning
                   left-to-right, right-to-left or vertically depending on how you left it.

     They used to be separate, and the combination was the worst of both: homing forced
     the axis level while it ran, then handed control back to the drag axis the instant it
     finished, so the direction changed abruptly at the end of every home. */
  {k:"spinAfter",  label:"after a drag",   min:0,   max:1,   step:1,    def:0,    fmt:v=>v?"follow the drag":"auto-home"},
  // How many parts the graph will draw. Worth exposing now that it scales: a slow
  // machine can dial it down, and a big shop can push it up and watch the frame cost.
  {k:"graphNodes", label:"graph nodes",    min:1000,max:50000,step:1000,def:20000,fmt:v=>v>=1000?(v/1000)+"k":String(v)},
  // The graph otherwise repaints every frame forever, even sitting still: the force
  // simulation stops once it settles, but the drift and the redraw never do. On a shop
  // tablet that is battery burned on a picture that is not changing.
  {k:"idleStop",   label:"pause when idle", min:0,  max:1,   step:1,    def:1,    fmt:v=>v?"on":"off"},
];
function cfg(k){ const m=SETTINGS.find(s=>s.k===k); return (state.cfg&&state.cfg[k]!==undefined)?state.cfg[k]:m.def; }
function setCfg(k,v){ const m=SETTINGS.find(s=>s.k===k);
  v=Math.max(m.min,Math.min(m.max,Math.round(v/m.step)*m.step));
  state.cfg=state.cfg||{}; state.cfg[k]=v; return v; }
function updateHud(){
  if (typeof document==="undefined") return;
  document.body.classList.toggle("hud-on", hudOn && graphMode!=="off");
  const ctx=document.getElementById("hud-ctx"), stat=document.getElementById("hud-stat");
  if (ctx) ctx.textContent = gView.kind==="inv"?"NODE GRAPH // INVENTORY"
    : gView.kind==="galaxy"?"NODE GRAPH // GALAXY"
    : gView.kind==="projects"?"NODE GRAPH // PROJECTS" : "NODE GRAPH // PROJECT";
  if (stat){
    const nodes=gNodes.length, depts=new Set(graphItems.map(c=>clsNum(c.bin))).size;
    stat.textContent = `${g3d?"3D":"2D"} · ${nodes} NODES · ${depts} DEPT`;
  }
}
function updateGLabel(){
  let html;
  if (gView.kind==="inv") html="<b>INVENTORY</b> — every part, clustered by shelf";
  else if (gView.kind==="galaxy") html="<b>GALAXY</b> — projects as clusters · bright stars = shared parts";
  else if (gView.kind==="projects") html="<b>PROJECTS</b> — links = shared parts · click to drill in";
  else {
    const p=state.projects.find(x=>x.pid===gView.pid);
    html="<b>PROJECT</b> "+esc(p?p.name:"?")+" — its parts only · esc backs out";
  }
  $("glabel").innerHTML=html;
  if (gPopped()){ const l=gWin.document.getElementById("l"); if(l) l.innerHTML=html; }
}
function buildGraphData(){
  // Build once, when there is something to build. Laying out an empty graph and then
  // laying it out again when the parts arrive resets the simulation a second later —
  // which on screen is the view starting, running for a moment, and starting over.
  if (gView.kind==="inv" && !graphItemsLoaded){
    ensureGraphItems();
    gNodes=[]; gEdges=[];
    return;
  }
  const old=new Map(gNodes.map(n=>[n.id,n]));
  const nid=new Map(); const nodes=[]; const eset=new Set(); const edges=[];
  const addN=(id,type,label,extra={})=>{
    if (nid.has(id)) return nid.get(id);
    const prev=old.get(id);
    // Starting spread grows with the graph. Dropping 20,000 nodes into the same ±30
    // box the demo uses means they all start on top of each other, and the first frame
    // is one enormous shove outward.
    const spread = 60 * Math.max(1, Math.cbrt(Math.max(1, gNodes.length || 1)) / 2);
    const n={id,type,label,...extra,
      x:prev?prev.x:(Math.random()-0.5)*spread, y:prev?prev.y:(Math.random()-0.5)*spread,
      z:prev&&prev.z!==undefined?prev.z:(Math.random()-0.5)*spread,
      vx:0, vy:0, vz:0};
    nid.set(id,n); nodes.push(n); return n;
  };
  const addE=(a,b,w=1)=>{ const k=a+"|"+b; if(eset.has(k))return; eset.add(k); edges.push({a,b,w}); };

  if (gView.kind==="inv"){
    ensureGraphItems();   // first open has nothing yet; it repaints when it arrives
    /* central "sun": every department orbits SECTIONS */
    const sun=addN("SUN","sun","SECTIONS",{cmd:"home", count:graphItemsTotal});
    sun.x=0; sun.y=0; sun.z=0;                 // anchor at the origin
    /* EVERY part in the inventory, hanging off its section -> dept hubs -> sun */
    for (let d=0; d<10; d++){
      const its=graphItems.filter(c=>clsNum(c.bin)===d);
      if (!its.length) continue;
      addN("d"+d,"dept",clsLabel(d).split(" ")[0],{cmd:String(d),count:its.length});
      addE("d"+d,"SUN");
      new Set(its.map(c=>secOf(c.bin))).forEach(t=>{
        addN("s"+d+t,"sec",secLabel(d,t)||`${d}${t}00`,{cmd:`${d}${t}`,count:its.filter(c=>secOf(c.bin)===t).length});
        addE("s"+d+t,"d"+d);
      });
      its.forEach(c=>{
        addN("c"+c.cid,"part",c.name,{cmd:"info "+cidStr(c), low:c.qty<=c.min});
        addE("c"+c.cid,"s"+clsNum(c.bin)+secOf(c.bin));
      });
    }
  }
  else if (gView.kind==="projects"){
    /* central "PROJECTS" sun; each project is a cluster core orbiting the sun (far out);
       that project's parts orbit ITS core; faint trails link projects that share parts. */
    const sun=addN("SUN","sun","PROJECTS",{cmd:"graph projects", count:state.projects.length});
    sun.x=0; sun.y=0; sun.z=0;
    state.projects.forEach(p=>{
      addN("p"+p.pid,"proj",p.name,
        {cmd:"proj "+p.name, viewTo:{kind:"proj",pid:p.pid},
         active:p.pid===state.activePid, count:p.bom.length*6, core:true});
      addE("SUN","p"+p.pid);
      // this project's parts orbit its own core
      p.bom.forEach(l=>{
        const c = l.name!==undefined ? {cid:l.cid, name:l.name, qty:l.have, bin:l.bin, min:l.min} : null; if(!c) return;
        const nidk="pc"+p.pid+"_"+c.cid;
        addN(nidk,"part",c.name,{cmd:"info "+cidStr(c), low:c.qty<=c.min});
        addE("p"+p.pid, nidk, 1);
      });
    });
    // faint trails between projects that share parts (drawn dim in the renderer)
    for (let i=0;i<state.projects.length;i++) for (let j=i+1;j<state.projects.length;j++){
      const A=new Set(state.projects[i].bom.map(l=>l.cid));
      const shared=state.projects[j].bom.filter(l=>A.has(l.cid)).length;
      if (shared) addE("p"+state.projects[i].pid, "p"+state.projects[j].pid, -shared); // negative w = trail
    }
  }
  else if (gView.kind==="galaxy"){
    /* every project = a cluster core; its BOM parts orbit as stars; a shared part is
       ONE star wired to every project that uses it -> bright bridges between clusters.
       Optional time-grow: only show projects created up to gGalaxyT (ms) when scrubbing. */
    const cutoff = gView.t || Infinity;
    const projs = state.projects.filter(p=>(p.created||0)<=cutoff);
    projs.forEach(p=>{
      addN("p"+p.pid,"proj",p.name,
        {cmd:"proj "+p.name, viewTo:{kind:"proj",pid:p.pid},
         active:p.pid===state.activePid, count:p.bom.length*6, core:true});  // core=cluster center
    });
    // Each distinct part becomes one star, linked to every project that needs it.
    // The part details come from the BOM lines themselves — they arrive from the API
    // already joined with name, bin and live stock, and state.items is only ever the
    // rows currently on screen.
    const partUse={};   // cid -> [pid,...]
    const partInfo={};  // cid -> the joined line data
    projs.forEach(p=>p.bom.forEach(l=>{
      (partUse[l.cid] ||= []).push(p.pid);
      partInfo[l.cid] = l;
    }));
    Object.entries(partUse).forEach(([cid,pids])=>{
      const l=partInfo[cid]; if(!l) return;
      const c={cid:+cid, name:l.name, qty:l.have, min:l.min, bin:l.bin};
      const shared = pids.length>1;
      addN("c"+c.cid, shared?"shared":"part", c.name,
        {cmd:"info "+cidStr(c), low:c.qty<=c.min, shared});
      pids.forEach(pid=>addE("p"+pid, "c"+c.cid, shared?2:1));
    });
  }
  else { /* single project: the project + ONLY its added parts */
    const p=state.projects.find(x=>x.pid===gView.pid);
    if (!p){ gView={kind:"projects"}; return buildGraphData(); }
    addN("p"+p.pid,"proj",p.name,{cmd:"proj "+p.name, active:true, count:p.bom.length*6});
    p.bom.forEach(l=>{
      const c = l.name!==undefined ? {cid:l.cid, name:l.name, qty:l.have, bin:l.bin, min:l.min} : null; if(!c) return;
      addN("c"+c.cid,"part",`${l.need}x ${c.name}`,
        {cmd:"info "+cidStr(c), low:c.qty<l.need || c.qty<=c.min});
      addE("p"+p.pid,"c"+c.cid, l.need);
    });
  }
  // spawn new nodes near a linked neighbor for the live-growth feel
  nodes.forEach(n=>{
    if (old.has(n.id)) return;
    const e=edges.find(e=>e.a===n.id||e.b===n.id);
    if (e){ const o=nid.get(e.a===n.id?e.b:e.a);
      if (o && old.has(o.id)){ n.x=o.x+(Math.random()-0.5)*30; n.y=o.y+(Math.random()-0.5)*30; n.z=(o.z||0)+(Math.random()-0.5)*30; } }
  });
  gNodes=nodes; gEdges=edges.map(e=>({a:nid.get(e.a), b:nid.get(e.b), w:e.w}));
  gAlpha=0.9;
  gWake();
}
function hexA(h,a){ h=h.replace("#",""); if(h.length===3)h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function themeCol(){
  const cs=getComputedStyle(document.documentElement);
  const g=v=>cs.getPropertyValue(v).trim();
  return { bg:g("--bg"), fg:g("--green"), dim:g("--dimgreen"),
           amber:g("--amber"), white:g("--white"), cyan:g("--cyan") };
}
function nodeR(n){
  const base = n.type==="sun"?18 : n.type==="proj"?13 : n.type==="dept"?10 : n.type==="shared"?7 : n.type==="sec"?6.5 : 4.5;
  return base + Math.min(n.type==="sun"?8:4, (n.count||0)*0.05);
}
/* ── orbit mode ──────────────────────────────────────────────────────────────
   A "show mode" for the galaxy and projects views. Once the force layout has
   settled, every node stops being simulated and starts revolving: a project's parts
   around that project's core, the projects around the central sun.

   The orbits are CIRCLES on individually tilted 3D planes. Through the existing
   perspective camera they read as ellipses, which gives the planetary feel without
   the cost (or the tuning) of real Kepler ellipses.

   It repaints every frame, so it defaults OFF. */
let gOrbit = false, gOrbitInit = false;   // gOrbit mirrors cfg("orbit"); see the toggle
/* Orbits ease in rather than starting at full speed. By the time the layout has settled
   the nodes are barely moving — measured at 0.04 units a frame — and orbits run at 1.26,
   so switching straight to full speed is a 31x jump in one frame. The positions are
   continuous but the VELOCITY is not, which reads as drifting and then bursting into
   motion. This ramps 0 -> 1 over about a second. */
let gOrbitRamp = 0;
let gOrbitOrder = null;   // gNodes sorted parents-first; see stepOrbits

/* orbitParentMap derives the hierarchy from the edges that are already there:
   parts hang off their project, projects hang off the sun. Trail edges (w<0, the
   faint project-to-project links) are skipped — they are not a parent relationship. */
function orbitParentMap(){
  const parent = {};
  gEdges.forEach(e=>{
    if (e.w < 0) return;
    const at = e.a.type, bt = e.b.type;
    if (bt==="sun" || bt==="dept") parent[e.a.id] = e.b.id;
    else if (at==="sun" || at==="dept") parent[e.b.id] = e.a.id;
    else if (at==="proj" && bt!=="proj") parent[e.b.id] = e.a.id;
    else if (bt==="proj" && at!=="proj") parent[e.a.id] = e.b.id;
  });
  return parent;
}

/* initOrbits freezes the settled layout into orbital elements: each node keeps the
   radius and angle it already had, so switching the mode on does not make anything
   jump — it just starts moving from where it stopped. */
function initOrbits(){
  const parent = orbitParentMap(), byId = {};
  gNodes.forEach(n=>byId[n.id]=n);
  gNodes.forEach(n=>{
    const par = byId[parent[n.id]];
    if (!par || n.type==="sun"){ n.orb=null; return; }
    const dx=n.x-par.x, dy=n.y-par.y, dz=(n.z||0)-(par.z||0);
    /* The orbit radius is simply where the force layout left the node, which is why the
       orbits are as wide as the clusters are. orbitSize scales that: below 1 the parts
       pull in toward their project instead of sweeping the full width of the layout.
       It only affects the circle, never the layout that produced it. */
    const d0 = Math.max(12, Math.hypot(dx,dy,dz));
    const r = d0 * cfg("orbitSize");

    /* The orbit is stored as a BASIS, not as angles. u points at where the node already
       is; v is perpendicular to it in the orbital plane; the position is
       par + r*(u*cos + v*sin), so angle 0 IS the node's current position.

       The previous version stored a 3D radius alongside a 2D angle and a tilt chosen
       from a seed, which cannot reproduce the node's own position. Measured: every node
       jumped an average of 212 units on the first orbit frame, against a median frame
       movement of 0.6 — the "reset" a second after switching in. */
    // Normalise by the TRUE distance, not by the scaled radius: u and v have to be unit
    // vectors or `r*(u*cos + v*sin)` stops being a circle. Dividing by the scaled r left
    // |u| = 1/orbitSize, which turned every orbit into an ellipse that kept its original
    // width along u and only shrank across it.
    const ux=dx/d0, uy=dy/d0, uz=dz/d0;

    // A per-node axis gives each orbit its own plane. In 2D it must be the screen plane
    // or the circle collapses to a line.
    const seed = (n.cid || n.id.length*7) + r;
    let ax, ay, az;
    if (g3d){ ax=Math.sin(seed*1.7); ay=Math.cos(seed*2.3); az=Math.sin(seed*3.1+1); }
    else { ax=0; ay=0; az=1; }

    // v = normalise(axis x u) — perpendicular to the radius, inside the orbital plane
    let vx=ay*uz-az*uy, vy=az*ux-ax*uz, vz=ax*uy-ay*ux;
    let vl=Math.hypot(vx,vy,vz);
    if (vl<1e-6){ vx=uy; vy=-ux; vz=0; vl=Math.hypot(vx,vy,vz)||1; }  // axis parallel to u
    vx/=vl; vy/=vl; vz/=vl;

    const speed = (0.15 + 0.5/Math.sqrt(r)) * (seed%2 ? 1 : -1) * 0.02;
    n.orb = { parent:par.id, r, ang:0, speed, ux, uy, uz, vx, vy, vz };
  });
  /* Depth-sort so every parent is stepped before its children. Nodes whose parent chain
     does not resolve keep their original relative order at the end. */
  const depth = {}, byId2 = {};
  gNodes.forEach(n=>byId2[n.id]=n);
  const depthOf = (n, guard) => {
    if (depth[n.id] !== undefined) return depth[n.id];
    if (guard > 64) return (depth[n.id] = 0);          // cycle: treat as a root
    const par = n.orb && byId2[n.orb.parent];
    return (depth[n.id] = par ? depthOf(par, guard+1) + 1 : 0);
  };
  gNodes.forEach(n=>depthOf(n, 0));
  gOrbitOrder = gNodes.slice().sort((a,b)=>depth[a.id]-depth[b.id]);

  gOrbitRamp = 0;          // ease in from a standstill
  gOrbitInit = true;
}

/* recaptureOrbit re-derives ONE node's orbital elements from where it currently sits.
   Used after a drag: the node keeps the radius and angle you left it at and carries on
   from there, instead of snapping back to where its orbit used to be. */
function recaptureOrbit(n){
  if (!n || !n.orb) return;
  const byId={}; gNodes.forEach(x=>byId[x.id]=x);
  const par=byId[n.orb.parent]; if (!par) return;
  const dx=n.x-par.x, dy=n.y-par.y, dz=(n.z||0)-(par.z||0);
  const r = Math.max(12, Math.hypot(dx,dy,dz));
  const o = n.orb;
  // Re-aim the basis at where it was dropped and restart the angle there, so it carries
  // on from the new spot instead of snapping back to the old ring.
  o.r=r; o.ang=0; o.ux=dx/r; o.uy=dy/r; o.uz=dz/r;
  const ax=0, ay=0, az=1;                       // keep the new plane upright and stable
  let vx=ay*o.uz-az*o.uy, vy=az*o.ux-ax*o.uz, vz=ax*o.uy-ay*o.ux;
  let vl=Math.hypot(vx,vy,vz);
  if (vl<1e-6){ vx=o.uy; vy=-o.ux; vz=0; vl=Math.hypot(vx,vy,vz)||1; }
  o.vx=vx/vl; o.vy=vy/vl; o.vz=vz/vl;
}

/* stepOrbits advances every orbit one frame. The sun stays pinned at the origin. */
/* stepOrbits(dt, blend)
   dt advances the orbital angle; blend is how far the node is pulled onto its orbit,
   0 meaning "leave it where the force layout put it" and 1 meaning "on the orbit".

   Ramping the SPEED from zero — which is what this used to do — meant the handoff read
   as settle, freeze, accelerate: for about ten frames nothing moved at all, because an
   angle that is not advancing leaves every node exactly where it was captured. Blending
   the POSITION instead lets the layout carry on settling underneath while the orbits
   fade in over the top, so the cluster stays alive and then takes off. */
/* Orbits are a HIERARCHY — a part orbits its project, the project orbits the sun — so a
   node's position is only meaningful once its parent is already in this frame's place.
   Stepping gNodes in array order gets that wrong whenever a child happens to sit before
   its parent: the child is placed against the parent's previous position and trails it
   forever by however far the parent moved.

   That stayed invisible while orbits were captured at exactly the radius the layout had
   left the node at, because then a parent only ever moved a unit or so per frame. It
   surfaced the moment `orbit size` could move a parent a long way: measured, a part with
   a captured radius of 307 sat 450 from its project and never converged.

   gOrbitOrder is that parents-first order, built once when the orbits are captured. */
/* One frame of drift. `spin follows drag` mixes between the level horizontal spin and
   the direction of the last drag; at 0 this is exactly `gYaw += driftSpeed`, which is
   what the graph did before.

   The vertical part BOUNCES at the pitch limit instead of pressing against it. Pitch is
   clamped to +-1.4 (past that you are looking at the scene edge-on and then upside down),
   so a drift with any vertical component would otherwise slide to the stop within a few
   seconds and sit there, which reads as the rotation dying on its own. */
/* Remember which way the pointer is going, smoothed, so a single jittery frame at the
   end of a drag does not decide the axis. Tiny movements are ignored: releasing after a
   near-stationary drag should leave the axis alone, not point it at the last stray pixel. */
function gSpinNote(dx, dy){
  const m = Math.hypot(dx, dy);
  if (m < 0.5) return;
  const nx = dx/m, ny = dy/m;
  gSpinAx += (nx - gSpinAx)*0.25;
  gSpinAy += (ny - gSpinAy)*0.25;
  const l = Math.hypot(gSpinAx, gSpinAy) || 1;
  gSpinAx /= l; gSpinAy /= l;
}

/* One step of drift, in TIME rather than in frames.

   `gYaw += driftSpeed` every frame ties the rotation rate to how fast frames happen: a
   144Hz screen spins nearly two and a half times faster than a 60Hz one, and — the part
   you can see — a single long frame turns the scene by the same amount as a short one,
   so every hitch in the frame rate is a hitch in the motion. Scaling by elapsed time
   makes a dropped frame turn the scene further instead of stalling it, which is what
   "smooth" actually means here.

   The step is capped at three frames' worth. After a tab has been in the background for
   a minute the elapsed time is enormous, and without the cap the scene would snap round
   to wherever it "should" be the instant you came back. */
function gDrift(){
  const sp = cfg("driftSpeed");
  if (!sp) return;
  const now = performance.now();
  const dt = gDriftT ? Math.min(50, now - gDriftT) : 16.7;
  gDriftT = now;
  const k = dt/16.7;                      // 1.0 at 60fps, and the units stay unchanged

  if (gHoming){
    /* Ease the tilt home over a fixed span with SMOOTHERSTEP, which leaves at zero speed
       and arrives at zero speed. The first version was exponential: that starts at full
       speed, so the home began with a visible lurch and then crept the last of the way.
       This one has no jerk at either end, and at 2.6s it is slow enough to read as the
       scene settling rather than as a correction being applied to it. */
    gHomeT = Math.min(1, gHomeT + dt/HOME_MS);
    const t = gHomeT*gHomeT*gHomeT*(gHomeT*(gHomeT*6 - 15) + 10);
    gPitch = gHomeFrom + (PITCH_HOME - gHomeFrom)*t;
    if (gHomeT >= 1){ gPitch = PITCH_HOME; gHoming = false; }
  }

  /* In auto-home mode the axis is level for good — not just while the ease runs. Handing
     the drag axis back at the end of the home was a direction change out of nowhere. */
  const follow = (gHoming || !cfg("spinAfter")) ? 0 : 1;
  let ax = 1 + (gSpinAx - 1)*follow, ay = gSpinAy*follow;

  /* Vertical rotation is damped to 0.6 because pitch has far less room than yaw. That
     alone made a mostly-vertical drift visibly SLOWER than a level one — a straight-up
     drag left yaw at a third of its rate and pitch at 60% of that. Normalising by the
     same factor keeps the on-screen rate identical whichever way you left it pointing. */
  const mag = Math.hypot(ax, ay*0.6) || 1;
  ax /= mag; ay /= mag;

  /* Ease the rate in. Resuming used to go from a dead stop to the full rate between one
     frame and the next, which is a velocity step — the same discontinuity the orbit
     handoff had, and it reads the same way. */
  gSpinFade = Math.min(1, gSpinFade + dt/800);
  const f = gSpinFade*gSpinFade*(3 - 2*gSpinFade);

  gYaw += sp*ax*k*f;
  if (ay){
    /* Fade the vertical component out as the tilt runs out of room, rather than
       reversing at the stop. A bounce is an instant change of direction — the jankiest
       thing in the frame — and this settles into a level spin instead. */
    const head = (1.4 - Math.abs(gPitch))/0.35;
    const fade = Math.max(0, Math.min(1, head));
    if (fade <= 0) gSpinAy = 0;
    gPitch += sp*ay*0.6*k*fade*f;
  }
}

/* Bring the drift back some seconds after the pointer was released. 0 means never, which
   is the old behaviour: a drag stops the spin until the graph is reopened. */
/* True while the drift is waiting out its delay after a drag. The frame loop parks itself
   when nothing is moving, so without this the countdown would stop with it and the spin
   would only come back the next time something else woke the graph. */
/* `pause when idle` exists to stop burning frames on a picture that is not changing. A
   drifting 3D scene IS changing, so it does not qualify — this used to park the loop the
   moment the layout settled, which stopped the auto-orbit a second or two after opening
   the graph and made it look like the setting did nothing. Turn `auto-orbit` down to 0
   and the graph parks as before. */
function gDrifting(){
  return g3d && gAutoRot && cfg("driftSpeed") > 0;
}

function gSpinPending(){
  return !gAutoRot && !!gSpinIdleAt && cfg("spinResume") > 0 && cfg("driftSpeed") > 0;
}

function gSpinMaybeResume(){
  if (gAutoRot || gLastXY) return;
  const wait = cfg("spinResume");
  if (!wait || !gSpinIdleAt) return;
  if (performance.now() - gSpinIdleAt < wait*1000) return;
  gAutoRot = true;
  gDriftT = 0;                        // start the clock fresh, not from before the drag
  gSpinFade = 0;                      // and ease the rate up rather than snapping it on
  if (!cfg("spinAfter") && Math.abs(gPitch - PITCH_HOME) > 0.002){
    gHoming = true; gHomeFrom = gPitch; gHomeT = 0;
  }
}

function stepOrbits(dt, blend){
  if (blend === undefined) blend = 1;
  const byId = {};
  gNodes.forEach(n=>byId[n.id]=n);
  const order = gOrbitOrder && gOrbitOrder.length ? gOrbitOrder : gNodes;
  order.forEach(n=>{
    if (n.type==="sun"){ n.x=0; n.y=0; n.z=0; return; }
    const o = n.orb; if (!o) return;
    const par = byId[o.parent]; if (!par) return;
    o.ang += o.speed*dt;
    // par + r*(u*cos + v*sin): a circle of radius r in the plane spanned by u and v,
    // which at angle 0 is exactly where the node was when the orbit was captured.
    const c=Math.cos(o.ang), sn=Math.sin(o.ang);
    const ox = par.x + o.r*(o.ux*c + o.vx*sn);
    const oy = par.y + o.r*(o.uy*c + o.vy*sn);
    const oz = (par.z||0) + o.r*(o.uz*c + o.vz*sn);
    if (blend >= 1){ n.x=ox; n.y=oy; n.z=oz; }
    else { n.x += (ox-n.x)*blend; n.y += (oy-n.y)*blend; n.z += (oz-n.z)*blend; }
  });
}

/* ── the force simulation ────────────────────────────────────────────────────
   Split out of gTick so it can be profiled on its own: the simulation and the drawing
   have completely different costs and completely different fixes, and timing them
   together tells you nothing about which one to work on.

   Measured before any of this existed: repulsion compared every node against every
   other, so cost grew with the SQUARE of the node count. 500 nodes cost 2.7ms a frame;
   15,000 cost 1.7 SECONDS. That is the wall, and drawing was never the problem.

   Two paths now:
   - small graphs keep the exact all-pairs solver, so the shape of a normal shop's
     graph is bit-for-bit what it always was
   - large graphs switch to a spatial grid, which only compares nodes that are near
     enough to matter
