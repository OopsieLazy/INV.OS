    case "class": case "sec": case "section": {
      // delete/clear a section:  class 51 clear   ·   class 51 del   ·   class 51 -
      const del=rest.match(/^(\d{2})\s+(clear|del|delete|-|x|remove)$/i);
      if (del){
        const key=del[1];
        const inUse=(await DB.peek({dept:+key[0], sec:+key[1], limit:1})).total > 0;
        if (inUse){ print(`section ${key}0 has items — move or remove them first (open ${key}).`,"a"); return; }
        const before=state.sections[key]||null;
        if (before===null){ print(`section ${key}0 has no custom name.`,"d"); return; }
        delete state.sections[key];
        logAct(`cleared section name ${key}0 (was ${before})`, {type:"section", key, before});
        await save(); print(`section ${key}0 name cleared.`,"g"); return;
      }
      const m=rest.match(/^(\d{1,2})\s*=?\s*(.+)$/);
      if (!m){ print("name a shelf:  class 3 = METALWORKING   ·   class 51 = PLA   ·   class 51 clear","d"); return; }
      const label=m[2].trim().toUpperCase();
      if (m[1].length===1){
        const before=clsLabel(+m[1]);
        state.classes[+m[1]]=label;
        logAct(`renamed dept ${m[1]}000: ${before} -> ${label}`, {type:"class", n:+m[1], before});
        await save(); print(`${m[1]}000 is now ${label}`,"g");
      } else {
        const before=state.sections[m[1]]||null;
        state.sections[m[1]]=label;
        logAct(`named section ${m[1]}00: ${before||"—"} -> ${label}`, {type:"section", key:m[1], before});
        await save(); print(`${m[1]}00 is now ${label}`,"g");
      }
      return;
    }
    case "sections": case "shelves": {
      await renderSectionMgr();
      return;
    }

    case "__secedit": {   // internal: __secedit <code>  (code = dept "3" or section "51")
      const code=rest.trim();
      mode={type:"secedit", code};
      const isDept=code.length===1;
      const cur=isDept?clsLabel(+code):(state.sections[code]||"");
      print(isDept?`rename department ${code}000`:`name section ${code}0`,"w");
      print("blank = "+(isDept?"keep":"clear")+" · 'cancel' aborts","d");
      setPS1(`  ${isDept?"dept":"section"} ${code}${isDept?"000":"0"}${cur?" ["+cur+"]":""}: `);
      return;
    }

    case "__secadd": {    // internal: prompt for a new section code+name under a dept
      mode={type:"secadd", step:0, dept:rest.trim()};
      print(`add a section under ${rest}000 ${clsLabel(+rest)}`,"w");
      print("pick a free section digit 1-9 (0 = misc)","d");
      setPS1(`  section digit: `);
      return;
    }

    case "map": case "classes": {
      for (let n=0;n<10;n++){
        const items=(await DB.peek({dept:n, limit:1000})).rows;
        print(`  ${n}000  ${clsLabel(n).slice(0,26).padEnd(28)}${items.length?String(items.length).padStart(3)+" items":"  ·"}`,
              "g", String(n));
        const secs=new Set(items.map(c=>secOf(c.bin)));
        Object.keys(state.sections).filter(k=>+k[0]===n).forEach(k=>secs.add(+k[1]));
        [...secs].sort((a,b)=>a-b).forEach(tt=>{
          const cnt=items.filter(c=>secOf(c.bin)===tt).length;
          const lbl=secLabel(n,tt);
          print(`         ${n}${tt}00  ${(lbl||"—").slice(0,22).padEnd(24)}${cnt?cnt:"·"}`,
                lbl?"g":"d", `${n}${tt}`);
        });
      }
      print("name things:  class 3 = METALWORKING · class 51 = PLA · remap 15 35 renumbers","d");
      return;
    }
    case "remap": {
      if (needsAll("remap")) return;
      const m=rest.match(/^(\d{1,4})\s+(\d{1,4})$/);
      if (!m){ print("renumber:  remap 1 3 (dept) · remap 15 35 (section) · remap 1501 3501 (bin)","d"); return; }
      const [a,b]=[m[1],m[2]];
      if (a.length!==b.length){ print("both numbers must be the same length","a"); return; }
      const hits=state.items.filter(c=>binStr(c.bin).startsWith(a));
      if (!hits.length){ print(`no bins under ${a}…`,"a"); return; }
      snapshotUndo(`remap ${a}xx -> ${b}xx (${hits.length} entries)`);
      hits.forEach(c=>{ c.bin=parseInt(b+binStr(c.bin).slice(a.length),10); });
      await save();
      print(`moved ${hits.length} entr${hits.length===1?"y":"ies"}: ${a}… -> ${b}…  (undo reverts)`,"g");
      return;
    }

    case "move": {
      const m=rest.match(/^(.*?)\s+@?(\d{1,4})$/);
      if (!m){ print("usage: move <name|C-ID> <bin>","a"); return; }
      const r=await resolve(m[1].trim());
      if (r.err){ print(r.err,"a"); return; }
      if (r.many){ print("be more specific:","a"); printRows(r.many); return; }
      let moved;
      try { moved = await DB.edit(r.c.cid, {bin: parseInt(m[2],10)}); }
      catch(e){ print("could not move it: "+e.message,"a"); return; }
      await refreshSummary(); deptCache=null; updateBadge(); graphSync();
      const n=clsNum(moved.bin), sl=secLabel(n,secOf(moved.bin));
      print(`${moved.name} -> BIN ${binStr(moved.bin)} (${clsLabel(n)}${sl?" / "+sl:""})`,"g");
      return;
    }

    case "edit": {
      const r=await resolve(rest);
      if (r.err){ print(r.err,"a"); return; }
      if (r.many){ print("be more specific:","a"); printRows(r.many); return; }
      startEdit(r.c); return;
    }

    case "del": case "rm": {
      const bm=rest.match(/^(?:bin\s+)?(\d{3,4})$/);
      if (bm){
        const b=parseInt(bm[1],10), its=(await DB.peek({bin:b, limit:1000})).rows;
        if (its.length>1){
          printRows(its);
          mode={type:"confirmbin", bin:b, items:its};
          setPS1(`delete ALL ${its.length} entries in BIN ${binStr(b)}? [y/n] `);
          return;
        }
      }
      const r=await resolve(rest);
      if (r.err){ print(r.err,"a"); return; }
      if (r.many){ print("be more specific:","a"); printRows(r.many); return; }
      mode={type:"confirm", c:r.c};
      setPS1(`delete ${r.c.name} (${cidStr(r.c)})? [y/n] `);
      return;
    }

    case "take": case "add-stock": case "stock": {
      const m=rest.match(/^(.*?)(?:\s+(\d+))?$/);
      const r=await resolve(m[1].trim());
      if (r.err){ print(r.err,"a"); return; }
      if (r.many){ print("be more specific:","a"); printRows(r.many); return; }
      const n=parseInt(m[2]||"1",10);
      // One atomic statement on the server. Two people taking from the same bin at
      // the same moment both get counted; a read-modify-write here would lose one.
      const before = r.c.qty;
      let after;
      try { after = await DB.adjust(r.c.cid, v==="take" ? -n : n); }
      catch(e){ print("could not update stock: "+e.message,"a"); return; }
      await refreshSummary(); deptCache=null; updateBadge(); graphSync();
      if (v==="take"){
        const taken = before - after.qty;
        print(`took ${taken} × ${after.name} from BIN ${after.bin} — ${after.qty} left${taken<n?` (only had ${taken})`:""}`,
              after.qty<=after.min?"a":"g");
        if (after.qty<=after.min) print(`  <LOW> at/below minimum (${after.min})`,"a");
      } else {
        print(`added ${n} × ${after.name} to BIN ${after.bin} — now ${after.qty}`,"g");
      }
      return;
    }

    case "list": case "ls": case "l": case "bins": {
      if (/^\d$/.test(rest)){ await listClass(+rest); return; }
      let shown=0;
      for (let n=0;n<10;n++){
        const items=(await DB.peek({dept:n, sort:"bin", limit:1000})).rows;
        if (!items.length) continue;
        print(`${n}00  ${clsLabel(n)}`,"w");
        printRows(items); shown+=items.length;
      }
      if (!shown){ print("inventory empty — add something: add 10k resistor x50","d"); return; }
      print(`${shown} entries · esc home · tab ↓ browse`,"d");
      term.scrollTop=0;
      return;
    }

    case "low": {
      const lowQ = {low:1, sort:"bin", limit:1000};
      let scope="";
      if (/^\d$/.test(rest)){ lowQ.dept=+rest; scope=` in ${clsLabel(+rest)}`; }
      else if (/^\d\d$/.test(rest)){
        lowQ.dept=+rest[0]; lowQ.sec=+rest[1];
        scope=` in ${secLabel(+rest[0],+rest[1])||rest+"00"}`;
      }
      const lows=(await DB.items(lowQ)).rows;
      if(!lows.length){ print(`nothing low${scope} — stock is healthy.`,"g"); return; }
      print("LOW STOCK"+scope.toUpperCase(),"w");
      lows.forEach(c=>print(`  ${c.name.slice(0,26).padEnd(28)}BIN ${binStr(c.bin).padEnd(7)}qty ${c.qty} / min ${c.min}`,"a","info "+cidStr(c)));
      return;
    }

    case "proj": case "project": {
      if (notPorted("Projects / BOM", "Tracked as P5.")) return;
      const toks0=rest.split(/\s+/);
      const sub=(toks0[0]||"").toLowerCase();
      const r2=rest.slice((toks0[0]||"").length).trim();
      if (!rest){
        if (!state.projects.length){ print("no projects yet — proj new <name>","d"); return; }
        print("PROJECTS","w");
        state.projects.forEach(p=>{
          const st=projStats(p);
          const act=p.pid===state.activePid?"  *active":"";
          print(`  ${p.name.slice(0,22).padEnd(24)}[${p.status}]${(" ").repeat(Math.max(1,10-p.status.length))}${String(st.ready).padStart(3)}% ready  ${p.bom.length} part line${p.bom.length===1?"":"s"}${act}`,
                st.shorts.length?"a":"g", "proj "+p.name);
        });
        print("open: proj <name> · new: proj new <name> · p key adds selected part to the active one","d");
        return;
      }
      if (sub==="new"){
        if (!r2){ print("proj new <name>","a"); return; }
        if (state.projects.some(p=>p.name.toLowerCase()===r2.toLowerCase())){ print("project already exists.","a"); return; }
        projSnap(`created project ${r2}`);
        state.projects.push({pid:state.nextPid++, name:r2, status:"planning", bom:[], created:Date.now()});
        state.activePid=state.nextPid-1;
        await save();
        print(`project ${r2} created and active — proj add ${r2} 2x <part>, or select any row and press p`,"g");
        return;
      }
      if (sub==="add"){
        const t2=r2.split(/\s+/);
        const pr=resolveProj(t2[0]); if (pr.err){ print(pr.err,"a"); return; }
        let qty=1;
        const query=t2.slice(1).filter(t=>{
          if (/^\d+x$/i.test(t)){ qty=parseInt(t,10); return false; }
          if (/^x\d+$/i.test(t)){ qty=parseInt(t.slice(1),10); return false; }
          return true;
        }).join(" ");
        const rr=await resolve(query); if (rr.err){ print(rr.err,"a"); return; }
        if (rr.many){ print("be more specific:","a"); printRows(rr.many); return; }
        projSnap(`bom: +${qty}x ${rr.c.name} -> ${pr.p.name}`);
        const line=pr.p.bom.find(l=>l.cid===rr.c.cid);
        if (line) line.need+=qty; else pr.p.bom.push({cid:rr.c.cid, need:qty});
        await save(); printProj(pr.p); return;
      }
      if (sub==="rm"||sub==="remove"){
        const t2=r2.split(/\s+/);
        const pr=resolveProj(t2[0]); if (pr.err){ print(pr.err,"a"); return; }
        const rr=await resolve(t2.slice(1).join(" ")); if (rr.err){ print(rr.err,"a"); return; }
        if (rr.many){ print("be more specific:","a"); printRows(rr.many); return; }
        projSnap(`bom: removed ${rr.c.name} from ${pr.p.name}`);
        pr.p.bom=pr.p.bom.filter(l=>l.cid!==rr.c.cid);
        await save(); printProj(pr.p); return;
      }
      if (sub==="shop"){
        const pr=resolveProj(r2); if (pr.err){ print(pr.err,"a"); return; }
        const st=projStats(pr.p);
        if (!st.shorts.length){ print(`nothing to buy for ${pr.p.name} — all parts on hand.`,"g"); return; }
        print(`SHOPPING LIST — ${pr.p.name}`,"w");
        st.shorts.forEach(x=>print(`  ${x.short}x  ${x.c?x.c.name:"(deleted part)"}${x.c&&x.c.part&&x.c.part!=="-"&&x.c.part?"   ("+x.c.part+")":""}`,"a"));
        return;
      }
      if (sub==="done"||sub==="status"){
        const t2=r2.split(/\s+/);
        const stt = sub==="done" ? "done" : (t2.pop()||"").toLowerCase();
        const pname = sub==="done" ? r2 : t2.join(" ");
        if (!["planning","building","done"].includes(stt)){ print("status: planning | building | done","a"); return; }
        const pr=resolveProj(pname); if (pr.err){ print(pr.err,"a"); return; }
        projSnap(`${pr.p.name} status -> ${stt}`);
        pr.p.status=stt; await save(); print(`${pr.p.name} -> [${stt}]`,"g"); return;
      }
      if (sub==="del"){
        const pr=resolveProj(r2); if (pr.err){ print(pr.err,"a"); return; }
        projSnap(`deleted project ${pr.p.name}`);
        state.projects=state.projects.filter(p=>p!==pr.p);
        if (state.activePid===pr.p.pid) state.activePid=null;
        await save(); print(`project ${pr.p.name} deleted. (undo restores)`,"a"); return;
      }
      if (sub==="print"){
        const pr=resolveProj(r2); if (pr.err){ print(pr.err,"a"); return; }
        if (!pr.p.bom.length){ print("nothing to print — the BOM is empty.","a"); return; }
        printSheet(pr.p);
        print(`pick list for ${pr.p.name} sent to print — sorted by bin.`,"g");
        return;
      }
      if (sub==="use"){
        const pr=resolveProj(r2); if (pr.err){ print(pr.err,"a"); return; }
        state.activePid=pr.p.pid; await save();
        print(`${pr.p.name} is now active — p on any selected row adds to it`,"g"); return;
      }
      const pr=resolveProj(rest); if (pr.err){ print(pr.err,"a"); return; }
      state.activePid=pr.p.pid; await save();
      printProj(pr.p); return;
    }

    case "build": {
      if (notPorted("Build / pick list", "Needs projects first (P5).")) return;
      const t2=rest.split(/\s+/);
      const partial=t2[t2.length-1]?.toLowerCase()==="partial";
      const pname=partial?t2.slice(0,-1).join(" "):rest;
      const pr=resolveProj(pname); if (pr.err){ print(pr.err,"a"); return; }
      if (!pr.p.bom.length){ print("project has no parts yet.","a"); return; }
      const st=projStats(pr.p);
      if (st.shorts.length && !partial){
        print(`can't build ${pr.p.name} — ${st.shorts.length} shortage${st.shorts.length===1?"":"s"}:`,"a");
        st.shorts.forEach(x=>print(`  need ${x.short} more ${x.c?x.c.name:"(deleted part)"}`,"a"));
        print(`proj shop ${pr.p.name} for the buy list · or: build ${pr.p.name} partial`,"d");
        return;
      }
      snapshotUndo(`built ${pr.p.name}${partial?" (partial)":""}`);
      let taken=0;
      pr.p.bom.forEach(l=>{
        const c=state.items.find(i=>i.cid===l.cid); if(!c) return;
        const t3=Math.min(l.need,c.qty); c.qty-=t3; taken+=t3;
      });
      pr.p.status="building";
      await save();
      print(`built ${pr.p.name} — took ${taken} pcs across ${pr.p.bom.length} BOM line${pr.p.bom.length===1?"":"s"}. (one undo returns everything)`,"g");
      print(`  paper pick list: proj print ${pr.p.name}`,"d");
      const lows=summary.low;
      if (lows) print(`  ${lows} part${lows===1?"":"s"} now low — 'low'`,"a");
      return;
    }

    case "create": case "new": {
      const m2=rest.match(/^(?:project|proj)\s+(.+)$/i);
      if (m2){ await exec("proj new "+m2[1]); return; }
      print("create project <name>","d"); return;
    }

    case "install": {
      if (installPrompt){
        installPrompt.prompt();
        const r=await installPrompt.userChoice;
        installPrompt = r.outcome==="accepted" ? null : installPrompt;
        print(r.outcome==="accepted" ? "installing…" : "install dismissed.", "d");
        updateBadge(); return;
      }
      if (matchMedia("(display-mode: standalone)").matches){ print("already running as an installed app.","g"); return; }
      print(isSecure
        ? "no install prompt available — use the browser menu: Install app / Add to Home Screen."
        : "installing needs https. host the folder (GitHub Pages works) and open it there — that also enables camera scanning.","a");
      return;
    }

    case "backup": {
      if (notPorted("File auto-backup", "Copy the .db file shown by `health`.")) return;
      if (rest.toLowerCase()==="off"){
        backupHandle=null; await idb("readwrite", st=>st.delete("file"));
        print("auto-backup off.","d"); updateBadge(); return;
      }
      if (rest.toLowerCase()==="now" || !window.showSaveFilePicker){
        if (backupHandle && await writeBackup()) print("backed up.","g");
        else { downloadBackup(); await save(); print("backup downloaded.","g"); }
        updateBadge(); return;
      }
      try{
        backupHandle=await showSaveFilePicker({suggestedName:"invos-backup.json",
          types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
        await idb("readwrite", st=>st.put(backupHandle,"file"));
        await writeBackup();
        print("auto-backup on — this file rewrites itself as you work. 'backup off' stops it.","g");
      }catch(e){ print("backup cancelled.","d"); }
      updateBadge(); return;
    }

    case "labels": case "label": {
      let bins=[];
      const binQuery = async o => [...new Set((await DB.peek(Object.assign({limit:1000, sort:"bin"}, o))).rows.map(c=>c.bin))].sort((a,b)=>a-b);
      if (!rest) bins=await binQuery({});
      else if (/^\d$/.test(rest)) bins=await binQuery({dept:+rest});
      else if (/^\d\d$/.test(rest)) bins=await binQuery({dept:+rest[0], sec:+rest[1]});
      else if (/^\d{3,4}$/.test(rest)) bins=[parseInt(rest,10)];
      else { print("labels · labels 1 (dept) · labels 15 (section) · label 1101 (one bin)","d"); return; }
      if (!bins.length){ print("no bins in that range yet.","a"); return; }
      await labelSheet(bins);
      print(`${bins.length} label${bins.length===1?"":"s"} sent to print — 62×29 mm with QR codes. any printer works; a label printer's driver will fit them to its media.`,"g");
      return;
    }

    case "scan": await startScan(); return;

    case "count": {
      if (notPorted("Cycle count", "Tracked as P6.")) return;
      const a=rest.trim().toLowerCase();
      let items=(await DB.peek({limit:1000, sort:"bin"})).rows; let scope="all";
      if (/^\d$/.test(a)){ items=items.filter(c=>clsNum(c.bin)===+a); scope=clsLabel(+a); }
      else if (/^\d\d$/.test(a)){ items=items.filter(c=>clsNum(c.bin)===+a[0]&&secOf(c.bin)===+a[1]); scope=secLabel(+a[0],+a[1])||a; }
      else if (a==="due"){ const cutoff=Date.now()-30*864e5;
        items=items.filter(c=>!(state.counted[c.cid])||state.counted[c.cid]<cutoff); scope="due (30d+)"; }
      else if (a==="report"){
        out.innerHTML=""; live.innerHTML=""; browseSel=-1; atHome=false;
        print("COUNT HISTORY","w"); print("");
        const L=state.countlog.slice(-25).reverse();
        if(!L.length){ print("  no counts logged yet — run 'count'","d"); return; }
        const p2=x=>String(x).padStart(2,"0");
        L.forEach(e=>{ const d=new Date(e.ts); const diff=e.actual-e.expected;
          print(`  ${p2(d.getMonth()+1)}-${p2(d.getDate())} C-${String(e.cid).padStart(3,"0")} ${e.name.slice(0,22).padEnd(24)} ${e.expected} → ${e.actual} ${diff===0?"(ok)":(diff>0?"+"+diff:diff)}`,
            diff===0?"g":"a"); });
        return;
      }
      if (!items.length){ print("nothing to count in that scope.","d"); return; }
      items.sort((x,y)=>((state.counted[x.cid]||0)-(state.counted[y.cid]||0)) || x.bin-y.bin);
      mode={type:"count", queue:items, idx:0, scope, fixed:0, checked:0};
      print(`CYCLE COUNT — ${scope} · ${items.length} items · blank=confirm · number=correct · skip · stop`,"w");
      countStep();
      return;
    }

    case "photo": {
      const r=await resolve(rest.replace(/\s+(rm|remove|clear|del)$/i,""));
      if (r.err){ print(r.err,"a"); return; }
      if (r.many){ print("be more specific:","a"); printRows(r.many); return; }
      if (/\s(rm|remove|clear|del)$/i.test(rest)){

      return;

    case "graph": {

      if (["pop","popout","window","monitor","2"].includes(ml)){ popGraph(); return; }
      if (["dock","back","1"].includes(ml)){ dockGraph(); return; }
      if (["3d","3","cube"].includes(ml)){ g3d=true; if(graphMode==="off")setGraph("split"); graphHome(); print("graph 3D — drag to orbit, it drifts on its own. graph home recenters · graph 2d flattens.","d"); return; }
      if (["2d","flat"].includes(ml)){ g3d=false; if(graphMode==="off")setGraph("split"); graphHome(); print("graph 2D.","d"); return; }
      if (ml==="style"){ gStyle = gStyle==="holo"?"clean":"holo"; print(`graph style: ${gStyle==="holo"?"holographic glow":"clean minimal"}`,"d"); return; }
      if (ml==="hud"){ hudOn=!hudOn; state.hud=hudOn; updateHud(); await save(); print(`HUD frame ${hudOn?"on":"off"}`,"d"); return; }
      if (ml==="sweep"){ sweepT=performance.now(); print("sweep","d"); return; }
      if (["home","reset","center","recenter"].includes(ml)){ graphHome(); print("view recentered.","d"); return; }
      if (ml==="off"){ if (gPopped()) dockGraph("off"); else setGraph("off"); return; }
      if (ml==="full"){ setGraph("full"); print("graph full — esc for split.","d"); return; }
      if (!ml){
        if (graphMode!=="off"){ setGraph("off"); return; }
        setGraph("split");
      }
      else if (["inv","inventory","all"].includes(ml)){
        if (graphMode==="off") setGraph("split");
        setGraphView({kind:"inv"});
      }
      else if (["projects","proj","projs"].includes(ml)){
        if (graphMode==="off") setGraph("split");
        setGraphView({kind:"projects"});
      }
      else if (["galaxy","universe","clusters"].includes(ml)){
        if (!state.projects.length){ print("no projects yet — the galaxy needs projects. proj new <name>","a"); return; }
        if (graphMode==="off") setGraph("split");
        g3d=true;                       // galaxy is best in 3D
        setGraphView({kind:"galaxy"});
        print("galaxy: each project is a cluster · bright stars are shared parts · drag to orbit · 'graph grow' replays the timeline","d");
      }
      else if (["next","cycle","switch","toggle"].includes(ml)){ cycleView(); return; }
      else if (["grow","timeline","play"].includes(ml)){
        if (gView.kind!=="galaxy"){ setGraphView({kind:"galaxy"}); }
        galaxyGrow();
      }
      else {
        const pr=resolveProj(m); if (pr.err){ print(pr.err,"a"); return; }
        if (graphMode==="off") setGraph("split");
        setGraphView({kind:"proj", pid:pr.p.pid});
      }
      const what = gView.kind==="inv" ? "inventory — every part clustered by shelf"
                 : gView.kind==="projects" ? "all projects — links are shared parts, click one to drill in"
                 : "one project and only its parts";
      print(`graph ${graphMode}: ${what}. graph inv · graph projects · graph <name> · graph full · esc backs out.`,"d");
      return;
    }

    case "tidy": {
      if (needsAll("tidy")) return;
      const props = state.items.map(c=>({c, after:tidyName(c.name)})).filter(x=>x.after!==x.c.name);
      if (!props.length){ print("nothing to tidy — names are already consistent.","g"); return; }
      if (rest.toLowerCase()==="apply"){
        const namesUndo = props.map(x=>({cid:x.c.cid, before:x.c.name}));
        props.forEach(x=>x.c.name=x.after);
        logAct(`tidied ${props.length} name${props.length===1?"":"s"}`, {type:"tidy", names:namesUndo});
        await save();
        print(`tidied ${props.length} name${props.length===1?"":"s"}. (undo to revert)`,"g");
        return;
      }
      print("PROPOSED CLEANUP  (dry run — nothing changed yet)","w");
      props.forEach(x=>print(`  ${x.c.name.slice(0,28).padEnd(30)} -> ${x.after}`,"g"));
      print("apply with:  tidy apply   (one undo reverts the whole batch)","d");
      return;
    }

    case "doctor": case "normalize": case "fsck": {
      if (needsAll("the database doctor")) return;
      const d=doctorScan();
      const issues=d.nameFixes.length+d.fldFixes.length+d.exact.length;
      if (!issues && !d.review.length){ print("database clean — no duplicates or messy entries.","g"); return; }
      if (rest.toLowerCase()==="apply"){
        if (!issues){ print("nothing to auto-fix. review items need manual 'merge'.","a"); return; }
        snapshotUndo(`doctor: fixed ${issues} issue${issues===1?"":"s"}`);
        d.nameFixes.forEach(x=>x.c.name=x.after);
        d.fldFixes.forEach(x=>x.f.forEach(f=>x.c[f.k]=f.after));
        let merged=0;
        d.exact.forEach(g=>{ for (let i=1;i<g.length;i++){ mergeInto(g[0],g[i]); merged++; } });
        await save();
        print(`fixed: ${d.nameFixes.length} names, ${d.fldFixes.length} field sets, merged ${merged} duplicate${merged===1?"":"s"}. (one undo reverts all)`,"g");
        if (d.review.length) print(`${d.review.length} possible duplicate pair${d.review.length===1?"":"s"} still need review — run 'doctor'`,"a");
        return;
      }
      print("DOCTOR REPORT  (dry run — nothing changed)","w");
      if (d.nameFixes.length){
        print(`  names — ${d.nameFixes.length} to tidy`,"w");
        d.nameFixes.forEach(x=>print(`    ${x.c.name.slice(0,26).padEnd(28)} -> ${x.after}`,"g"));
      }
      if (d.fldFixes.length){
        print(`  fields — ${d.fldFixes.length} entr${d.fldFixes.length===1?"y":"ies"} to clean`,"w");
        d.fldFixes.forEach(x=>x.f.forEach(f=>
          print(`    ${cidStr(x.c)} ${f.k}: "${String(x.c[f.k]??"")}" -> "${f.after}"`,"g")));
      }
      if (d.exact.length){
        print(`  duplicates — ${d.exact.length} auto-merge${d.exact.length===1?"":"s"}`,"w");
        d.exact.forEach(g=>{
          const total=g.reduce((s,c)=>s+c.qty,0);
          print(`    ${g.slice(1).map(c=>cidStr(c)).join("+")} -> into ${cidStr(g[0])} ${g[0].name} (qty ${total}, BIN ${g[0].bin})`,"a");
        });
      }
      if (d.review.length){
        print(`  review — ${d.review.length} possible duplicate${d.review.length===1?"":"s"} (never auto-merged)`,"w");
        d.review.forEach(([a,b])=>{
          print(`    ${cidStr(a)} ${a.name}  ~  ${cidStr(b)} ${b.name}`,"a");
          print(`      same thing? ->  merge ${cidStr(a)} ${cidStr(b)}`,"d");
        });
      }
      if (issues) print("apply safe fixes:  doctor apply   (single undo reverts)","d");
      return;
    }

    case "merge": {
      if (needsAll("merge")) return;
      const parts=rest.split(/\s+/).filter(Boolean);
      if (parts.length!==2){ print("usage: merge <keep> <remove>  (names or C-IDs)","a"); return; }
      const ra=await resolve(parts[0]), rb=await resolve(parts[1]);
      for (const [r,lbl] of [[ra,parts[0]],[rb,parts[1]]]){
        if (r.err){ print(r.err,"a"); return; }
        if (r.many){ print(`"${lbl}" is ambiguous — use a C-ID:`,"a"); printRows(r.many); return; }
      }
      if (ra.c===rb.c){ print("that's the same component twice.","a"); return; }
      snapshotUndo(`merged ${rb.c.name} into ${ra.c.name}`);
      const dupName=rb.c.name;
      mergeInto(ra.c, rb.c);
      await save();
      print(`merged ${dupName} into ${ra.c.name} — now qty ${ra.c.qty} in BIN ${ra.c.bin}. (undo reverts)`,"g");
      return;
    }

    case "undo": case "u": await doUndo(); return;

    case "recent": case "log": {
      const p2=x=>String(x).padStart(2,"0");
      const stamp=l=>{ const d=new Date(l.ts);
        return `${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
      if (rest.toLowerCase()==="export"){
        const logRows=(await DB.log(1000)).rows.slice().reverse();
        const csv=["time,action"].concat(logRows.map(l=>
          `${new Date(l.ts).toISOString()},${'"'+l.text.replace(/"/g,'""')+'"'}`)).join("\n");
        print("ACTIVITY LOG CSV:","w");
        print("─".repeat(46),"d"); print(csv,"g"); print("─".repeat(46),"d");
        try{ await navigator.clipboard.writeText(csv); print("(copied to clipboard)","d"); }catch(e){}
        return;
      }
      let L=[];
      try { L=(await DB.log(200)).rows.slice().reverse(); }
      catch(e){ print("could not read the activity log: "+e.message,"a"); return; }
      let label="";
      if (rest.toLowerCase()==="today"){
        const mid=new Date(); mid.setHours(0,0,0,0);
        L=L.filter(l=>l.ts>=mid.getTime()); label=" — today";
      } else if (rest){
        const q=rest.toLowerCase();
        L=L.filter(l=>l.text.toLowerCase().includes(q)); label=` — "${rest}"`;
      }
      L=L.slice(-30).reverse();
      if (!L.length){ print("no matching activity.","d"); return; }
      print("RECENT ACTIVITY"+label+"  (newest first)","w");
      L.forEach(l=>print(`  ${stamp(l)}  ${l.text}`, l.text.startsWith("undid")?"a":"g"));
      print("filter: recent take · recent today · recent <name> · recent export · undo reverses","d");
      return;
    }

    case "stats": {
      await refreshSummary();
      const total=summary.pieces;
      print("STATS","w");
      print(`  unique components   ${summary.items}\n  total items         ${total}\n  bins used           ${summary.bins}\n  low stock           ${summary.low}`,"g");
      return;
    }

    case "export": {
      if (needsAll("CSV export")) return;
      state.lastExport=Date.now(); await save();
      const csv=toCSV();
      print("CSV EXPORT — copy everything between the lines:","w");
      print("─".repeat(46),"d"); print(csv,"g"); print("─".repeat(46),"d");
      try{ await navigator.clipboard.writeText(csv); print("(also copied to clipboard)","d"); }catch(e){}
      return;
    }

    case "import": {
      if (notPorted("Spreadsheet import", "The API takes bulk rows already; wiring is P7.")) return;
      const a=rest.trim().toLowerCase();
      if (a==="paste"){
        mode={type:"importpaste", buf:[]};
        setPS1("paste > ");
        print("paste rows from Excel/Google Sheets (or CSV), then type 'end'. 'cancel' aborts.","d");
        return;
      }
      // default: file picker (xlsx/xls/ods/csv…)
      importTarget=true;
      const inp=document.getElementById("sheetinput"); inp.value=""; inp.click();
      print("pick a spreadsheet — .xlsx .xls .xlsm .ods .csv .tsv  (or: import paste)","d");
      return;
    }

    case "template": {
      const csv="name,bin,qty,min,value,package,part,supplier,source,link,notes\n"
        +"Example Resistor 10k,1101,100,20,10kΩ 1/4W,THT,,Digikey,drawer A3,https://example.com,starter row — delete me\n";
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      a.download="inventory-template.csv"; a.click(); URL.revokeObjectURL(a.href);
      print("blank template downloaded — fill it in Excel/Sheets, then: import","g");
      return;
    }

    case "reset":
      if (rest.toLowerCase()==="confirm"){
        state={items:JSON.parse(JSON.stringify(SEED)), nextCid:SEED.length+1, seeded:true, seededDemo:true,
               classes:[...DEFAULT_CLASSES], sections:{...DEFAULT_SECTIONS}, log:[], undo:[],
               projects:[], nextPid:1, activePid:null, shopName:"", firstRun:true,
               counted:{}, countlog:[]};
        await save(); home(); print("inventory reset to demo seed.","a");
      } else print("this replaces ALL data with the demo seed. type: reset confirm","a");
      return;

    default: {
      const r=await search(t, {limit:200});
      if (r.length) printRows(r);
      else { print(`no matches for "${t}"`,"a"); print(`  add it:  add ${t} x1`,"d"); }
    }
  }
}

/* ---------- brain graph: zero-dependency force-directed canvas ---------- */
let graphMode="off", gNodes=[], gEdges=[], gAlpha=0, gRAF=null;
let gView={kind:"inv"};
let gWin=null, gPopCanvas=null, gPollTimer=null;      // second-monitor window
const gPopped = () => !!(gWin && !gWin.closed && gPopCanvas);

}
let gScale=1.6, gOX=0, gOY=0, gHover=null, gDrag=null, gPanning=false, gMoved=false, gLastXY=null;
let g3d=false, gStyle="holo", gCores=true;  // 3D toggle + look + white node cores
let gYaw=0.5, gPitch=-0.35, gAutoRot=true, gCamZ=520;
const gc=$("gcanvas"), gpane=$("graphpane");

let hudOn=true, sweepT=0;   // HUD frame + boot-sweep animation clock
// tunable settings (persisted in state.cfg) with metadata for the settings screen
const SETTINGS = [
  {k:"launchZoom", label:"launch zoom",    min:0.6, max:3,   step:0.1,  def:1.8,  fmt:v=>v.toFixed(1)+"x"},
  {k:"driftSpeed", label:"auto-orbit",     min:0,   max:0.01,step:0.001,def:0.0022,fmt:v=>v===0?"off":Math.round(v*1000)+""},
  {k:"glow",       label:"glow strength",  min:0,   max:2,   step:0.1,  def:1,    fmt:v=>Math.round(v*100)+"%"},
  {k:"dust",       label:"dust field",     min:0,   max:1,   step:1,    def:1,    fmt:v=>v?"on":"off"},
  {k:"labelZoom",  label:"part-label zoom", min:0.8,max:2.5, step:0.1,  def:1.1,  fmt:v=>v.toFixed(1)+"x"},
];
function cfg(k){ const m=SETTINGS.find(s=>s.k===k); return (state.cfg&&state.cfg[k]!==undefined)?state.cfg[k]:m.def; }
function setCfg(k,v){ const m=SETTINGS.find(s=>s.k===k);
  v=Math.max(m.min,Math.min(m.max,Math.round(v/m.step)*m.step));
  state.cfg=state.cfg||{}; state.cfg[k]=v; return v; }
function updateHud(){
  if (typeof document==="undefined") return;

  }
}
function updateGLabel(){

  else if (gView.kind==="galaxy") html="<b>GALAXY</b> — projects as clusters · bright stars = shared parts";

  }

  if (gPopped()){ const l=gWin.document.getElementById("l"); if(l) l.innerHTML=html; }
}
function buildGraphData(){
  const old=new Map(gNodes.map(n=>[n.id,n]));
  const nid=new Map(); const nodes=[]; const eset=new Set(); const edges=[];
  const addN=(id,type,label,extra={})=>{
    if (nid.has(id)) return nid.get(id);
    const prev=old.get(id);
    const n={id,type,label,...extra,
      x:prev?prev.x:(Math.random()-0.5)*60, y:prev?prev.y:(Math.random()-0.5)*60,
      z:prev&&prev.z!==undefined?prev.z:(Math.random()-0.5)*60,
      vx:0, vy:0, vz:0};
    nid.set(id,n); nodes.push(n); return n;
  };
  const addE=(a,b,w=1)=>{ const k=a+"|"+b; if(eset.has(k))return; eset.add(k); edges.push({a,b,w}); };

  if (gView.kind==="inv"){
    /* central "sun": every department orbits SECTIONS */
    const sun=addN("SUN","sun","SECTIONS",{cmd:"home", count:state.items.length});
    sun.x=0; sun.y=0; sun.z=0;                 // anchor at the origin
    /* EVERY part in the inventory, hanging off its section -> dept hubs -> sun */
    for (let d=0; d<10; d++){
      const its=state.items.filter(c=>clsNum(c.bin)===d);
      if (!its.length) continue;
      addN("d"+d,"dept",clsLabel(d).split(" ")[0],{cmd:String(d),count:its.length});
      addE("d"+d,"SUN");
      new Set(its.map(c=>secOf(c.bin))).forEach(t=>{
        addN("s"+d+t,"sec",secLabel(d,t)||`${d}${t}00`,{cmd:`${d}${t}`,count:its.filter(c=>secOf(c.bin)===t).length});
        addE("s"+d+t,"d"+d);
      });
      its.forEach(c=>{
        addN("c"+c.cid,"part",c.name,{cmd:"info "+cidStr(c), low:c.qty<=c.min});
        addE("c"+c.cid,"s"+clsNum(c.bin)+secOf(c.bin));
      });
    }
  }
  else if (gView.kind==="projects"){
    /* central "PROJECTS" sun; each project is a cluster core orbiting the sun (far out);
       that project's parts orbit ITS core; faint trails link projects that share parts. */
    const sun=addN("SUN","sun","PROJECTS",{cmd:"graph projects", count:state.projects.length});
    sun.x=0; sun.y=0; sun.z=0;
    state.projects.forEach(p=>{
      addN("p"+p.pid,"proj",p.name,
        {cmd:"proj "+p.name, viewTo:{kind:"proj",pid:p.pid},
         active:p.pid===state.activePid, count:p.bom.length*6, core:true});
      addE("SUN","p"+p.pid);
      // this project's parts orbit its own core
      p.bom.forEach(l=>{
        const c=state.items.find(i=>i.cid===l.cid); if(!c) return;
        const nidk="pc"+p.pid+"_"+c.cid;
        addN(nidk,"part",c.name,{cmd:"info "+cidStr(c), low:c.qty<=c.min});
        addE("p"+p.pid, nidk, 1);
      });
    });
    // faint trails between projects that share parts (drawn dim in the renderer)
    for (let i=0;i<state.projects.length;i++) for (let j=i+1;j<state.projects.length;j++){
      const A=new Set(state.projects[i].bom.map(l=>l.cid));
      const shared=state.projects[j].bom.filter(l=>A.has(l.cid)).length;
      if (shared) addE("p"+state.projects[i].pid, "p"+state.projects[j].pid, -shared); // negative w = trail
    }
  }
  else if (gView.kind==="galaxy"){
    /* every project = a cluster core; its BOM parts orbit as stars; a shared part is
       ONE star wired to every project that uses it -> bright bridges between clusters.
       Optional time-grow: only show projects created up to gGalaxyT (ms) when scrubbing. */
    const cutoff = gView.t || Infinity;
    const projs = state.projects.filter(p=>(p.created||0)<=cutoff);
    projs.forEach(p=>{
      addN("p"+p.pid,"proj",p.name,
        {cmd:"proj "+p.name, viewTo:{kind:"proj",pid:p.pid},
         active:p.pid===state.activePid, count:p.bom.length*6, core:true});  // core=cluster center
    });
    // each distinct part becomes one star, linked to every project that needs it
    const partUse={};   // cid -> [pid,...]
    projs.forEach(p=>p.bom.forEach(l=>{ (partUse[l.cid] ||= []).push(p.pid); }));
    Object.entries(partUse).forEach(([cid,pids])=>{
      const c=state.items.find(i=>i.cid===+cid); if(!c) return;
      const shared = pids.length>1;
      addN("c"+c.cid, shared?"shared":"part", c.name,
        {cmd:"info "+cidStr(c), low:c.qty<=c.min, shared});
      pids.forEach(pid=>addE("p"+pid, "c"+c.cid, shared?2:1));
    });
  }
  else { /* single project: the project + ONLY its added parts */
    const p=state.projects.find(x=>x.pid===gView.pid);
    if (!p){ gView={kind:"projects"}; return buildGraphData(); }
    addN("p"+p.pid,"proj",p.name,{cmd:"proj "+p.name, active:true, count:p.bom.length*6});
    p.bom.forEach(l=>{
      const c=state.items.find(i=>i.cid===l.cid); if(!c) return;
      addN("c"+c.cid,"part",`${l.need}x ${c.name}`,
        {cmd:"info "+cidStr(c), low:c.qty<l.need || c.qty<=c.min});
      addE("p"+p.pid,"c"+c.cid, l.need);
    });
  }
  // spawn new nodes near a linked neighbor for the live-growth feel
  nodes.forEach(n=>{
    if (old.has(n.id)) return;
    const e=edges.find(e=>e.a===n.id||e.b===n.id);
    if (e){ const o=nid.get(e.a===n.id?e.b:e.a);
      if (o && old.has(o.id)){ n.x=o.x+(Math.random()-0.5)*30; n.y=o.y+(Math.random()-0.5)*30; n.z=(o.z||0)+(Math.random()-0.5)*30; } }
  });
  gNodes=nodes; gEdges=edges.map(e=>({a:nid.get(e.a), b:nid.get(e.b), w:e.w}));
  gAlpha=0.9;
}
function hexA(h,a){ h=h.replace("#",""); if(h.length===3)h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function themeCol(){
  const cs=getComputedStyle(document.documentElement);
  const g=v=>cs.getPropertyValue(v).trim();
  return { bg:g("--bg"), fg:g("--green"), dim:g("--dimgreen"),
           amber:g("--amber"), white:g("--white"), cyan:g("--cyan") };
}
function nodeR(n){
  const base = n.type==="sun"?18 : n.type==="proj"?13 : n.type==="dept"?10 : n.type==="shared"?7 : n.type==="sec"?6.5 : 4.5;
  return base + Math.min(n.type==="sun"?8:4, (n.count||0)*0.05);
}
function gTick(){
  const a=gAlpha;
  if (a>0.015){
    for (let i=0;i<gNodes.length;i++) for (let j=i+1;j<gNodes.length;j++){
      const p=gNodes[i], q=gNodes[j];
      let dx=p.x-q.x, dy=p.y-q.y, dz=g3d?(p.z-q.z):0;
      let d2=dx*dx+dy*dy+dz*dz||0.01, d=Math.sqrt(d2);
      // galaxy: cores push each other MUCH harder -> clusters separate, dark space between
      const coreRep = ((gView.kind==="galaxy"||gView.kind==="projects") && p.core && q.core) ? 60 : 1;
      const f=900*a*coreRep/d2;
      dx/=d; dy/=d; dz/=d;
      p.vx+=dx*f; p.vy+=dy*f; q.vx-=dx*f; q.vy-=dy*f;
      if (g3d){ p.vz+=dz*f; q.vz-=dz*f; }
    }
    gEdges.forEach(e=>{
      const trail = e.w<0;               // inter-project "trail" — visual only, negligible pull
      const proj=(e.a.type==="proj"||e.b.type==="proj");
      const galaxyish=(gView.kind==="galaxy"||gView.kind==="projects");
      const rest = proj ? (galaxyish?520:70)
                 : (e.a.type==="dept"||e.b.type==="dept") ? 85 : 55;
      let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, dz=g3d?(e.b.z-e.a.z):0;
      let d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.01;
      const f=(d-rest)*(trail?0.002:0.045)*a;   // trails barely tug -> don't collapse the spacing
      dx/=d; dy/=d; dz/=d;
      e.a.vx+=dx*f; e.a.vy+=dy*f; e.b.vx-=dx*f; e.b.vy-=dy*f;
      if (g3d){ e.a.vz+=dz*f; e.b.vz-=dz*f; }
    });
    gNodes.forEach(n=>{
      if (n.type==="sun"){ n.x=0; n.y=0; n.z=0; n.vx=n.vy=n.vz=0; return; }  // anchored center
      n.vx-=n.x*0.004*a; n.vy-=n.y*0.004*a; if(g3d) n.vz-=n.z*0.004*a;
      if (n===gDrag) { n.vx=0; n.vy=0; n.vz=0; return; }
      n.x+=n.vx; n.y+=n.vy; n.vx*=0.85; n.vy*=0.85;
      if (g3d){ n.z+=n.vz; n.vz*=0.85; }
    });
    gAlpha*=0.985;
  }
  if (g3d && gAutoRot) gYaw+=cfg("driftSpeed");   // gentle drift (settings)
  gDraw();
  if (graphMode!=="off" && (performance.now()&255)<20) updateHud();  // occasional stat refresh
  if (graphMode==="off" && !gPopped()){ gRAF=null; return; }
  gRAF = gPopped() ? gWin.requestAnimationFrame(gTick) : requestAnimationFrame(gTick);
}
/* project a 3D point to screen; returns {sx,sy,scale,depth} */
function project(n, W, H){
  const cy=Math.cos(gYaw), sy=Math.sin(gYaw), cp=Math.cos(gPitch), sp=Math.sin(gPitch);
  let x=n.x, y=n.y, z=n.z||0;
  let x1=x*cy - z*sy, z1=x*sy + z*cy;          // yaw
  let y1=y*cp - z1*sp, z2=y*sp + z1*cp;        // pitch
  const persp=gCamZ/(gCamZ+z2+300);
  return { sx:W/2+gOX + x1*persp*gScale, sy:H/2+gOY + y1*persp*gScale, scale:persp*gScale, depth:z2 };
}
function gDraw(){
  const {cv,W,H,dpr}=gDims();
  if (!W||!H) return;
  if (cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  const x=cv.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  if (!gNodes.length){
    x.fillStyle=themeCol().dim; x.font="12px Consolas,monospace"; x.textAlign="center";
    x.fillText(gView.kind==="projects" ? "no projects yet — project new <name>" : "nothing here yet — add parts", W/2, H/2);
    return;
  }
  const hoverSet = gHover ? new Set([gHover.id]) : null;
  if (hoverSet) gEdges.forEach(e=>{ if(e.a===gHover||e.b===gHover){ hoverSet.add(e.a.id); hoverSet.add(e.b.id);} });

  if (g3d){ gDraw3D(x, W, H, hoverSet); drawSweep(x,W,H); return; }

  const C=themeCol();
  x.save();
  x.translate(W/2+gOX, H/2+gOY); x.scale(gScale,gScale);
  // edges
  gEdges.forEach(e=>{
    const trail = e.w<0;
    const hot = hoverSet && hoverSet.has(e.a.id) && hoverSet.has(e.b.id) && (e.a===gHover||e.b===gHover);
    x.globalAlpha = hoverSet ? (hot?0.9:0.05) : (trail?0.14:0.28);
    x.strokeStyle = trail ? C.cyan : (e.a.type==="proj"||e.b.type==="proj") ? C.cyan : C.dim;
    x.lineWidth = (trail?0.6:Math.min(3,(Math.abs(e.w)||1)*0.5+0.4))/gScale;
    if (trail) x.setLineDash([6/gScale,6/gScale]); else x.setLineDash([]);
    x.beginPath(); x.moveTo(e.a.x,e.a.y); x.lineTo(e.b.x,e.b.y); x.stroke();
  });
  x.setLineDash([]);
  gNodes.forEach(n=>{
    const dim = hoverSet && !hoverSet.has(n.id);
    x.globalAlpha = dim?0.12:1;
    const r=nodeR(n);
    x.beginPath(); x.arc(n.x,n.y,r,0,7);
    x.fillStyle = n.type==="sun"  ? C.white
                : n.type==="shared" ? C.white
                : n.type==="proj" ? (n.active?C.white:C.fg)
                : n.type==="dept" ? C.cyan
                : n.type==="sec"  ? C.dim
                : n.low ? C.amber : C.fg;
    x.fill();
    if (n.type==="sun"||n.type==="dept"||n===gHover){ x.strokeStyle=C.cyan; x.lineWidth=1.4/gScale; x.stroke(); }
    if (gCores && !dim && n.type!=="dept"){ x.beginPath(); x.arc(n.x,n.y,r*0.4,0,7); x.fillStyle=C.white; x.fill(); }
    const show = n.type==="sun"||n.type==="proj"||n.type==="dept" || (n.type==="sec"&&gScale>0.75) ||
                 (n.type==="part"&&(gView.kind==="proj"||gScale>1.5||n===gHover));
    if (show && !dim){
      x.font=`${Math.max(9,11/gScale)}px Consolas,monospace`;
      x.fillStyle = n.type==="proj"?C.white:n.low?C.amber:C.fg;
      x.textAlign="center";
      x.fillText(n.label.slice(0,20), n.x, n.y-r-4/gScale);
    }
  });
  x.restore();
  drawSweep(x,W,H);
}
/* radar boot-sweep: one rotation on graph open, lights the scene */
function drawSweep(x,W,H){
  if (gStyle!=="holo") return;
  const dur=1100, t=performance.now()-sweepT;
  if (t<0 || t>dur) return;
  const C=themeCol();
  const cx=W/2+gOX, cy=H/2+gOY, R=Math.hypot(W,H)/2;
  const ang=-Math.PI/2 + (t/dur)*Math.PI*2;
  const fade=1-(t/dur);
  x.save();
  for (let k=0;k<40;k++){                 // trailing wedge
    const a=ang-k*0.03;
    x.globalAlpha=Math.max(0,(0.35-k*0.008))*fade;
    x.strokeStyle=C.cyan; x.lineWidth=2;
    x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a)); x.stroke();
  }
  x.globalAlpha=0.9*fade; x.strokeStyle=C.white; x.lineWidth=2;   // bright leading edge
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+R*Math.cos(ang),cy+R*Math.sin(ang)); x.stroke();
  x.globalAlpha=1; x.restore();
}
/* 3D renderer: depth-sorted, perspective, holographic glow */
function gDraw3D(x, W, H, hoverSet){
  const holo = gStyle==="holo";
  const C=themeCol();
  const P=new Map(); gNodes.forEach(n=>P.set(n, project(n,W,H)));
  // depth range for fog
  let zmin=1e9, zmax=-1e9;
  P.forEach(p=>{ if(p.depth<zmin)zmin=p.depth; if(p.depth>zmax)zmax=p.depth; });
  const fog = d => { const t=(zmax-zmin)?(d-zmin)/(zmax-zmin):0.5; return 0.35+0.65*(1-t); }; // far = fainter

  // ambient starfield dust (holo only) — subtle jarvis atmosphere
  if (holo && !hoverSet && cfg("dust")){
    x.globalAlpha=0.5;
    for (let i=0;i<40;i++){
      const sx=(Math.sin(i*12.9+gYaw*40)*0.5+0.5)*W;
      const sy=(Math.cos(i*7.7 -gYaw*30)*0.5+0.5)*H;
      x.fillStyle=hexA(C.cyan,0.06); x.fillRect(sx,sy,1.5,1.5);
    }
    x.globalAlpha=1;
  }

  x.lineCap="round";
  const edrawn=gEdges.map(e=>({e, z:(P.get(e.a).depth+P.get(e.b).depth)/2})).sort((A,B)=>A.z-B.z);
  edrawn.forEach(({e})=>{
    const a=P.get(e.a), b=P.get(e.b);
    const trail = e.w<0;                          // faint inter-project trail
    const near=(e.a.type==="proj"||e.b.type==="proj");
    const hot = hoverSet && hoverSet.has(e.a.id) && hoverSet.has(e.b.id) && (e.a===gHover||e.b===gHover);
    const f=fog((a.depth+b.depth)/2);
    x.globalAlpha = hoverSet ? (hot?0.95:0.04) : trail ? 0.12*f : (holo?0.22*f:0.3*f);
    if (trail){ x.strokeStyle=hexA(C.cyan,0.6); x.shadowColor=C.cyan; x.shadowBlur=3; x.setLineDash([5,7]); }
    else if (holo){
      const grad=x.createLinearGradient(a.sx,a.sy,b.sx,b.sy);
      grad.addColorStop(0, near?C.cyan:C.dim); grad.addColorStop(1, hexA(near?C.cyan:C.dim,0.15));
      x.strokeStyle=grad; x.shadowColor=C.cyan; x.shadowBlur=near?8:2; x.setLineDash([]);
    } else { x.strokeStyle = near?C.cyan:C.dim; x.shadowBlur=0; x.setLineDash([]); }
    x.lineWidth = trail?0.6 : Math.max(0.4, Math.min(3,(Math.abs(e.w)||1)*0.5+0.4)*a.scale);
    x.beginPath(); x.moveTo(a.sx,a.sy); x.lineTo(b.sx,b.sy); x.stroke();
  });
  x.setLineDash([]);

  const ndrawn=gNodes.map(n=>({n,p:P.get(n)})).sort((A,B)=>A.p.depth-B.p.depth);
  ndrawn.forEach(({n,p})=>{
    const dim = hoverSet && !hoverSet.has(n.id);
    const f=fog(p.depth);
    const r=Math.max(1.2, nodeR(n)*p.scale);
    const col = n.type==="sun"  ? C.white
              : n.type==="shared" ? C.white
              : n.type==="proj" ? (n.active?C.white:C.cyan)
              : n.type==="dept" ? C.cyan
              : n.type==="sec"  ? (holo?hexA(C.cyan,0.7):C.dim)
              : n.low ? C.amber : C.fg;
    x.globalAlpha = dim?0.08:f;
    // hub rings — concentric halo on departments & active projects (jarvis targeting reticle)
    if (holo && !dim && (n.type==="sun"||n.type==="dept"||(n.type==="proj"&&n.active))){
      x.strokeStyle=hexA(C.cyan,0.5); x.lineWidth=1; x.shadowColor=C.cyan; x.shadowBlur=10;
      x.beginPath(); x.arc(p.sx,p.sy,r+5,0,7); x.stroke();
      x.globalAlpha=dim?0.05:f*0.5;
      x.beginPath(); x.arc(p.sx,p.sy,r+9,0,7); x.stroke();
      x.globalAlpha=dim?0.08:f;
    }
    if (holo && !dim){ x.shadowColor=col; x.shadowBlur=(n===gHover?24:13)*Math.max(.5,p.scale)*cfg("glow"); }
    else x.shadowBlur=0;
    x.beginPath(); x.arc(p.sx,p.sy,r,0,7); x.fillStyle=col; x.fill();
    if (holo && gCores && !dim){                   // bright white core (toggle)
      x.shadowBlur=0; x.globalAlpha=Math.min(1,(0.5+p.scale*0.5))*f;
      x.beginPath(); x.arc(p.sx,p.sy,r*0.42,0,7); x.fillStyle=C.white; x.fill();
    }
    const show = n.type==="sun"||n.type==="proj"||n.type==="dept" || (n.type==="sec"&&p.scale>0.7) ||
                 (n.type==="part"&&(gView.kind==="proj"||p.scale>cfg("labelZoom")||n===gHover));
    if (show && !dim){
      x.shadowBlur=0; x.globalAlpha=Math.min(1,p.scale)*f;
      x.font=`${Math.max(8,11*p.scale)}px Consolas,monospace`;
      x.fillStyle = n.type==="proj"?C.white:n.low?C.amber:(holo?hexA(C.cyan,0.85):C.fg);
      x.textAlign="center";
      x.fillText(n.label.slice(0,20), p.sx, p.sy-r-3);
    }
  });
  x.shadowBlur=0; x.globalAlpha=1;
}
function gPick(px,py){
  const {W,H}=gDims();
  if (g3d){
    let hit=null, best=1e9;   // nearest node in screen space, front-most wins ties
    gNodes.forEach(n=>{
      const p=project(n,W,H);
      const d=Math.hypot(p.sx-px, p.sy-py);
      const rr=Math.max(4, nodeR(n)*p.scale)+6;
      if (d<rr){ const score=d - p.depth*0.05; if(score<best){ best=score; hit=n; } }
    });
    return hit;
  }
  const wx=(px-W/2-gOX)/gScale, wy=(py-H/2-gOY)/gScale;
  let hit=null, best=1e9;
  gNodes.forEach(n=>{
    const d=Math.hypot(n.x-wx,n.y-wy);
    if (d<nodeR(n)+6/gScale && d<best){ best=d; hit=n; }
  });
  return hit;
}
function setGraph(m){
  graphMode=m;
  document.body.classList.toggle("g-split", m==="split");
  document.body.classList.toggle("g-full", m==="full");
  if (m==="off" && !gPopped()){ updateHud(); return; }   // gTick stops itself
  gScale=cfg("launchZoom"); gOX=0; gOY=0;   // open at the configured zoom
  buildGraphData(); updateGLabel(); updateHud();
  sweepT = performance.now();     // kick off the radar sweep on open
  if (!gRAF) gRAF = gPopped() ? gWin.requestAnimationFrame(gTick) : requestAnimationFrame(gTick);
}
function setGraphView(v){
  const changed = !gView || gView.kind!==v.kind || gView.pid!==v.pid;
  gView=v;
  if (graphMode!=="off"){ buildGraphData(); updateGLabel();
    if (changed){ const nm = v.kind==="inv"?"INVENTORY":v.kind==="projects"?"PROJECTS":v.kind==="galaxy"?"GALAXY":
      (state.projects.find(x=>x.pid===v.pid)?.name||"PROJECT"); toast(nm); } }
}
let _toastT=null;
function toast(msg){
  const el=document.getElementById("toast"); if(!el) return;
  el.textContent=msg; el.classList.add("show");
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove("show"), 1100);
}
function cycleView(){
  if (graphMode==="off") setGraph("split");
  // if currently drilled into a single project, treat as "projects"
  const cur = gView.kind==="proj" ? "projects" : gView.kind;
  const order = state.projects.length ? ["inv","projects","galaxy"] : ["inv"];
  const i = order.indexOf(cur);
  const next = order[(i+1)%order.length];
  if (next==="galaxy") g3d=true;
  setGraphView({kind:next});
}
function galaxyGrow(){
  const times=state.projects.map(p=>p.created||0).filter(Boolean).sort((a,b)=>a-b);
  if (!times.length){ setGraphView({kind:"galaxy"}); return; }
  const t0=times[0], t1=times[times.length-1]||Date.now(), span=Math.max(1,t1-t0);
  const dur=6000, start=performance.now();
  print("growing the universe…","d");
  const step=()=>{
    const p=Math.min(1,(performance.now()-start)/dur);
    gView={kind:"galaxy", t: t0 + span*p};
    buildGraphData(); updateGLabel();
    if (p<1) requestAnimationFrame(step);
    else { gView={kind:"galaxy"}; buildGraphData(); }   // final: show all
  };
  step();
}
function graphHome(){          // recenter camera / view — the auto-home
  gScale=cfg("launchZoom"); gOX=0; gOY=0;
  gYaw=0.5; gPitch=-0.35; gAutoRot=true; gHover=null;
  gAlpha=Math.max(gAlpha,0.6);
}
function graphSync(){ if (graphMode!=="off"){ buildGraphData(); updateGLabel(); } }
/* graph input — bound to the inline pane and, when popped, the second window */
function bindGraphPointer(cv, win){
  const xy=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener("mousedown", e=>{
    const [ox,oy]=xy(e);
    const n=gPick(ox,oy);
    gMoved=false; gLastXY=[ox,oy];
    if (n) gDrag=n; else { gPanning=true; cv.style.cursor="grabbing"; }
  });
  win.addEventListener("mousemove", e=>{
    const [ox,oy]=xy(e);
    if (!gLastXY){
      if ((graphMode!=="off"||gPopped()) && e.target===cv) gHover=gPick(ox,oy);
      return;
    }
    const dx=ox-gLastXY[0], dy=oy-gLastXY[1];
    if (Math.abs(dx)+Math.abs(dy)>3) gMoved=true;
    if (gDrag){ gDrag.x+=dx/gScale; gDrag.y+=dy/gScale; gAlpha=Math.max(gAlpha,0.3); }
    else if (gPanning){
      if (g3d){ gAutoRot=false; gYaw+=dx*0.006; gPitch=Math.max(-1.4,Math.min(1.4,gPitch+dy*0.006)); }
      else { gOX+=dx; gOY+=dy; }
    }
    gLastXY=[ox,oy];
  });
  win.addEventListener("mouseup", async e=>{
    if (gLastXY && !gMoved){
      const [ox,oy]=xy(e);
      const n=gPick(ox,oy);
      if (n){
        if (n.viewTo) setGraphView(n.viewTo);
        if (n.cmd){ await run(n.cmd); if(!gPopped()) cmd.focus(); }
      }
    }
    gDrag=null; gPanning=false; gLastXY=null; cv.style.cursor="grab";
  });
  cv.addEventListener("wheel", e=>{
    e.preventDefault();
    const f=e.deltaY<0?1.12:0.89;
    gScale=Math.min(6,Math.max(0.25,gScale*f));
  }, {passive:false});
  cv.addEventListener("touchstart", e=>{
    const t=e.touches[0], r=cv.getBoundingClientRect();
    const ox=t.clientX-r.left, oy=t.clientY-r.top;
    const n=gPick(ox,oy);
    gMoved=false; gLastXY=[ox,oy];
    if (n) gDrag=n; else gPanning=true;
  },{passive:true});
  cv.addEventListener("touchmove", e=>{
    const t=e.touches[0], r=cv.getBoundingClientRect();
    const ox=t.clientX-r.left, oy=t.clientY-r.top;
    if (!gLastXY) return;
    const dx=ox-gLastXY[0], dy=oy-gLastXY[1];
    if (Math.abs(dx)+Math.abs(dy)>5) gMoved=true;
    if (gDrag){ gDrag.x+=dx/gScale; gDrag.y+=dy/gScale; gAlpha=Math.max(gAlpha,0.3); }
    else if (g3d){ gAutoRot=false; gYaw+=dx*0.006; gPitch=Math.max(-1.4,Math.min(1.4,gPitch+dy*0.006)); }
    else { gOX+=dx; gOY+=dy; }
    gLastXY=[ox,oy];
    e.preventDefault();
  },{passive:false});
  cv.addEventListener("touchend", async e=>{
    if (gLastXY && !gMoved){
      const n=gPick(gLastXY[0],gLastXY[1]);
      if (n){
        if (n.viewTo) setGraphView(n.viewTo);
        if (n.cmd){ await run(n.cmd); }
      }
    }
    gDrag=null; gPanning=false; gLastXY=null;
  });
}

/* ---------- QR encoder (V1-M mask0, verified against zbar) ---------- */
/* Minimal QR: Version 1, EC M, mask 0, byte mode, payload <= 14 bytes. */
function qrMatrix(text){
  const bytes=[...text].map(c=>c.charCodeAt(0)&0xff);
  if (bytes.length>14) return null;
  const EXP=new Array(512), LOG=new Array(256);
  for (let i=0,x=1;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11d; }
  for (let i=255;i<512;i++) EXP[i]=EXP[i-255];
  /* data bits -> 16 codewords */
  const bits=[];
  const push=(v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>i)&1); };
  push(4,4); push(bytes.length,8); bytes.forEach(b=>push(b,8));
  push(0, Math.min(4, 128-bits.length));
  while (bits.length%8) bits.push(0);
  const data=[];
  for (let i=0;i<bits.length;i+=8) data.push(bits.slice(i,i+8).reduce((a,b)=>(a<<1)|b,0));
  const PAD=[0xEC,0x11]; let pi=0;
  while (data.length<16) data.push(PAD[pi++%2]);
  /* generator poly, degree 10, descending coefficients */
  let gen=[1];
  for (let i=0;i<10;i++){
    const ng=new Array(gen.length+1).fill(0);
    for (let j=0;j<gen.length;j++){
      ng[j]   ^= gen[j];                                   // * x
      ng[j+1] ^= EXP[(LOG[gen[j]]+i)%255];                 // * α^i
    }
    gen=ng;
  }
  /* RS division -> 10 ecc */
  const msg=data.concat(new Array(10).fill(0));
  for (let i=0;i<16;i++){
    const c=msg[i]; if(!c) continue;
    const l=LOG[c];
    for (let j=0;j<gen.length;j++) msg[i+j]^=EXP[(l+LOG[gen[j]])%255];
  }
  const all=data.concat(msg.slice(16));
  /* 21x21 */
  const N=21, M=[...Array(N)].map(()=>Array(N).fill(null));
  const finder=(r,c)=>{ for(let i=-1;i<8;i++) for(let j=-1;j<8;j++){
    const rr=r+i, cc=c+j; if(rr<0||rr>=N||cc<0||cc>=N) continue;
    const on = i>=0&&i<7&&j>=0&&j<7 && (i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));
    M[rr][cc]=on?1:0; } };
  finder(0,0); finder(0,N-7); finder(N-7,0);
  for (let i=8;i<N-8;i++){ M[6][i]=i%2?0:1; M[i][6]=i%2?0:1; }
  /* format info: (M, mask0) = 0x5412, MSB-first, verified against zbar */
  const F=0x5412, f=[...Array(15)].map((_,i)=>(F>>(14-i))&1);
  for (let i=0;i<6;i++) M[8][i]=f[i];
  M[8][7]=f[6]; M[8][8]=f[7]; M[7][8]=f[8];
  for (let i=9;i<15;i++) M[14-i][8]=f[i];
  for (let i=0;i<7;i++) M[N-1-i][8]=f[i];
  for (let i=7;i<15;i++) M[8][N-15+i]=f[i];
  M[N-8][8]=1;                                             /* dark module */
  /* zigzag placement, mask 0 */
  const allBits=[]; all.forEach(b=>{ for(let i=7;i>=0;i--) allBits.push((b>>i)&1); });
  let bi=0, up=true;
  for (let col=N-1; col>0; col-=2){
    if (col===6) col--;
    for (let k=0;k<N;k++){
      const row = up ? N-1-k : k;
      for (const c2 of [col,col-1]){
        if (M[row][c2]!==null) continue;
        let v=allBits[bi++]||0;
        if ((row+c2)%2===0) v^=1;
        M[row][c2]=v;
      }
    }
    up=!up;
  }
  return M;
}


function qrSVG(text){
  const m=qrMatrix(text);
  if (!m) return "";
  const N=21, Q=2, S=N+2*Q;
  let rects="";
  for (let r=0;r<N;r++) for (let c=0;c<N;c++)
    if (m[r][c]) rects+=`<rect x="${c+Q}" y="${r+Q}" width="1" height="1"/>`;
  return `<svg viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${S}" height="${S}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

/* handle persistence (IndexedDB — file handles can't live in localStorage) */
function idb(mode,fn){
  return new Promise(res=>{
    const rq=indexedDB.open("invos-fs",1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore("h");
    rq.onsuccess=()=>{ const db=rq.result;
      const t=db.transaction("h",mode).objectStore("h"); const r=fn(t);
      if(r) r.onsuccess=()=>res(r.result); else t.transaction.oncomplete=()=>res(); };
    rq.onerror=()=>res(null);
  });
}

  else print("backup file needs permission again — type: backup","a");

/* ── PHYSICAL SQLITE MIRROR ──────────────────────────────────────
   Browser storage stays PRIMARY (fast). We also mirror to a real
   invos.db SQLite file the user physically owns and can open in any
   DB tool. sql.js (SQLite-in-WASM) is loaded lazily. On Chromium the
   File System Access API auto-writes the chosen file; elsewhere the
   app offers a one-tap .db download. The app never blocks on this. */
let _SQL=null, dbHandle=null, dbDirty=0, dbLastSync=0;
async function loadSQL(){
  if (_SQL) return _SQL;
  if (window.initSqlJs){ _SQL=await window.initSqlJs({locateFile:f=>f}); return _SQL; }
  for (const src of ["sql-wasm.js","./sql-wasm.js","deploy/sql-wasm.js"]){
    try{ await new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); });
      if (window.initSqlJs){ _SQL=await window.initSqlJs({locateFile:f=>{
        const base=src.replace(/sql-wasm\.js$/,""); return base+f; }}); return _SQL; } }catch(e){}
  }
  return null;
}
/* build a real SQLite file (Uint8Array) from current state: a state blob
   (exact restore) + a queryable items table (external tools/reporting). */
async function buildDbBytes(){
  const SQL=await loadSQL(); if(!SQL) return null;
  const db=new SQL.Database();
  db.run("CREATE TABLE meta(key TEXT PRIMARY KEY, value TEXT)");
  db.run("CREATE TABLE state(id INTEGER PRIMARY KEY, blob TEXT, updated_at INTEGER)");
  db.run(`CREATE TABLE items(cid INTEGER PRIMARY KEY, id TEXT, name TEXT, dept INTEGER, section INTEGER,
    bin INTEGER, qty INTEGER, min INTEGER, value TEXT, pkg TEXT, part TEXT,
    supplier TEXT, source TEXT, link TEXT, notes TEXT, low INTEGER)`);
  db.run("CREATE TABLE sections(code TEXT PRIMARY KEY, label TEXT)");
  db.run("BEGIN");
  db.run("INSERT INTO meta VALUES ('schema',?),('app',?),('exported',?)",
    [String(SCHEMA),"INV.OS",new Date().toISOString()]);
  db.run("INSERT INTO state VALUES (1,?,?)",[JSON.stringify(state),Date.now()]);
  const ins=db.prepare(`INSERT INTO items VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`);
  state.items.forEach(c=>ins.run([c.cid, cidStr(c), c.name, clsNum(c.bin), secOf(c.bin),
    c.bin, c.qty, c.min, c.value||"", c.pkg||"", c.part||"",
    c.supplier||"", c.source||"", c.link||"", c.notes||"", c.qty<=c.min?1:0]));
  ins.free();
  const sec=db.prepare("INSERT INTO sections VALUES (?,?)");
  for (let d=0;d<10;d++){ sec.run([d+"000", clsLabel(d)]);
    Object.keys(state.sections||{}).filter(k=>+k[0]===d).forEach(k=>sec.run([k+"0", state.sections[k]])); }
  sec.free();
  db.run("COMMIT");
  const bytes=db.export(); db.close(); return bytes;
}
/* attach a physical .db file (Chromium): pick once, auto-sync after */
async function attachDb(){
  if (!window.showSaveFilePicker){
    // fallback: just download a .db now
    const bytes=await buildDbBytes(); if(!bytes){ print("couldn't load the SQLite engine.","a"); return; }
    dlBytes(bytes, "invos.db");
    print("this browser can't auto-write files — downloaded invos.db instead. (Chromium/Edge can auto-sync: 'db' there.)","a");
    return;
  }
  try{
    dbHandle=await showSaveFilePicker({suggestedName:"invos.db",
      types:[{description:"SQLite database",accept:{"application/x-sqlite3":[".db",".sqlite"]}}]});
    await idbSet("dbhandle", dbHandle);
    await syncDb(true);
    print("physical database attached — invos.db now auto-syncs. open it in any SQLite tool.","g");
  }catch(e){ print("attach cancelled.","d"); }
}
async function restoreDbHandle(){
  if (!window.showSaveFilePicker) return;
  try{ const h=await idbGet("dbhandle"); if(!h) return;
    if (await h.queryPermission({mode:"readwrite"})==="granted"){ dbHandle=h; }
  }catch(e){}
}
async function syncDb(force){
  if (!dbHandle) return false;
  if (!force && (++dbDirty<8)) return false;   // batch writes; .db build is heavier than JSON
  try{
    const bytes=await buildDbBytes(); if(!bytes) return false;
    const w=await dbHandle.createWritable(); await w.write(bytes); await w.close();
    dbDirty=0; dbLastSync=Date.now(); return true;
  }catch(e){ dbHandle=null; return false; }   // handle lost -> silently stop, app unaffected
}
function dlBytes(bytes, name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type:"application/x-sqlite3"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

/* ── unified cursor ─────────────────────────────────────────────
   One rule for the whole app: Tab / ↓ move down through the rows that
   are currently on screen (home shelves, live results, or a printed
   list), ↑ / shift-Tab move up, Enter opens. No modes, no w/s. ── */
function navRows(){
  if (liveItems.length) return [...live.querySelectorAll("[data-i]")];
  return [...out.querySelectorAll(".idx")];
}
function navSel(){ return liveItems.length ? liveSel : browseSel; }
function graphHighlightCid(cid){
  if (graphMode==="off"){ return; }
  if (cid==null){ if(gHover&&gHover.type==="part") gHover=null; return; }

}
function rowCid(el){ return el && el.dataset.cid ? +el.dataset.cid : null; }
function navPaint(i){
  const rows=navRows();
  rows.forEach((el,k)=>el.classList.toggle("sel", k===i));
  if (i>=0 && rows[i]) rows[i].scrollIntoView({block:"nearest"});
  if (liveItems.length) liveSel=i; else browseSel=i;
  // mirror the selection into the graph: highlight the matching node
  graphHighlightCid(i>=0 ? (rowCid(rows[i]) ?? (liveItems[i]&&liveItems[i].cid)) : null);
}
function navMove(d){
  const rows=navRows(); if (!rows.length) return false;
  let i=navSel()+d;
  if (i< -1) i=-1;
  if (i>=rows.length) i=rows.length-1;
  navPaint(i);
  return i>=0;
}
async function navOpen(mod){
  const rows=navRows(), i=navSel();
  if (i<0 || !rows[i]) return false;
  const el=rows[i];
  if (el.dataset.menu){
    browseSel=-1; menuOpen=false;
    const m=el.dataset.menu;
    if (m.startsWith("run:")){
      const c=m.slice(4);
      out.innerHTML=""; live.innerHTML=""; cmd.value=""; drawMirror();
      if (c) await run(c); else home();
    } else {
      const pre=m.slice(5);
      out.innerHTML=""; live.innerHTML=""; home();
      cmd.value=pre; drawMirror(); renderLive();
    }
    return true;
  }
  // live result or part row -> cid; home/section row -> its command
  const cid = el.dataset.cid ? +el.dataset.cid
            : (liveItems.length && liveItems[i]) ? liveItems[i].cid : null;
  if (cid!=null){
    const it=state.items.find(c=>c.cid===cid);
    if (it){
      const c = mod==="take" ? `take ${cidStr(it)} 1`
              : mod==="stock" ? `stock ${cidStr(it)} 1`
              : `info ${cidStr(it)}`;
      liveSel=-1; liveItems=[]; live.innerHTML=""; browseSel=-1;
      cmd.value=""; drawMirror();
      await run(c); return true;
    }
  }
  if (el.dataset.cmd){
    liveSel=-1; browseSel=-1; cmd.value=""; drawMirror();
    if (liveItems.length){ liveItems=[]; live.innerHTML=""; }
    await run(el.dataset.cmd); return true;
  }
  return false;
}
