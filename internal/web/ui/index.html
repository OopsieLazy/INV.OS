   The grid drops the long-range part-to-part repulsion that the exact solver has. That
   sounds lossy, but the structure it was producing is better produced explicitly: HUBS
   (the sun, departments, sections, project cores) still repel each other exactly —
   there are only ever a handful — and they are what pushes clusters apart into
   separate galaxies. Parts only shove their immediate neighbours so stars do not
   overlap. Same picture, without the n². */

// Above this many nodes, switch from exact all-pairs to the spatial grid. Below it the
// exact solver is both affordable and visually identical to every earlier build.
const PHYSICS_EXACT_MAX = 1200;
// How far a part's shove reaches in the grid solver, and therefore the cell size.
const REPEL_RADIUS = 170;
// Most neighbours one part will be shoved by per cell. Without a cap, a dense clump
// puts hundreds of nodes in one cell and the inner loop goes quadratic again — the n²
// problem back in a smaller box. Past a handful of near neighbours the extra shoves are
// redundant anyway: they all point roughly the same way.
const REPEL_NEIGHBOUR_CAP = 12;

function isHub(n){
  return n.type==="sun" || n.type==="dept" || n.type==="sec" || n.type==="proj";
}

/* exact all-pairs repulsion — the original, unchanged */
function gRepelExact(a){
  const N=gNodes.length;
  for (let i=0;i<N;i++) for (let j=i+1;j<N;j++){
    const p=gNodes[i], q=gNodes[j];
    let dx=p.x-q.x, dy=p.y-q.y, dz=g3d?(p.z-q.z):0;
    let d2=dx*dx+dy*dy+dz*dz||0.01, d=Math.sqrt(d2);
    // galaxy: cores push each other MUCH harder -> clusters separate, dark space between
    const coreRep = ((gView.kind==="galaxy"||gView.kind==="projects") && p.core && q.core) ? 60 : 1;
    const f=900*a*coreRep/d2;
    dx/=d; dy/=d; dz/=d;
    p.vx+=dx*f; p.vy+=dy*f; q.vx-=dx*f; q.vy-=dy*f;
    if (g3d){ p.vz+=dz*f; q.vz-=dz*f; }
  }
}

/* Cell key for the spatial hash. Ten bits per axis: cells more than 1024 apart can
   collide, which at this cell size is far outside anything on screen, and a collision
   only ever costs one spurious neighbour check. */
function cellKey(ix,iy,iz){
  return ((ix & 1023)) | ((iy & 1023) << 10) | ((iz & 1023) << 20);
}

// The 13 forward neighbours plus self, so every pair of cells is visited exactly once.
const CELL_OFFSETS = (() => {
  const out = [[0,0,0]];
  for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) for (let dz=-1;dz<=1;dz++){
    if (dx===0&&dy===0&&dz===0) continue;
    if (dz>0 || (dz===0 && (dy>0 || (dy===0 && dx>0)))) out.push([dx,dy,dz]);
  }
  return out;
})();

/* grid repulsion: hubs exactly, parts only against near neighbours */
function gRepelGrid(a){
  const N=gNodes.length;
  const hubs=[], parts=[];
  for (let i=0;i<N;i++) (isHub(gNodes[i]) ? hubs : parts).push(gNodes[i]);

  // Hubs are few and carry the layout, so they keep the exact treatment — including
  // the core-vs-core boost that opens dark space between clusters.
  const galaxyish = (gView.kind==="galaxy"||gView.kind==="projects");
  for (let i=0;i<hubs.length;i++) for (let j=i+1;j<hubs.length;j++){
    const p=hubs[i], q=hubs[j];
    let dx=p.x-q.x, dy=p.y-q.y, dz=g3d?(p.z-q.z):0;
    let d2=dx*dx+dy*dy+dz*dz||0.01, d=Math.sqrt(d2);
    const coreRep = (galaxyish && p.core && q.core) ? 60 : 1;
    const f=900*a*coreRep/d2;
    dx/=d; dy/=d; dz/=d;
    p.vx+=dx*f; p.vy+=dy*f; q.vx-=dx*f; q.vy-=dy*f;
    if (g3d){ p.vz+=dz*f; q.vz-=dz*f; }
  }

  // Bucket the parts. Rebuilt every frame, which is O(n) and cheaper than keeping it
  // up to date while everything moves.
  const cells = new Map();
  const inv = 1/REPEL_RADIUS;
  for (let i=0;i<parts.length;i++){
    const n=parts[i];
    const k = cellKey(Math.floor(n.x*inv), Math.floor(n.y*inv), g3d?Math.floor(n.z*inv):0);
    let b = cells.get(k);
    if (!b){ b=[]; cells.set(k,b); }
    b.push(n);
  }

  const R2 = REPEL_RADIUS*REPEL_RADIUS;
  for (const [k, bucket] of cells){
    // decode this cell so neighbours can be addressed
    const ix = (k & 1023), iy = ((k >> 10) & 1023), iz = ((k >> 20) & 1023);
    for (let o=0;o<CELL_OFFSETS.length;o++){
      const [ox,oy,oz]=CELL_OFFSETS[o];
      const other = (ox===0&&oy===0&&oz===0)
        ? bucket
        : cells.get(cellKey(ix+ox, iy+oy, iz+oz));
      if (!other) continue;
      const same = other===bucket;
      for (let i=0;i<bucket.length;i++){
        const p=bucket[i];
        const from = same ? i+1 : 0;
        const to = Math.min(other.length, from + REPEL_NEIGHBOUR_CAP);
        for (let j = from; j<to; j++){
          const q=other[j];
          let dx=p.x-q.x, dy=p.y-q.y, dz=g3d?(p.z-q.z):0;
          let d2=dx*dx+dy*dy+dz*dz;
          if (d2>R2) continue;            // out of reach: the whole point of the grid
          // Two nodes on top of each other would otherwise divide by ~0 and fling each
          // other across the universe. Four is (2 units)²: close enough to shove hard,
          // not close enough to explode.
          if (d2<4) d2=4;
          const d=Math.sqrt(d2);
          const f=900*a/d2;
          dx/=d; dy/=d; dz/=d;
          p.vx+=dx*f; p.vy+=dy*f; q.vx-=dx*f; q.vy-=dy*f;
          if (g3d){ p.vz+=dz*f; q.vz-=dz*f; }
        }
      }
    }
  }
}

/* springs pull connected things together — O(edges), never the bottleneck */
function gSprings(a){
  const galaxyish=(gView.kind==="galaxy"||gView.kind==="projects");
  for (let i=0;i<gEdges.length;i++){
    const e=gEdges[i];
    const trail = e.w<0;               // inter-project "trail" — visual only, negligible pull
    const proj=(e.a.type==="proj"||e.b.type==="proj");
    // A cluster has to grow with what it holds. With a fixed rest length every shelf
    // sits the same distance from its hub, so a section with 200 parts packs them into
    // the same ball as one with 3 and the whole graph collapses to a dot at scale.
    // Radius grows as the square root of the count — the area a ball of k things needs —
    // which turns a big shelf into a visible cluster instead of a pixel.
    // Deliberately NOT applied to project hubs. The galaxy's 520 rest length is a tuned
    // number — it is what makes clusters sit far enough apart to pan between — and
    // inflating it stretched the orbits so wide that nodes swung past the camera every
    // pass. Only the inventory's shelves need to grow, because only they can end up
    // holding hundreds of parts.
    const hub = (e.a.type==="sec"||e.a.type==="dept") ? e.a
              : (e.b.type==="sec"||e.b.type==="dept") ? e.b : null;
    const spread = (hub && hub.count>4) ? Math.min(9, Math.sqrt(hub.count)/1.6) : 1;
    const rest = (proj ? (galaxyish?520:70)
               : (e.a.type==="dept"||e.b.type==="dept") ? 85 : 55) * spread;
    let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, dz=g3d?(e.b.z-e.a.z):0;
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.01;
    const f=(d-rest)*(trail?0.002:0.045)*a;   // trails barely tug -> don't collapse the spacing
    dx/=d; dy/=d; dz/=d;
    e.a.vx+=dx*f; e.a.vy+=dy*f; e.b.vx-=dx*f; e.b.vy-=dy*f;
    if (g3d){ e.a.vz+=dz*f; e.b.vz-=dz*f; }
  }
}

/* gentle pull to the middle, then move everything — O(nodes) */
/* Speed limit. This is a plain forward-Euler integrator, and springs pull harder the
   further they are stretched — so once anything gets flung far, the spring yanks it
   back even harder, it overshoots further, and the whole layout diverges. Measured at
   20,000 nodes it reached coordinates of 1e49 within a few seconds: not a slow layout,
   a numerically exploded one.

   Capping how far a node may move in one frame makes that impossible. It is generous
   enough that a normal graph never reaches it — settled motion is a couple of units a
   frame — so the small-graph behaviour is untouched. */
const MAX_STEP = 120;

function gIntegrate(a){
  const max2 = MAX_STEP*MAX_STEP;
  for (let i=0;i<gNodes.length;i++){
    const n=gNodes[i];
    if (n.type==="sun"){ n.x=0; n.y=0; n.z=0; n.vx=n.vy=n.vz=0; continue; }  // anchored center
    n.vx-=n.x*0.004*a; n.vy-=n.y*0.004*a; if(g3d) n.vz-=n.z*0.004*a;
    if (n===gDrag) { n.vx=0; n.vy=0; n.vz=0; continue; }
    const vz = g3d ? n.vz : 0;
    const sp2 = n.vx*n.vx + n.vy*n.vy + vz*vz;
    if (sp2 > max2){
      const k = MAX_STEP/Math.sqrt(sp2);
      n.vx*=k; n.vy*=k; if (g3d) n.vz*=k;
    }
    n.x+=n.vx; n.y+=n.vy; n.vx*=0.85; n.vy*=0.85;
    if (g3d){ n.z+=n.vz; n.vz*=0.85; }
  }
}

function gPhysics(a){
  if (gNodes.length <= PHYSICS_EXACT_MAX) gRepelExact(a);
  else gRepelGrid(a);
  gSprings(a);
  gIntegrate(a);
  gAlpha*=0.985;
}

/* warmGraph runs the simulation and the drawing once, on throwaway data, during boot.

   The first real frame of the graph cost 53ms — 19.5ms of physics and 10.4ms of draw —
   while the second cost 15ms and the fourth 12ms, on identical code and identical data.
   That difference is the engine compiling these functions the first time they run. It
   lands exactly when the pane appears, which is the worst possible moment: it reads as
   the graph stuttering as it opens.

   Running them here costs the same milliseconds during load, where nothing is on screen
   and nobody is watching a frame budget. */
function warmGraph(){
  try {
    const savedNodes = gNodes, savedEdges = gEdges, savedAlpha = gAlpha, savedView = gView;

    // A graph of the same SHAPE and a realistic SIZE. Sixty nodes compiled the code but
    // left the loops to be re-optimised for a real one, so the first open still paid.
    const n = [];
    for (let i=0;i<600;i++){
      n.push({ id:"w"+i, type: i===0?"sun" : i<7?"dept" : i<20?"sec" : "part",
               label:"warm "+i, core:i<7,
               x:(Math.random()-0.5)*400, y:(Math.random()-0.5)*400, z:(Math.random()-0.5)*400,
               vx:0, vy:0, vz:0 });
    }
    const e = [];
    for (let i=1;i<n.length;i++) e.push({ a:n[i], b:n[(i/3|0)], w: i%9===0 ? -1 : 1 });

    gNodes = n; gEdges = e; gView = {kind:"inv"};
    for (let i=0;i<3;i++) gPhysics(0.5);          // repel, springs, integrate
    gView = {kind:"galaxy"};
    for (let i=0;i<2;i++) gPhysics(0.5);          // the galaxy branches too
    initOrbits(); stepOrbits(1, 1); stepOrbits(1, 0.5);                  // and the orbit maths

    gNodes = savedNodes; gEdges = savedEdges; gAlpha = savedAlpha; gView = savedView;
    gOrbitInit = false;

    // The drawing side compiles through canvas, not through us, so warm it on a scratch
    // surface: the same operations the renderer uses, at a size nobody sees.
    // Size the real canvas now. Allocating a full backing store is a chunk of the first
    // open's cost, and doing it here means the first draw usually finds it already the
    // right size.
    try {
      const dpr = devicePixelRatio || 1;
      const w = Math.max(320, (gpane && gpane.clientWidth) || innerWidth);
      const h = Math.max(240, (gpane && gpane.clientHeight) || innerHeight);
      if (gc && !gc.width){ gc.width = w*dpr|0; gc.height = h*dpr|0; }
    } catch(e){}

    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    const x = c.getContext("2d");
    const C = themeCol();
    for (let i=0;i<24;i++){
      x.beginPath(); x.arc(32, 32, 4 + (i%5), 0, 7); x.fillStyle = i%2 ? C.fg : C.amber; x.fill();
      x.beginPath(); x.moveTo(0,0); x.lineTo(64,64); x.strokeStyle = C.dim; x.stroke();
    }
    x.shadowColor = C.cyan; x.shadowBlur = 8; x.fill();
    x.font = "11px Consolas,monospace"; x.textAlign = "center";
    x.fillText("warm", 32, 32);                   // first fillText also loads the font
    const img = x.createImageData(64, 64);        // and the dense renderer's path
    new Uint32Array(img.data.buffer).fill(0);
    x.putImageData(img, 0, 0);
  } catch(e){ /* warming is an optimisation; never let it break startup */ }
}

/* gWake restarts the render loop after it has parked itself.
   Every path that changes what should be on screen has to call this, or the graph looks
   frozen — which is why it is one function and not a line copied around. */
function gWake(){
  if (!gRAF && (graphMode!=="off" || gPopped())){
    gRAF = gPopped() ? gWin.requestAnimationFrame(gTick) : requestAnimationFrame(gTick);
  }
}

/* gIdle reports that there is genuinely nothing left to animate: the layout has
   settled, nothing is orbiting, no pointer is down and nothing is hovered. */
function gIdle(){
  return !!cfg("idleStop")
      && gAlpha <= 0.015
      && !(gOrbit && (gView.kind==="galaxy" || gView.kind==="projects"))
      && !gLastXY && !gDrag && !gHover
      && !gSpinPending()          // a resume that is due cannot fire with the loop parked
      && !gDrifting()             // a scene that is turning is not idle
      && sweepDone();
}

function gTick(){
  const a=gAlpha;

  // Orbit mode takes over the frame once the layout has settled. It pins gAlpha low
  // so the force simulation below stays quiet, draws, reschedules, and returns —
  // the physics and the orbits must never run in the same frame or they fight.
  if (gOrbit && (gView.kind==="galaxy" || gView.kind==="projects")){
    if (a<=0.05 && !gOrbitInit) initOrbits();
    if (gOrbitInit){
      // gLastXY is set for exactly as long as a pointer is held down. While it is,
      // everything stops: orbits do not advance and the camera does not drift, so a
      // node stays under the cursor and the scene does not slide out from under a
      // rotate. Motion resumes the moment the pointer is released.
      const held = !!gLastXY;
      if (!held){
        gOrbitRamp = Math.min(1, gOrbitRamp + 1/90);        // ~1.5s at 60fps
        const t = gOrbitRamp*gOrbitRamp*(3-2*gOrbitRamp);   // smoothstep, gentle at both ends
        // The floor is what keeps the first frames alive. A pure smoothstep starts at
        // essentially zero, so for the first ten frames the nodes barely follow the
        // orbit at all and the whole scene reads as a stall. At 0.035 a node closes 3.5%
        // of the gap to its orbit each frame, which at the radii we draw comes out to
        // about the same drift the settling layout was already producing — so the
        // handoff has no visible seam at either end.
        //
        // Nothing runs the force simulation here on purpose. Doing that (v24.4) kept the
        // motion going, but it also kept the LAYOUT going: project cores repel each other
        // 60x harder than parts do, so another second and a half of physics after the
        // orbits were captured pushed the clusters 1.34x further apart. The orbits looked
        // like they had grown, because they had.
        stepOrbits(cfg("orbitSpeed"), Math.max(0.035, t));
      }
      gAlpha = 0.001;
      if (!held) gSpinMaybeResume();
      if (g3d && gAutoRot && !held) gDrift();
      gDraw();
      if (graphMode==="off" && !gPopped()){ gRAF=null; return; }
      gRAF = gPopped() ? gWin.requestAnimationFrame(gTick) : requestAnimationFrame(gTick);
      return;
    }
  }
  if (a>0.015){
    gPhysics(a);
    /* Framing follows the layout the whole time it is settling, rather than being
       corrected in one jump at the end. See gEaseToFit — the end-only version sat on the
       wrong zoom for eight seconds and then snapped. */
    if (!gUserAdjusted){
      const now = performance.now();
      const dt = gFitT ? now - gFitT : 16.7;
      gFitT = now;
      gEaseToFit(dt);
    } else if (gAlpha<=0.015){
      keepZoomRelative();           // they chose a zoom; hold it against the new size
    }
  } else {
    gFitT = 0;                      // settled: start the clock fresh next time
  }
  const idle = gIdle();
  gSpinMaybeResume();
  if (g3d && gAutoRot && !idle) gDrift();
  gDraw();
  if (graphMode!=="off" && (performance.now()&255)<20) updateHud();  // occasional stat refresh
  if (graphMode==="off" && !gPopped()){ gRAF=null; return; }
  // Nothing is moving: draw this frame and stop asking for more. Anything that changes
  // the picture calls gWake().
  if (idle){ gRAF=null; return; }
  gRAF = gPopped() ? gWin.requestAnimationFrame(gTick) : requestAnimationFrame(gTick);
}
/* project a 3D point to screen; returns {sx,sy,scale,depth} */
function project(n, W, H){
  const cy=Math.cos(gYaw), sy=Math.sin(gYaw), cp=Math.cos(gPitch), sp=Math.sin(gPitch);
  let x=n.x, y=n.y, z=n.z||0;
  let x1=x*cy - z*sy, z1=x*sy + z*cy;          // yaw
  let y1=y*cp - z1*sp, z2=y*sp + z1*cp;        // pitch
  // A node whose rotated depth falls past the camera plane makes this denominator
  // negative, and a negative perspective divide MIRRORS the node to the opposite side
  // of the screen at negative size. On screen that is a cluster snapping across the
  // view as it swings close — the jank, not a physics problem. Measured on the demo
  // galaxy: ~3 nodes behind the camera on an average frame.
  const denom = gCamZ + z2 + 300;
  const vis = denom > 1;
  const persp = vis ? gCamZ/denom : 0;
  return { sx:W/2+gOX + x1*persp*gScale, sy:H/2+gOY + y1*persp*gScale,
           scale:persp*gScale, depth:z2, vis };
}

/* projectInto is project() without the allocation: it writes into a result object kept
   on the node itself.

   The renderer used to build a Map and a fresh projection object for every node, plus a
   wrapper object per edge and per node for depth sorting — roughly 1,200 objects and six
   arrays EVERY FRAME. At 60fps that is around 72,000 objects a second of pure garbage,
   and the collector paying it back showed up as an occasional 30-40ms frame: the graph
   running smoothly and then hitching for no visible reason.

   Nothing here allocates now. The projections live on the nodes, and the draw order is
   held in two arrays that are reused and sorted in place. */
function projectInto(n, W, H){
  const cy=Math.cos(gYaw), sy=Math.sin(gYaw), cp=Math.cos(gPitch), sp=Math.sin(gPitch);
  const x=n.x, y=n.y, z=n.z||0;
  const x1=x*cy - z*sy, z1=x*sy + z*cy;
  const y1=y*cp - z1*sp, z2=y*sp + z1*cp;
  const denom = gCamZ + z2 + 300;
  const vis = denom > 1;
  const persp = vis ? gCamZ/denom : 0;
  const p = n._p || (n._p = {sx:0, sy:0, scale:0, depth:0, vis:false});
  p.sx = W/2+gOX + x1*persp*gScale;
  p.sy = H/2+gOY + y1*persp*gScale;
  p.scale = persp*gScale;
  p.depth = z2;
  p.vis = vis;
  return p;
}
/* ── dense rendering ─────────────────────────────────────────────────────────
   Past a few thousand nodes the ordinary renderer stops being viable, and not because
   of the pixels: it is the CALLS. Every node costs a globalAlpha, a beginPath, an arc,
   a fillStyle and a fill — twice, because the bright core is a second circle — and
   every edge costs its own stroke with its own dash and width. Measured at 100,000
   nodes that came to 625ms a frame while the physics needed 47ms.

   So above the threshold the parts stop being shapes and become PIXELS: their screen
   positions are written straight into an image buffer and blitted once, the way a
   falling-sand game paints its world. Brightness accumulates where stars overlap,
   which is what makes a dense cluster read as a glowing core rather than a grey blob.

   The hubs — the sun, departments, sections, project cores — stay real drawn circles
   with labels on top, because there are only ever a handful and they are the structure
   you actually read. Part-to-part hairlines are dropped at this scale; at 100,000
   nodes they are visual noise, and the clustering is legible from the stars alone. */

const DRAW_DENSE_MIN = 1500;   // tuned below — see the measurement in NOTES v24.3
let denseImg = null, denseArr = null, denseW = 0, denseH = 0;

/* packRGB builds the little-endian ABGR word an ImageData buffer expects. */
function packRGB(hex){
  hex = hex.replace("#","");
  if (hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return {r,g,b};
}

function gDrawDense(x, W, H, dpr, C){
  const pw = Math.max(1, W*dpr|0), ph = Math.max(1, H*dpr|0);
  if (!denseImg || denseW!==pw || denseH!==ph){
    denseImg = x.createImageData(pw, ph);
    denseArr = new Uint32Array(denseImg.data.buffer);
    denseW = pw; denseH = ph;
  }
  denseArr.fill(0);   // fully transparent: the pane's own background shows through

  const part = packRGB(C.fg), low = packRGB(C.amber);
  // Accumulate into the RGB channels so overlapping stars brighten rather than
  // overwrite. Alpha is pinned opaque wherever anything landed.
  const plot = (px, py, col) => {
    if (px<0 || py<0 || px>=denseW || py>=denseH) return;
    const i = py*denseW + px;
    const cur = denseArr[i];
    if (!cur){ denseArr[i] = 0xff000000 | (col.b<<16) | (col.g<<8) | col.r; return; }
    const r = Math.min(255, (cur & 255) + (col.r>>1));
    const g = Math.min(255, ((cur>>8) & 255) + (col.g>>1));
    const b = Math.min(255, ((cur>>16) & 255) + (col.b>>1));
    denseArr[i] = 0xff000000 | (b<<16) | (g<<8) | r;
  };

  let drawn = 0;
  for (let i=0;i<gNodes.length;i++){
    const n = gNodes[i];
    if (isHub(n) || n.type==="shared") continue;   // hubs are drawn properly below
    let sx, sy, sc;
    if (g3d){
      const p = project(n, W, H);
      if (!p.vis) continue;               // behind the camera
      sx=p.sx; sy=p.sy; sc=p.scale;
    }
    else { sx = W/2+gOX + n.x*gScale; sy = H/2+gOY + n.y*gScale; sc = gScale; }
    const px = (sx*dpr)|0, py = (sy*dpr)|0;
    if (px<0 || py<0 || px>=denseW || py>=denseH) continue;
    const col = n.low ? low : part;
    plot(px, py, col);
    // a second pixel once zoomed in, so stars do not vanish when the view is close
    if (sc > 0.9){ plot(px+1, py, col); plot(px, py+1, col); plot(px+1, py+1, col); }
    drawn++;
  }
  x.putImageData(denseImg, 0, 0);
  return drawn;
}

function gDraw(){
  const {cv,W,H,dpr}=gDims();
  if (!W||!H) return;
  if (cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  const x=cv.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  if (!gNodes.length){
    x.fillStyle=themeCol().dim; x.font="12px Consolas,monospace"; x.textAlign="center";
    x.fillText(graphItemsLoading ? "reading the inventory…"
             : gView.kind==="projects" ? "no projects yet — project new <name>"
             : "nothing here yet — add parts", W/2, H/2);
    return;
  }
  const hoverSet = gHover ? new Set([gHover.id]) : null;
  if (hoverSet) gEdges.forEach(e=>{ if(e.a===gHover||e.b===gHover){ hoverSet.add(e.a.id); hoverSet.add(e.b.id);} });

  if (g3d){ gDraw3D(x, W, H, hoverSet); drawSweep(x,W,H); return; }

  const C=themeCol();
  const dense = gNodes.length > DRAW_DENSE_MIN;
  // parts as pixels first, then the structure on top of them.
  // putImageData works in device pixels and ignores the current transform, which is
  // why this needs no save/restore around it.
  if (dense) gDrawDense(x, W, H, dpr, C);
  x.save();
  x.translate(W/2+gOX, H/2+gOY); x.scale(gScale,gScale);
  // edges
  if (!dense) gEdges.forEach(e=>{
    const trail = e.w<0;
    const hot = hoverSet && hoverSet.has(e.a.id) && hoverSet.has(e.b.id) && (e.a===gHover||e.b===gHover);
    x.globalAlpha = hoverSet ? (hot?0.9:0.05) : (trail?0.14:0.28);
    x.strokeStyle = trail ? C.cyan : (e.a.type==="proj"||e.b.type==="proj") ? C.cyan : C.dim;
    x.lineWidth = (trail?0.6:Math.min(3,(Math.abs(e.w)||1)*0.5+0.4))/gScale;
    if (trail) x.setLineDash([6/gScale,6/gScale]); else x.setLineDash([]);
    x.beginPath(); x.moveTo(e.a.x,e.a.y); x.lineTo(e.b.x,e.b.y); x.stroke();
  });
  else {
    // at this scale only the skeleton is worth drawing: hub to hub, not every part
    x.globalAlpha=0.35; x.strokeStyle=C.dim; x.lineWidth=1/gScale;
    x.beginPath();
    for (let i=0;i<gEdges.length;i++){
      const e=gEdges[i];
      if (!isHub(e.a) || !isHub(e.b)) continue;
      x.moveTo(e.a.x,e.a.y); x.lineTo(e.b.x,e.b.y);
    }
    x.stroke();
  }
  x.setLineDash([]);
  gNodes.forEach(n=>{
    if (dense && !isHub(n) && n.type!=="shared") return;   // already a pixel
    const dim = hoverSet && !hoverSet.has(n.id);
    x.globalAlpha = dim?0.12:1;
    const r=nodeR(n);
    x.beginPath(); x.arc(n.x,n.y,r,0,7);
    x.fillStyle = n.type==="sun"  ? C.white
                : n.type==="shared" ? C.white
                : n.type==="proj" ? (n.active?C.white:C.fg)
                : n.type==="dept" ? C.cyan
                : n.type==="sec"  ? C.dim
                : n.low ? C.amber : C.fg;
    x.fill();
    if (n.type==="sun"||n.type==="dept"||n===gHover){ x.strokeStyle=C.cyan; x.lineWidth=1.4/gScale; x.stroke(); }
    if (gCores && !dim && n.type!=="dept"){ x.beginPath(); x.arc(n.x,n.y,r*0.4,0,7); x.fillStyle=C.white; x.fill(); }
    const show = n.type==="sun"||n.type==="proj"||n.type==="dept" || (n.type==="sec"&&gScale>0.75) ||
                 (n.type==="part"&&(gView.kind==="proj"||gScale>1.5||n===gHover));
    if (show && !dim){
      x.font=`${Math.max(9,11/gScale)}px Consolas,monospace`;
      x.fillStyle = n.type==="proj"?C.white:n.low?C.amber:C.fg;
      x.textAlign="center";
      x.fillText(n.label.slice(0,20), n.x, n.y-r-4/gScale);
    }
  });
  x.restore();
  drawSweep(x,W,H);
}
/* radar boot-sweep: one rotation on graph open, lights the scene */
// The sweep is a one-shot animation after the pane opens; parking mid-sweep would
// freeze it half-drawn.
function sweepDone(){ return (performance.now() - sweepT) > 2600; }

function drawSweep(x,W,H){
  if (gStyle!=="holo") return;
  const dur=1100, t=performance.now()-sweepT;
  if (t<0 || t>dur) return;
  const C=themeCol();
  const cx=W/2+gOX, cy=H/2+gOY, R=Math.hypot(W,H)/2;
  const ang=-Math.PI/2 + (t/dur)*Math.PI*2;
  const fade=1-(t/dur);
  x.save();
  for (let k=0;k<40;k++){                 // trailing wedge
    const a=ang-k*0.03;
    x.globalAlpha=Math.max(0,(0.35-k*0.008))*fade;
    x.strokeStyle=C.cyan; x.lineWidth=2;
    x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a)); x.stroke();
  }
  x.globalAlpha=0.9*fade; x.strokeStyle=C.white; x.lineWidth=2;   // bright leading edge
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+R*Math.cos(ang),cy+R*Math.sin(ang)); x.stroke();
  x.globalAlpha=1; x.restore();
}
/* 3D renderer: depth-sorted, perspective, holographic glow */
/* gDraw3D draws the parts as pixels when there are too many to draw as shapes, then
   hands the hubs to the full renderer below. Filtering the node and edge lists for the
   duration is deliberate: the hub rendering — fog, depth sorting, gradients, labels,
   the holo styling — is worth keeping exactly as it is, and it is affordable on a
   hundred nodes. Only the part layer needs the cheap path. */
function gDraw3D(x, W, H, hoverSet){
  if (gNodes.length <= DRAW_DENSE_MIN) return gDraw3DShapes(x, W, H, hoverSet);

  gDrawDense(x, W, H, gDims().dpr, themeCol());

  const allNodes = gNodes, allEdges = gEdges;
  const keep = n => isHub(n) || n.type==="shared";
  gNodes = allNodes.filter(keep);
  gEdges = allEdges.filter(e => keep(e.a) && keep(e.b));
  try { gDraw3DShapes(x, W, H, hoverSet); }
  finally { gNodes = allNodes; gEdges = allEdges; }
}

// Reused across frames so the draw order costs no allocation. Comparators are hoisted
// for the same reason: an arrow function passed to sort() is allocated on every call.
const _edrawn = [], _ndrawn = [];
const byEdgeDepth = (a,b) => a._z - b._z;
const byNodeDepth = (a,b) => a._p.depth - b._p.depth;

function gDraw3DShapes(x, W, H, hoverSet){
  const holo = gStyle==="holo";
  const C=themeCol();
  // projections are written onto the nodes; nothing is allocated per frame
  let zmin=1e9, zmax=-1e9;
  for (let i=0;i<gNodes.length;i++){
    const p = projectInto(gNodes[i], W, H);
    if (p.depth<zmin) zmin=p.depth;
    if (p.depth>zmax) zmax=p.depth;
  }
  const P = { get: n => n._p };          // keeps the rest of this function readable
  const fog = d => { const t=(zmax-zmin)?(d-zmin)/(zmax-zmin):0.5; return 0.35+0.65*(1-t); }; // far = fainter

  // ambient starfield dust (holo only) — subtle jarvis atmosphere
  if (holo && !hoverSet && cfg("dust")){
    x.globalAlpha=0.5;
    for (let i=0;i<40;i++){
      const sx=(Math.sin(i*12.9+gYaw*40)*0.5+0.5)*W;
      const sy=(Math.cos(i*7.7 -gYaw*30)*0.5+0.5)*H;
      x.fillStyle=hexA(C.cyan,0.06); x.fillRect(sx,sy,1.5,1.5);
    }
    x.globalAlpha=1;
  }

  x.lineCap="round";
  // An edge with one end behind the camera would be drawn to a mirrored point, so it
  // is dropped along with the node.
  _edrawn.length=0;
  for (let i=0;i<gEdges.length;i++){
    const e=gEdges[i], pa=e.a._p, pb=e.b._p;
    if (!pa || !pb || !pa.vis || !pb.vis) continue;
    e._z = (pa.depth + pb.depth) / 2;    // sort key lives on the edge, not a wrapper
    _edrawn.push(e);
  }
  _edrawn.sort(byEdgeDepth);
  _edrawn.forEach(e=>{
    const a=P.get(e.a), b=P.get(e.b);
    const trail = e.w<0;                          // faint inter-project trail
    const near=(e.a.type==="proj"||e.b.type==="proj");
    const hot = hoverSet && hoverSet.has(e.a.id) && hoverSet.has(e.b.id) && (e.a===gHover||e.b===gHover);
    const f=fog((a.depth+b.depth)/2);
    x.globalAlpha = hoverSet ? (hot?0.95:0.04) : trail ? 0.12*f : (holo?0.22*f:0.3*f);
    if (trail){ x.strokeStyle=hexA(C.cyan,0.6); x.shadowColor=C.cyan; x.shadowBlur=3; x.setLineDash([5,7]); }
    else if (holo){
      const grad=x.createLinearGradient(a.sx,a.sy,b.sx,b.sy);
      grad.addColorStop(0, near?C.cyan:C.dim); grad.addColorStop(1, hexA(near?C.cyan:C.dim,0.15));
      x.strokeStyle=grad; x.shadowColor=C.cyan; x.shadowBlur=near?8:2; x.setLineDash([]);
    } else { x.strokeStyle = near?C.cyan:C.dim; x.shadowBlur=0; x.setLineDash([]); }
    x.lineWidth = trail?0.6 : Math.max(0.4, Math.min(3,(Math.abs(e.w)||1)*0.5+0.4)*a.scale);
    x.beginPath(); x.moveTo(a.sx,a.sy); x.lineTo(b.sx,b.sy); x.stroke();
  });
  x.setLineDash([]);

  // glow on every node stops being affordable — and stops being legible — in a crowd
  const glowAll = gNodes.length <= 400;
  _ndrawn.length=0;
  for (let i=0;i<gNodes.length;i++){ const n=gNodes[i]; if (n._p && n._p.vis) _ndrawn.push(n); }
  _ndrawn.sort(byNodeDepth);
  _ndrawn.forEach(n=>{
    const p=n._p;
    const dim = hoverSet && !hoverSet.has(n.id);
    const f=fog(p.depth);
    const r=Math.max(1.2, nodeR(n)*p.scale);
    const col = n.type==="sun"  ? C.white
              : n.type==="shared" ? C.white
              : n.type==="proj" ? (n.active?C.white:C.cyan)
              : n.type==="dept" ? C.cyan
              : n.type==="sec"  ? (holo?hexA(C.cyan,0.7):C.dim)
              : n.low ? C.amber : C.fg;
    x.globalAlpha = dim?0.08:f;
    // hub rings — concentric halo on departments & active projects (jarvis targeting reticle)
    if (holo && !dim && (n.type==="sun"||n.type==="dept"||(n.type==="proj"&&n.active))){
      x.strokeStyle=hexA(C.cyan,0.5); x.lineWidth=1; x.shadowColor=C.cyan; x.shadowBlur=10;
      x.beginPath(); x.arc(p.sx,p.sy,r+5,0,7); x.stroke();
      x.globalAlpha=dim?0.05:f*0.5;
      x.beginPath(); x.arc(p.sx,p.sy,r+9,0,7); x.stroke();
      x.globalAlpha=dim?0.08:f;
    }
    // Shadow blur is by far the most expensive thing canvas does, and it was being set
    // per node. Measured at 3,000 nodes it was most of a 13ms draw. Past a few hundred
    // nodes the glow is kept for the hubs and whatever is hovered — the things a person
    // is actually looking at — and dropped for the rest, where hundreds of overlapping
    // halos read as haze anyway.
    if (holo && !dim && (glowAll || isHub(n) || n===gHover)){
      x.shadowColor=col; x.shadowBlur=(n===gHover?24:13)*Math.max(.5,p.scale)*cfg("glow");
    }
    else x.shadowBlur=0;
    x.beginPath(); x.arc(p.sx,p.sy,r,0,7); x.fillStyle=col; x.fill();
    if (holo && gCores && !dim){                   // bright white core (toggle)
      x.shadowBlur=0; x.globalAlpha=Math.min(1,(0.5+p.scale*0.5))*f;
      x.beginPath(); x.arc(p.sx,p.sy,r*0.42,0,7); x.fillStyle=C.white; x.fill();
    }
    const show = n.type==="sun"||n.type==="proj"||n.type==="dept" || (n.type==="sec"&&p.scale>0.7) ||
                 (n.type==="part"&&(gView.kind==="proj"||p.scale>cfg("labelZoom")||n===gHover));
    if (show && !dim){
      x.shadowBlur=0; x.globalAlpha=Math.min(1,p.scale)*f;
      x.font=`${Math.max(8,11*p.scale)}px Consolas,monospace`;
      x.fillStyle = n.type==="proj"?C.white:n.low?C.amber:(holo?hexA(C.cyan,0.85):C.fg);
      x.textAlign="center";
      x.fillText(String(n.label||"").slice(0,20), p.sx, p.sy-r-3);
    }
  });
  x.shadowBlur=0; x.globalAlpha=1;
}
function gPick(px,py){
  const {W,H}=gDims();
  if (g3d){
    let hit=null, best=1e9;   // nearest node in screen space, front-most wins ties
    gNodes.forEach(n=>{
      const p=project(n,W,H);
      if (!p.vis) return;                 // not on screen; cannot be clicked
      const d=Math.hypot(p.sx-px, p.sy-py);
      const rr=Math.max(4, nodeR(n)*p.scale)+6;
      if (d<rr){ const score=d - p.depth*0.05; if(score<best){ best=score; hit=n; } }
    });
    return hit;
  }
  const wx=(px-W/2-gOX)/gScale, wy=(py-H/2-gOY)/gScale;
  let hit=null, best=1e9;
  gNodes.forEach(n=>{
    const d=Math.hypot(n.x-wx,n.y-wy);
    if (d<nodeR(n)+6/gScale && d<best){ best=d; hit=n; }
  });
  return hit;
}
function setGraph(m){
  graphMode=m;
  document.body.classList.toggle("g-split", m==="split");
  document.body.classList.toggle("g-full", m==="full");

  gUserAdjusted=false; gZoomRel=0;
  gOX=0; gOY=0;

  buildGraphData();             // build ONCE, then frame whatever is actually there
  gScale=gFitScale();
  updateGLabel(); updateHud();
  sweepT = performance.now();     // kick off the radar sweep on open
  if (!gRAF) gRAF = gPopped() ? gWin.requestAnimationFrame(gTick) : requestAnimationFrame(gTick);
}

/* galaxyOn is the single question every galaxy entry point asks. Keeping it in one
   place is what lets the "no galaxy" build be a setting instead of a forked copy of
   the app that has to be re-derived after every change. */
function galaxyOn(){ return !!cfg("galaxy"); }

function cycleView(){
  if (graphMode==="off") setGraph("split");
  // if currently drilled into a single project, treat as "projects"
  const cur = gView.kind==="proj" ? "projects" : gView.kind;
  const order = state.projects.length
    ? (galaxyOn() ? ["inv","projects","galaxy"] : ["inv","projects"])
    : ["inv"];
  const i = order.indexOf(cur);
  const next = order[(i+1)%order.length];
  if (next==="galaxy") g3d=true;
  setGraphView({kind:next});
}
function galaxyGrow(){
  const times=state.projects.map(p=>p.created||0).filter(Boolean).sort((a,b)=>a-b);
  if (!times.length){ setGraphView({kind:"galaxy"}); return; }
  const t0=times[0], t1=times[times.length-1]||Date.now(), span=Math.max(1,t1-t0);
  const dur=6000, start=performance.now();
  print("growing the universe…","d");
  const step=()=>{
    const p=Math.min(1,(performance.now()-start)/dur);
    gView={kind:"galaxy", t: t0 + span*p};
    buildGraphData(); updateGLabel();
    if (p<1) requestAnimationFrame(step);
    else { gView={kind:"galaxy"}; buildGraphData(); }   // final: show all
  };
  step();
}
/* How far out the cloud actually reaches. Uses the 98th percentile rather than the
   maximum so a single node flung out by the simulation does not zoom the whole view
   into the distance. */
function gContentRadius(){
  if (!gNodes.length) return 0;
  const rs = new Float64Array(gNodes.length);
  for (let i=0;i<gNodes.length;i++){
    const n=gNodes[i];
    rs[i] = Math.hypot(n.x, n.y, g3d ? (n.z||0) : 0);
  }
  rs.sort();
  return rs[Math.min(rs.length-1, Math.floor(rs.length*0.98))] || 0;
}

/* The zoom that fits the cloud on screen — but never CLOSER than the configured launch
   zoom. A small shop's graph is unchanged (its cloud already fits, so the launch zoom
   wins); a large one zooms out until you can see it instead of sitting inside it.

   This is what a graph that grows needs: the layout spreads with the node count, and a
   fixed zoom quietly leaves everything off screen. */
/* The scale at which the content exactly fills the view. This is a pure measure of how
   big the layout currently is, with none of gFitScale's clamping — which is what the
   remembered zoom has to be measured against, since gFitScale caps at launchZoom and so
   stops responding to content size entirely once the content is small enough. */
function gContentFit(){
  const r = gContentRadius();
  if (!r) return 0;
  const {W,H} = gDims();
  return (Math.min(W,H) * 0.45) / r;
}

function gFitScale(){
  const launch = cfg("launchZoom");
  const fit = gContentFit();
  if (!fit) return launch;
  return Math.max(0.02, Math.min(launch, fit));
}

function gFitView(){
  gScale = gFitScale(); gOX = 0; gOY = 0;
}

/* Follow the fit while the layout is still settling, instead of correcting it once at
   the end.

   Fitting only at the end was meant to avoid framing a cloud that was still growing. What
   it actually produced: the graph opened at the configured launch zoom, sat there for
   EIGHT AND A HALF SECONDS while the physics wound down, and then jumped 2.3x wider in a
   single frame the moment alpha crossed the threshold. Measured, not guessed — the
   content extent never changed at all, so nothing about the scene justified the jump. It
   read as "it randomly zoomed out", because that is what it was.

   Easing toward the fit every frame is both smoother and more correct: the framing is
   never badly wrong for long, and it arrives with no step. The moment somebody touches
   the camera this stops entirely — gUserAdjusted is checked by the caller. */
function gEaseToFit(dt){
  const want = gFitScale();
  if (!(want > 0)) return;
  // Framed in elapsed time, not frames, so it eases the same on any refresh rate — and
  // so a dropped frame does not leave the camera behind.
  /* Deliberately slack. A tight follow tracks the layout's own overshoot — the cloud
     expands past where it settles and comes back — and the camera copies the wobble.
     At this rate the ease lags that overshoot enough to smooth it out, and still lands
     inside about a second and a half. */
  const k = 1 - Math.pow(0.02, Math.min(50, dt)/1000);
  gScale += (want - gScale)*k;
  gOX += (0 - gOX)*k;
  gOY += (0 - gOY)*k;
  // Land exactly, rather than approaching forever a hair away from correct.
  if (Math.abs(want - gScale) < want*0.002){ gScale = want; gOX = 0; gOY = 0; }
}

// Set as soon as the person zooms or pans, so the auto-fit stops overriding them.
let gUserAdjusted = false;

/* The user's zoom, remembered as a MULTIPLE of the fit rather than as an absolute
   number — 0 means they have not touched it.

   The graph opens before its items arrive: the inventory is fetched asynchronously and
   the layout is re-heated when it lands, so the content balloons a second or two in.
   The auto-fit normally absorbs that, but zooming switches the fit off — which left
   someone who zoomed during those first seconds holding a fixed scale while the content
   grew around them. Nothing had reset their zoom; the picture really was getting
   smaller. Storing the zoom against the fit means "twice as close as fits" stays twice
   as close as fits when the layout changes size. */
let gZoomRel = 0;
let gFitT = 0;      // timestamp for the fit ease; see gEaseToFit

function noteUserZoom(){
  gUserAdjusted = true;
  const f = gContentFit();
  if (f > 0) gZoomRel = gScale / f;
}

/* Re-apply the user's zoom after the content has changed size. Only acts when the fit
   has actually moved — otherwise every settled frame would nudge the scale. */
function keepZoomRelative(){
  if (!gZoomRel) return;
  const f = gContentFit();
  if (!(f > 0)) return;
  const want = f * gZoomRel;
  if (!(want > 0) || Math.abs(want - gScale) <= gScale*0.02) return;
  const r = want/gScale;
  gScale = want;
  gOX *= r; gOY *= r;             // a pan is in screen units, so it scales with the zoom
}

function graphHome(){          // recenter camera / view — the auto-home
  gWake();
  gUserAdjusted = false; gZoomRel = 0;
  gFitView();
  gYaw=0.5; gPitch=-0.35; gAutoRot=true; gHover=null;
  gSpinAx=1; gSpinAy=0; gSpinIdleAt=0; gHoming=false; gHomeT=0; gDriftT=0; gSpinFade=1;
  gAlpha=Math.max(gAlpha,0.6);
}
async function graphSync(){
  if (graphMode==="off") return;
  gWake();
  graphItemsLoaded = false;   // the inventory changed; re-read the graph's sample
  await Promise.all([refreshGraphItems(), gView.kind==="inv" ? null : loadProjects()]);
  buildGraphData(); updateGLabel();
}
/* graph input — bound to the inline pane and, when popped, the second window */
function bindGraphPointer(cv, win){
  const xy=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };

  /* Waking has to be generous. A graph that looks frozen is far worse than a few extra
     frames, and the canvas sits under the HUD overlay, so events aimed "at the graph"
     often land on something else. Any pointer activity in the window wakes it; if
     nothing is actually moving, gTick draws one frame and parks again, so the cost of
     over-waking is exactly that one frame. */
  ["mousemove","mousedown","wheel","touchstart","touchmove","keydown"].forEach(ev=>{
    win.addEventListener(ev, gWake, {passive:true});
  });
  cv.addEventListener("mousedown", e=>{
    gWake();
    const [ox,oy]=xy(e);
    const n=gPick(ox,oy);
    gMoved=false; gLastXY=[ox,oy];
    if (n) gDrag=n; else { gPanning=true; cv.style.cursor="grabbing"; }
  });
  win.addEventListener("mousemove", e=>{
    const [ox,oy]=xy(e);
    if (!gLastXY){
      if ((graphMode!=="off"||gPopped()) && e.target===cv){
        const was=gHover;
        gHover=gPick(ox,oy);
        if (gHover!==was) gWake();     // the highlight changed, so redraw
      }
      return;
    }
    gWake();
    const dx=ox-gLastXY[0], dy=oy-gLastXY[1];
    if (Math.abs(dx)+Math.abs(dy)>3) gMoved=true;
    if (gDrag){ gDrag.x+=dx/gScale; gDrag.y+=dy/gScale; gAlpha=Math.max(gAlpha,0.3); }
    else if (gPanning){
      noteUserZoom();
      if (g3d){ gAutoRot=false; gHoming=false; gSpinNote(dx,dy); gYaw+=dx*0.006; gPitch=Math.max(-1.4,Math.min(1.4,gPitch+dy*0.006)); }
      else { gOX+=dx; gOY+=dy; }
    }
    gLastXY=[ox,oy];
  });
  win.addEventListener("mouseup", async e=>{
    if (gLastXY && !gMoved){
      const [ox,oy]=xy(e);
      const n=gPick(ox,oy);
      if (n){
        if (n.viewTo) setGraphView(n.viewTo);
        if (n.cmd){ await run(n.cmd); if(!gPopped()) cmd.focus(); }
      }
    }
    if (gOrbit && gDrag) recaptureOrbit(gDrag);   // carry on from where it was dropped
    gSpinIdleAt = performance.now();     // `spin resumes in` counts from the release
    gDriftT = 0;
    gDrag=null; gPanning=false; gLastXY=null; cv.style.cursor="grab";
  });
  cv.addEventListener("wheel", e=>{
    e.preventDefault();
    gWake();
    const f=e.deltaY<0?1.12:0.89;
    gScale=Math.min(6,Math.max(0.02,gScale*f));
    noteUserZoom();                           // stop auto-fitting over their choice
  }, {passive:false});
  cv.addEventListener("touchstart", e=>{
    gWake();
    const t=e.touches[0], r=cv.getBoundingClientRect();
    const ox=t.clientX-r.left, oy=t.clientY-r.top;
    const n=gPick(ox,oy);
    gMoved=false; gLastXY=[ox,oy];
    if (n) gDrag=n; else gPanning=true;
  },{passive:true});
  cv.addEventListener("touchmove", e=>{
    const t=e.touches[0], r=cv.getBoundingClientRect();
    const ox=t.clientX-r.left, oy=t.clientY-r.top;
    if (!gLastXY) return;
    const dx=ox-gLastXY[0], dy=oy-gLastXY[1];
    if (Math.abs(dx)+Math.abs(dy)>5) gMoved=true;
    if (gDrag){ gDrag.x+=dx/gScale; gDrag.y+=dy/gScale; gAlpha=Math.max(gAlpha,0.3); }
    else if (g3d){ gAutoRot=false; gHoming=false; gSpinNote(dx,dy); gYaw+=dx*0.006; gPitch=Math.max(-1.4,Math.min(1.4,gPitch+dy*0.006)); }
    else { gOX+=dx; gOY+=dy; }
    gLastXY=[ox,oy];
    e.preventDefault();
  },{passive:false});
  cv.addEventListener("touchend", async e=>{
    if (gLastXY && !gMoved){
      const n=gPick(gLastXY[0],gLastXY[1]);
      if (n){
        if (n.viewTo) setGraphView(n.viewTo);
        if (n.cmd){ await run(n.cmd); }
      }
    }
    if (gOrbit && gDrag) recaptureOrbit(gDrag);
    gSpinIdleAt = performance.now();
    gDriftT = 0;
    gDrag=null; gPanning=false; gLastXY=null;
  });
}
bindGraphPointer(gc, window);

const POPCSS = "html,body{margin:0;height:100%;background:#0c0c0c;overflow:hidden}"
  + "canvas{display:block;width:100vw;height:100vh;cursor:grab}"
  + "#l{position:fixed;top:6px;left:10px;color:#767676;letter-spacing:.1em;pointer-events:none}"
  + "#h{position:fixed;bottom:6px;right:10px;color:#767676;pointer-events:none}"
  + "#l,#h{font:11px Cascadia Mono,Consolas,monospace;user-select:none}#l b{color:#e8e8e8}";
function popGraph(){
  if (gPopped()){
    gWin.focus();
    print("graph window is already open — drag it to the other monitor, then F11 for full screen.","d");
    return;
  }
  const w=window.open("", "invos-graph", "width=1100,height=800");
  if (!w){ print("the browser blocked the popup — allow popups for this page, then: graph pop","a"); return; }
  gResetPointer();
  gWin=w;
  w.document.write('<!doctype html><meta charset="utf-8"><title>INV.OS \u2014 graph</title>'
    + '<style>'+POPCSS+'</style><canvas id="c"></canvas><div id="l"></div>'
    + '<div id="h">F11 for full screen</div>');
  w.document.close();
  gPopCanvas=w.document.getElementById("c");
  bindGraphPointer(gPopCanvas, w);
  w.addEventListener("keydown", ev=>{
    if (ev.key==="Escape"){ dockGraph(); return; }
    try{ window.focus(); }catch(e){}
  });
  gPollTimer=setInterval(()=>{ if (!gWin || gWin.closed) dockGraph(); }, 700);
  graphMode="pop";
  document.body.classList.remove("g-split","g-full");   // terminal gets the whole first screen
  buildGraphData(); updateGLabel();
  gRAF=w.requestAnimationFrame(gTick);
  print("graph opened in its own window — drag it to your second monitor and press F11. terminal is full-screen here. 'graph dock' brings it back.","g");
}
function gResetPointer(){
  gDrag=null; gPanning=false; gLastXY=null; gHover=null; gMoved=false;
  gc.style.cursor="grab";
}
function dockGraph(to){
  if (gPollTimer){ clearInterval(gPollTimer); gPollTimer=null; }
  const had=!!gWin;
  if (gWin && !gWin.closed){ try{ gWin.close(); }catch(e){} }
  gWin=null; gPopCanvas=null;
  gRAF=null;                 // the popup's pending frame died with it — always restart here
  gResetPointer();
  if (!had){ if(to) setGraph(to); return; }
  const m = to || (graphMode==="pop" ? "split" : (graphMode==="off" ? "split" : graphMode));
  setGraph(m);               // gRAF is null, so this always starts a fresh loop
  if (m!=="off") print("graph docked back into this window.","d");
}

/* ---------- QR encoder (V1-M mask0, verified against zbar) ---------- */
/* Minimal QR: Version 1, EC M, mask 0, byte mode, payload <= 14 bytes. */
function qrMatrix(text){
  const bytes=[...text].map(c=>c.charCodeAt(0)&0xff);
  if (bytes.length>14) return null;
  const EXP=new Array(512), LOG=new Array(256);
  for (let i=0,x=1;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11d; }
  for (let i=255;i<512;i++) EXP[i]=EXP[i-255];
  /* data bits -> 16 codewords */
  const bits=[];
  const push=(v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>i)&1); };
  push(4,4); push(bytes.length,8); bytes.forEach(b=>push(b,8));
  push(0, Math.min(4, 128-bits.length));
  while (bits.length%8) bits.push(0);
  const data=[];
  for (let i=0;i<bits.length;i+=8) data.push(bits.slice(i,i+8).reduce((a,b)=>(a<<1)|b,0));
  const PAD=[0xEC,0x11]; let pi=0;
  while (data.length<16) data.push(PAD[pi++%2]);
  /* generator poly, degree 10, descending coefficients */
  let gen=[1];
  for (let i=0;i<10;i++){
    const ng=new Array(gen.length+1).fill(0);
    for (let j=0;j<gen.length;j++){
      ng[j]   ^= gen[j];                                   // * x
      ng[j+1] ^= EXP[(LOG[gen[j]]+i)%255];                 // * α^i
    }
    gen=ng;
  }
  /* RS division -> 10 ecc */
  const msg=data.concat(new Array(10).fill(0));
  for (let i=0;i<16;i++){
    const c=msg[i]; if(!c) continue;
    const l=LOG[c];
    for (let j=0;j<gen.length;j++) msg[i+j]^=EXP[(l+LOG[gen[j]])%255];
  }
  const all=data.concat(msg.slice(16));
  /* 21x21 */
  const N=21, M=[...Array(N)].map(()=>Array(N).fill(null));
  const finder=(r,c)=>{ for(let i=-1;i<8;i++) for(let j=-1;j<8;j++){
    const rr=r+i, cc=c+j; if(rr<0||rr>=N||cc<0||cc>=N) continue;
    const on = i>=0&&i<7&&j>=0&&j<7 && (i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));
    M[rr][cc]=on?1:0; } };
  finder(0,0); finder(0,N-7); finder(N-7,0);
  for (let i=8;i<N-8;i++){ M[6][i]=i%2?0:1; M[i][6]=i%2?0:1; }
  /* format info: (M, mask0) = 0x5412, MSB-first, verified against zbar */
  const F=0x5412, f=[...Array(15)].map((_,i)=>(F>>(14-i))&1);
  for (let i=0;i<6;i++) M[8][i]=f[i];
  M[8][7]=f[6]; M[8][8]=f[7]; M[7][8]=f[8];
  for (let i=9;i<15;i++) M[14-i][8]=f[i];
  for (let i=0;i<7;i++) M[N-1-i][8]=f[i];
  for (let i=7;i<15;i++) M[8][N-15+i]=f[i];
  M[N-8][8]=1;                                             /* dark module */
  /* zigzag placement, mask 0 */
  const allBits=[]; all.forEach(b=>{ for(let i=7;i>=0;i--) allBits.push((b>>i)&1); });
  let bi=0, up=true;
  for (let col=N-1; col>0; col-=2){
    if (col===6) col--;
    for (let k=0;k<N;k++){
      const row = up ? N-1-k : k;
      for (const c2 of [col,col-1]){
        if (M[row][c2]!==null) continue;
        let v=allBits[bi++]||0;
        if ((row+c2)%2===0) v^=1;
        M[row][c2]=v;
      }
    }
    up=!up;
  }
  return M;
}


function qrSVG(text){
  const m=qrMatrix(text);
  if (!m) return "";
  const N=21, Q=2, S=N+2*Q;
  let rects="";
  for (let r=0;r<N;r++) for (let c=0;c<N;c++)
    if (m[r][c]) rects+=`<rect x="${c+Q}" y="${r+Q}" width="1" height="1"/>`;
  return `<svg viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${S}" height="${S}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

/* ---------- printable bin labels ---------- */
async function labelSheet(bins){
  // Fetch every bin's contents first: the label rendering below is synchronous, and
  // awaiting inside a .map() callback does not do what it looks like it does.
  const contents = new Map();
  await Promise.all(bins.map(async b => {
    try { contents.set(b, (await DB.peek({bin:b, limit:200})).rows); }
    catch(e){ contents.set(b, []); }
  }));
  const lbls = bins.map(b=>{
    const items = contents.get(b) || [];
    const d=clsNum(b), t=secOf(b);
    const sec=secLabel(d,t);
    return `<div class="lbl">${qrSVG("INV:"+binStr(b))}<div>
      <div class="binno">${binStr(b)}</div>
      <div class="sec">${esc((sec||clsLabel(d)).slice(0,24))}</div>
      <div class="contents">${esc(items.map(c=>c.name).join(" · ").slice(0,70))}</div>
    </div></div>`;
  }).join("");
  $("printsheet").innerHTML =
    `<h1>BIN LABELS</h1><p>${bins.length} label${bins.length===1?"":"s"} · 62×29 mm · ${new Date().toLocaleDateString()}</p>
     <div class="lblgrid">${lbls}</div>
     <p class="foot">scan the QR with 'scan' to jump to a bin · INV.OS</p>`;
  window.print();
}

/* ---------- camera scan (BarcodeDetector) ---------- */
let scanStream=null, scanTimer=null;
function stopScan(){
  document.body.classList.remove("scanning");
  if (scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  if (scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}
async function startScan(){
  if (!("BarcodeDetector" in window)){
    print("camera scanning needs the BarcodeDetector API (Chrome / Edge / Android). type the bin number off the label instead.","a");
    return;
  }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  }catch(e){
    print("camera unavailable: "+e.message+"  (note: camera requires https or localhost)","a");
    return;
  }
  const v=$("scanvid"); v.srcObject=scanStream;
  try{ await v.play(); }catch(e){}
  document.body.classList.add("scanning");
  const det=new BarcodeDetector({formats:["qr_code"]});
  scanTimer=setInterval(async ()=>{
    try{
      const codes=await det.detect(v);
      for (const c of codes){
        const m=c.rawValue.match(/^INV:(\d{3,4})$/);
        if (m){ stopScan(); await run(String(parseInt(m[1],10))); cmd.focus(); return; }
      }
    }catch(e){}
  },350);
  print("scanning — point the camera at a bin label. esc cancels.","d");
}

/* No service worker in this build.
   The app is served over loopback by the process that owns the database, so a cache
   buys nothing — if that process is not running there is no app to cache for. What it
   DID buy was stale UI: the cache name only changed when someone remembered to change
   it, so every fix after the last bump was invisible to anyone who had already opened
   the app once.

   Anyone who ran an earlier build still has one registered, so instead of registering,
   this tears down whatever is there. sw.js is now a worker whose only job is to delete
   its caches and unregister itself. */
if ("serviceWorker" in navigator){
  addEventListener("load", async ()=>{
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      if (regs.length){
        // let the retiring worker run once so it can clear its own caches
        await navigator.serviceWorker.register("sw.js").catch(()=>{});
      }
      for (const key of (await caches.keys().catch(()=>[]))) await caches.delete(key);
    } catch(e){ /* a browser that refuses this is no worse off */ }
  });
}

/* handle persistence (IndexedDB — file handles can't live in localStorage) */
function idb(mode,fn){
  return new Promise(res=>{
    const rq=indexedDB.open("invos-fs",1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore("h");
    rq.onsuccess=()=>{ const db=rq.result;
      const t=db.transaction("h",mode).objectStore("h"); const r=fn(t);
      if(r) r.onsuccess=()=>res(r.result); else t.transaction.oncomplete=()=>res(); };
    rq.onerror=()=>res(null);
  });
}
async function restoreBackupHandle(){
  if (!window.showSaveFilePicker) return;
  const h=await idb("readonly", st=>st.get("file"));
  if (!h) return;
  if (await h.queryPermission({mode:"readwrite"})==="granted") backupHandle=h;
  else print("backup file needs permission again — type: backup","a");
}
/* ── PHYSICAL SQLITE MIRROR ──────────────────────────────────────
   Browser storage stays PRIMARY (fast). We also mirror to a real
   invos.db SQLite file the user physically owns and can open in any
   DB tool. sql.js (SQLite-in-WASM) is loaded lazily. On Chromium the
   File System Access API auto-writes the chosen file; elsewhere the
   app offers a one-tap .db download. The app never blocks on this. */
let _SQL=null, dbHandle=null, dbDirty=0, dbLastSync=0;
async function loadSQL(){
  if (_SQL) return _SQL;
  if (window.initSqlJs){ _SQL=await window.initSqlJs({locateFile:f=>f}); return _SQL; }
  for (const src of ["sql-wasm.js","./sql-wasm.js","deploy/sql-wasm.js"]){
    try{ await new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); });
      if (window.initSqlJs){ _SQL=await window.initSqlJs({locateFile:f=>{
        const base=src.replace(/sql-wasm\.js$/,""); return base+f; }}); return _SQL; } }catch(e){}
  }
  return null;
}
/* build a real SQLite file (Uint8Array) from current state: a state blob
   (exact restore) + a queryable items table (external tools/reporting). */
async function buildDbBytes(){
  const SQL=await loadSQL(); if(!SQL) return null;
  const db=new SQL.Database();
  db.run("CREATE TABLE meta(key TEXT PRIMARY KEY, value TEXT)");
  db.run("CREATE TABLE state(id INTEGER PRIMARY KEY, blob TEXT, updated_at INTEGER)");
  db.run(`CREATE TABLE items(cid INTEGER PRIMARY KEY, id TEXT, name TEXT, dept INTEGER, section INTEGER,
    bin INTEGER, qty INTEGER, min INTEGER, value TEXT, pkg TEXT, part TEXT,
    supplier TEXT, source TEXT, link TEXT, notes TEXT, low INTEGER)`);
  db.run("CREATE TABLE sections(code TEXT PRIMARY KEY, label TEXT)");
  db.run("BEGIN");
  db.run("INSERT INTO meta VALUES ('schema',?),('app',?),('exported',?)",
    [String(SCHEMA),"INV.OS",new Date().toISOString()]);
  db.run("INSERT INTO state VALUES (1,?,?)",[JSON.stringify(state),Date.now()]);
  const ins=db.prepare(`INSERT INTO items VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`);
  state.items.forEach(c=>ins.run([c.cid, cidStr(c), c.name, clsNum(c.bin), secOf(c.bin),
    c.bin, c.qty, c.min, c.value||"", c.pkg||"", c.part||"",
    c.supplier||"", c.source||"", c.link||"", c.notes||"", c.qty<=c.min?1:0]));
  ins.free();
  const sec=db.prepare("INSERT INTO sections VALUES (?,?)");
  for (let d=0;d<10;d++){ sec.run([d+"000", clsLabel(d)]);
    Object.keys(state.sections||{}).filter(k=>+k[0]===d).forEach(k=>sec.run([k+"0", state.sections[k]])); }
  sec.free();
  db.run("COMMIT");
  const bytes=db.export(); db.close(); return bytes;
}
/* attach a physical .db file (Chromium): pick once, auto-sync after */
async function attachDb(){
  if (!window.showSaveFilePicker){
    // fallback: just download a .db now
    const bytes=await buildDbBytes(); if(!bytes){ print("couldn't load the SQLite engine.","a"); return; }
    dlBytes(bytes, "invos.db");
    print("this browser can't auto-write files — downloaded invos.db instead. (Chromium/Edge can auto-sync: 'db' there.)","a");
    return;
  }
  try{
    dbHandle=await showSaveFilePicker({suggestedName:"invos.db",
      types:[{description:"SQLite database",accept:{"application/x-sqlite3":[".db",".sqlite"]}}]});
    await idbSet("dbhandle", dbHandle);
    await syncDb(true);
    print("physical database attached — invos.db now auto-syncs. open it in any SQLite tool.","g");
  }catch(e){ print("attach cancelled.","d"); }
}
async function restoreDbHandle(){
  if (!window.showSaveFilePicker) return;
  try{ const h=await idbGet("dbhandle"); if(!h) return;
    if (await h.queryPermission({mode:"readwrite"})==="granted"){ dbHandle=h; }
  }catch(e){}
}
async function syncDb(force){
  if (!dbHandle) return false;
  if (!force && (++dbDirty<8)) return false;   // batch writes; .db build is heavier than JSON
  try{
    const bytes=await buildDbBytes(); if(!bytes) return false;
    const w=await dbHandle.createWritable(); await w.write(bytes); await w.close();
    dbDirty=0; dbLastSync=Date.now(); return true;
  }catch(e){ dbHandle=null; return false; }   // handle lost -> silently stop, app unaffected
}
function dlBytes(bytes, name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type:"application/x-sqlite3"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

async function writeBackup(){
  if (!backupHandle) return false;
  try{
    const w=await backupHandle.createWritable();
    await w.write(JSON.stringify(state,null,1)); await w.close();
    state.lastBackup=Date.now(); state.lastExport=Date.now(); backupDirty=0;
    await store.set(KEY, JSON.stringify(state));
    return true;
  }catch(e){ backupHandle=null; return false; }
}
function markExported(){ state.lastExport=Date.now(); }
function downloadBackup(){ markExported();
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:"application/json"}));
  a.download=`invos-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  state.lastBackup=Date.now(); backupDirty=0;
}

/* ---------- central runner: echo, exec, collect browsable rows ---------- */
let browseSel=-1, menuOpen=false;
/* ── unified cursor ─────────────────────────────────────────────
   One rule for the whole app: Tab / ↓ move down through the rows that
   are currently on screen (home shelves, live results, or a printed
   list), ↑ / shift-Tab move up, Enter opens. No modes, no w/s. ── */
function navRows(){
  if (liveItems.length) return [...live.querySelectorAll("[data-i]")];
  return [...out.querySelectorAll(".idx")];
}
function navSel(){ return liveItems.length ? liveSel : browseSel; }
function graphHighlightCid(cid){
  if (graphMode==="off"){ return; }
  if (cid==null){ if(gHover&&gHover.type==="part") gHover=null; return; }
  const n=gNodes.find(nd=>nd.id==="c"+cid);
  if (n){ gHover=n; gAlpha=Math.max(gAlpha,0.05); }   // nudge a redraw
}
function rowCid(el){ return el && el.dataset.cid ? +el.dataset.cid : null; }
function navPaint(i){
  const rows=navRows();
  rows.forEach((el,k)=>el.classList.toggle("sel", k===i));
  if (i>=0 && rows[i]) rows[i].scrollIntoView({block:"nearest"});
  if (liveItems.length) liveSel=i; else browseSel=i;
  // mirror the selection into the graph: highlight the matching node
  graphHighlightCid(i>=0 ? (rowCid(rows[i]) ?? (liveItems[i]&&liveItems[i].cid)) : null);
}
function navMove(d){
  const rows=navRows(); if (!rows.length) return false;
  let i=navSel()+d;
  if (i< -1) i=-1;
  if (i>=rows.length) i=rows.length-1;
  navPaint(i);
  return i>=0;
}
async function navOpen(mod){
  const rows=navRows(), i=navSel();
  if (i<0 || !rows[i]) return false;
  const el=rows[i];
  if (el.dataset.menu){
    browseSel=-1; menuOpen=false;
    const m=el.dataset.menu;
    if (m.startsWith("run:")){
      const c=m.slice(4);
      out.innerHTML=""; live.innerHTML=""; cmd.value=""; drawMirror();
      if (c) await run(c); else home();
    } else {
      const pre=m.slice(5);
      out.innerHTML=""; live.innerHTML=""; home();
      cmd.value=pre; drawMirror(); renderLive();
    }
    return true;
  }
  // live result or part row -> cid; home/section row -> its command
  const cid = el.dataset.cid ? +el.dataset.cid
            : (liveItems.length && liveItems[i]) ? liveItems[i].cid : null;
  if (cid!=null){
    const it=state.items.find(c=>c.cid===cid);
    if (it){
      const c = mod==="take" ? `take ${cidStr(it)} 1`
              : mod==="stock" ? `stock ${cidStr(it)} 1`
              : `info ${cidStr(it)}`;
      liveSel=-1; liveItems=[]; live.innerHTML=""; browseSel=-1;
      cmd.value=""; drawMirror();
      await run(c); return true;
    }
  }
  if (el.dataset.cmd){
    liveSel=-1; browseSel=-1; cmd.value=""; drawMirror();
    if (liveItems.length){ liveItems=[]; live.innerHTML=""; }
    await run(el.dataset.cmd); return true;
  }
  return false;
}
async function run(line){
  echo(line);
  atHome=false;                 // output now on screen; Esc should clear it before touching the graph
  await exec(line);
  browseSel = -1;   // navRows() reads the DOM live, nothing else to track
  tutorialSaw(line);            // the tour watches what actually got typed
}

/* ── the guided tour ───────────────────────────────────────────────────────
   A blinking cursor is the best interface this app has and the worst first
   impression it makes. Someone who opens it, sees a prompt and closes it never finds
   out that it is fast.

   So the tour makes them DO six things rather than reading about them. It watches the
   command line — it does not drive it — because a tour that types for you teaches
   nothing and a tour you cannot deviate from is a cage. Wander off, run other commands,
   come back: the step is still there. `skip` leaves, `tutorial` re-enters, and it never
   starts itself twice. */
const TUTORIAL = [
  { do:"find resistor",
    why:"Search is the whole app. You never need the word 'find' — just type.",
    ok:l => !/^\s*$/.test(l) && !/^(tutorial|skip|help|keys)\b/i.test(l),
    done:"That is search. Any fragment, anywhere — a value, a package, a note, a bin." },
  { do:"add 10k resistor x50",
    why:"Adding picks the shelf and a free bin for you. x50 is the quantity.",
    ok:l => /^\s*add\b/i.test(l),
    done:"Filed, and given a C-ID that is never reused — labels stay true forever." },
  { do:"take C-0001 5",
    why:"Taking stock off the shelf is the thing you will do fifty times a day.",
    ok:l => /^\s*(take|stock)\b/i.test(l),
    done:"Every change is logged, with who did it if you have run `who`." },
  { do:"map",
    why:"The shelf tree — where everything physically lives.",
    ok:l => /^\s*(map|bins|l|list|low)\b/i.test(l),
    done:"Bin 1403 IS its own address: department 1, shelf 4, drawer 03." },
  { do:"graph",
    why:"The node view. Not decoration — it is how you see what connects to what.",
    ok:l => /^\s*graph\b/i.test(l),
    done:"Drag to rotate, scroll to zoom, click a node to drill in. `graph galaxy` for projects." },
  { do:"undo",
    why:"The last thing you did, reversed. Even a 400-row import undoes in one step.",
    ok:l => /^\s*(undo|u)\b/i.test(l),
    done:"That is the safety net. Nothing you do here is unrecoverable." },
];
let tut = null;

function tutorialStart(resume){
  tut = { i: 0 };
  print("");
  print("A QUICK TOUR — six things, about a minute.","w");
  print("  Type what it asks. Wander off whenever you like; it waits.","d");
  print("  `skip` leaves the tour · `tutorial` restarts it.","d");
  tutorialAsk();
}

function tutorialAsk(){
  if (!tut) return;
  const step = TUTORIAL[tut.i];
  print("");
  print(`  ${tut.i+1}/${TUTORIAL.length}  ${step.why}`,"d");
  print(`  try:  ${step.do}`,"c");
}

function tutorialSaw(line){
  if (!tut) return;
  const l = String(line||"").trim();
  if (/^(skip|exit|quit)$/i.test(l)){
    tut = null;
    print("");
    print("tour skipped — `tutorial` brings it back.","d");
    return;
  }
  if (/^tutorial\b/i.test(l)) return;      // the command that (re)started it
  const step = TUTORIAL[tut.i];
  if (!step || !step.ok(l)) return;        // not this step yet; no nagging

  print("");
  print("  ✓ " + step.done,"g");
  tut.i++;
  if (tut.i >= TUTORIAL.length){
    tut = null;
    state.tutorialDone = true; save();
    print("");
    print("That is the tour. You now know more of this app than most people learn in a week.","w");
    print("  `/` or F1 lists every command · `keys` for shortcuts · `who <name>` records who does what.","d");
    return;
  }
  tutorialAsk();
}

const GHOSTS = {

  take:   "take resistor 5",
  stock:  "stock resistor 20",
  move:   "move resistor 1102",
  edit:   "edit resistor",

const IDLE_GHOST = "type to search, or / for commands";
function drawMirror(){
  idle.style.display = cmd.value ? "none" : "";
  const g=document.getElementById("ghost"); if(!g) return;
  if (mode.type!=="normal"){ g.textContent=""; return; }
  const v=cmd.value;
  if (!v){                                   // empty prompt: faint invitation past the cursor
    g.style.left="1ch";
    g.textContent = " "+IDLE_GHOST;
    return;
  }
  if (v.startsWith("/")){ g.textContent=""; return; }
  // find a template that STARTS WITH what's typed so far (case-insensitive)
  const first=v.split(/\s+/)[0].toLowerCase();
  const tmpl=GHOSTS[first];
  if (tmpl && tmpl.toLowerCase().startsWith(v.toLowerCase()) && tmpl.length>v.length){
    // ghost shows only the remainder, offset by the typed length
    g.style.left = v.length+"ch";
    g.textContent = tmpl.slice(v.length);
  } else {
    g.textContent="";
  }
}
cmd.addEventListener("input",()=>{
  liveSel=-1; browseSel=-1; tabState={base:null,cands:[],idx:0};
  const v=cmd.value;
  if (v.startsWith("/")){ menu(v.slice(1)); return; }
  if (menuOpen){ menuOpen=false; home(); }
});
["input","keyup","click","focus"].forEach(ev=>cmd.addEventListener(ev,()=>{ drawMirror(); renderLive(); }));

cmd.addEventListener("keydown", async e=>{
  if (e.ctrlKey && e.key.toLowerCase()==="u"){           // ctrl+u: clear the line
    e.preventDefault(); cmd.value=""; liveSel=-1; drawMirror(); renderLive(); return;
  }
  if (e.ctrlKey && e.key.toLowerCase()==="l"){           // ctrl+l: clear the screen
    e.preventDefault(); if (mode.type==="normal"){ cmd.value=""; liveSel=-1; drawMirror(); home(); } return;
  }
  if (e.ctrlKey && e.key.toLowerCase()==="a"){ e.preventDefault(); cmd.setSelectionRange(0,0); return; }
  if (e.ctrlKey && e.key.toLowerCase()==="e"){ e.preventDefault(); const L=cmd.value.length; cmd.setSelectionRange(L,L); return; }
  if (e.ctrlKey && e.key.toLowerCase()==="w"){           // ctrl+w: delete word back
    e.preventDefault();
    const c=cmd.selectionStart??cmd.value.length;
    const left=cmd.value.slice(0,c).replace(/\S+\s*$/,"");
    cmd.value=left+cmd.value.slice(c);
    cmd.setSelectionRange(left.length,left.length);
    liveSel=-1; drawMirror(); renderLive(); return;
  }
  if (e.ctrlKey && e.key.toLowerCase()==="k"){           // ctrl+k: kill to end
    e.preventDefault();
    const c=cmd.selectionStart??cmd.value.length;
    cmd.value=cmd.value.slice(0,c);
    liveSel=-1; drawMirror(); renderLive(); return;
  }
  if (e.key==="PageUp" || e.key==="PageDown"){           // scrollback paging
    e.preventDefault();
    term.scrollBy({top:(e.key==="PageUp"?-0.9:0.9)*term.clientHeight});
    return;
  }
  if (e.key==="F1"){ e.preventDefault(); cmd.value=""; drawMirror(); menu(""); return; }
  if (e.key==="F2" && mode.type==="normal"){ e.preventDefault(); await run("doctor"); return; }
  if (e.key==="F3" && mode.type==="normal"){ e.preventDefault(); await run("graph 3d"); return; }
  if (e.key==="F4" && mode.type==="normal"){ e.preventDefault(); await run("bar"); return; }
  {
    const graphKey = (k) => (e.key===k || e.key===k.toUpperCase())
      && mode.type==="normal" && graphMode!=="off" && navSel()<0
      // alt from the prompt, or bare when the graph pane itself has focus. Without
      // this the letter never reaches the input and "graph"/"help" cannot be typed.
      && (e.altKey || document.activeElement !== cmd);
    if (graphKey("h")){ e.preventDefault(); graphHome(); return; }
    if (graphKey("g")){ e.preventDefault(); cycleView(); return; }
  }
  if ((e.key==="ArrowLeft"||e.key==="ArrowRight") && mode.type==="normal" && !cmd.value){
    const rows=navRows(), i=navSel();
    if (i>=0 && rows[i] && rows[i].dataset.cfg){
      e.preventDefault();
      await run("cfgadj "+rows[i].dataset.cfg+" "+(e.key==="ArrowRight"?"up":"down"));
      return;
    }
  }
  if (e.key==="Tab" && mode.type==="normal" && !cmd.value){
    e.preventDefault();
    navMove(e.shiftKey ? -1 : 1);            // Tab = next row, Shift+Tab = previous
    return;
  }
  if (e.key==="Tab"){                                    // tab completion (mid-type)
    e.preventDefault();
    if (mode.type!=="normal") return;
    const val=cmd.value;
    const m=val.match(/^(.*?)(\S*)$/), before=m[1], tok=m[2];
    if (!val.trim()) return;
    const key=before+tok;
    if (tabState.base!==key || !tabState.cands.length){
      let cands;
      if (!before.trim()){
        const MAIN=["add","take","stock","move","edit","del","info","find","list","bins","low","stats",
                    "count","photo","recent","undo","tidy","doctor","merge","map","remap","proj","project","build","graph",
                    "labels","scan","template","health","rollback","theme","settings","bar","keys","menu",
                    "install","backup","create","class","classes","export","import","help","clear","home","reset"];
        cands=MAIN.filter(v=>v.startsWith(tok.toLowerCase()));
      } else {
        const nt=norm(tok);
        cands=state.items.map(c=>c.name).filter(n=>norm(n).startsWith(nt));
        if (!cands.length && nt) cands=state.items.map(c=>c.name).filter(n=>norm(n).includes(nt));
      }
      if (!cands.length) return;
      tabState={base:key, cands, idx:0};
    } else {
      tabState.idx=(tabState.idx+1)%tabState.cands.length;
    }
    cmd.value=before+tabState.cands[tabState.idx]+(before.trim()?"":" ");
    const L=cmd.value.length; cmd.setSelectionRange(L,L);
    liveSel=-1; drawMirror(); renderLive();
    return;
  }
  /* p: toss the selected part into the active project */
  if (e.key==="p" && mode.type==="normal" && !cmd.value && navSel()>=0){
    e.preventDefault();
    const rows=navRows(), el=rows[navSel()];
    const cid = el.dataset.cid ? +el.dataset.cid : (liveItems[navSel()]?.cid);
    const it = cid!=null ? state.items.find(c=>c.cid===cid) : null;
    if (!it) return;
    await loadProjects();
    const ap=state.projects.find(x=>x.pid===state.activePid);
    if (!ap){ print("no active project — proj new <name>, or proj use <name>","a"); return; }
    const line=ap.bom.find(l=>l.cid===it.cid);
    const want=(line?line.need:0)+1;
    try { await DB.setBom(ap.pid, it.cid, want); }
    catch(e){ print("could not add it to the build: "+e.message,"a"); return; }
    await loadProjects(); graphSync();
    print(`+1x ${it.name} -> ${ap.name} (need ${want})`,"g");
    return;
  }

  /* unified cursor: ↓ / ↑ walk the rows on screen; Esc clears it */
  if (mode.type==="normal" && !cmd.value){
    if (e.key==="ArrowDown"){
      if (navRows().length){ e.preventDefault(); navMove(1); return; }
    } else if (e.key==="ArrowUp"){
      if (navSel()>=0){ e.preventDefault(); navMove(-1); return; }
    } else if (e.key==="Escape" && navSel()>=0){
      e.preventDefault(); navPaint(-1); return;
    }
  }

  if (e.key==="Enter"){
    e.preventDefault();
    if (mode.type==="normal" && navSel()>=0){
      const mod = e.ctrlKey ? "take" : e.shiftKey ? "stock" : "info";
      if (await navOpen(mod)) return;
    }
    const line=cmd.value; cmd.value=""; drawMirror(); live.innerHTML=""; liveSel=-1; liveItems=[]; browseSel=-1;

    if (mode.type==="wizard"){ print(ps1.textContent+line,"d"); await wizardInput(line); drawMirror(); return; }
    if (mode.type==="count"){ print(ps1.textContent+line,"d"); await countInput(line); drawMirror(); return; }
    if (mode.type==="setup"){ print(ps1.textContent+line,"d"); await setupInput(line); drawMirror(); return; }
    if (mode.type==="secedit"){ print(ps1.textContent+line,"d"); await secEditInput(line); drawMirror(); return; }
    if (mode.type==="secadd"){ print(ps1.textContent+line,"d"); await secAddInput(line); drawMirror(); return; }

    if (mode.type==="pickclass"){
      print(ps1.textContent+line,"d");
      const t=line.trim();
      if (t.toLowerCase()==="cancel"){ endMode("cancelled.","a"); return; }
      if (!/^\d$/.test(t)){ print("  enter a digit 0-9 (or 'cancel')","a"); return; }
      mode.draft.bin=await nextFreeBin(+t);
      const d=mode.draft; endMode();
      await commitAdd(d); return;
    }

    if (mode.type==="confirm"){
      print(ps1.textContent+line,"d");
      if (mode.demoClear){
        if (line.trim().toLowerCase().startsWith("y")){
          state.items=[]; state.nextCid=1; state.seededDemo=false; state.seeded=true;
          await save(); print("demo data cleared — starting real.","g"); home();
        } else print("kept the demo data.","g");
        endMode(); drawMirror(); return;
      }
      if (mode.demoLoad){
        endMode();
        if (line.trim().toLowerCase().startsWith("y")){
          await loadDemoData(); await save(); home();
          if (graphMode==="off") setGraph("split");
          g3d=true; setGraphView({kind:"galaxy"});
          print("demo loaded — galaxy open. 'demo clear' to wipe.","g");
        } else print("kept your data.","g");
        drawMirror(); return;
      }
      if (line.trim().toLowerCase().startsWith("y")){
        await DB.remove(mode.c.cid);
        setView(state.items.filter(x=>x!==mode.c));
        await refreshSummary(); deptCache=null;
        if (hasPhoto(mode.c.cid)) delPhoto(mode.c.cid);
        print(`deleted ${mode.c.name}.`,"a");
      } else print("kept it.","g");
      endMode(); drawMirror(); return;
    }

    if (mode.type==="confirmbin"){
      print(ps1.textContent+line,"d");
      if (line.trim().toLowerCase().startsWith("y")){
        snapshotUndo(`emptied BIN ${binStr(mode.bin)} (${mode.items.length} entries)`);
        const gone=mode.items;
        gone.forEach(g=>{ if(hasPhoto(g.cid)) delPhoto(g.cid); });
        state.items=state.items.filter(c=>!gone.includes(c));
        await save();
        print(`BIN ${binStr(mode.bin)} emptied — ${gone.length} entries removed. (undo restores)`,"a");
      } else print("kept them.","g");
      endMode(); drawMirror(); return;
    }

    if (mode.type==="importpaste"){
      const t=line.trim();
      if (t.toLowerCase()==="cancel"){ endMode("import cancelled.","a"); return; }
      if (t.toLowerCase()==="end"){
        const buf=mode.buf.join("\n"); endMode();
        if (buf.trim()) startImportWizard(textToRows(buf), "pasted data");
        else print("nothing to import.","a");
        return;
      }
      mode.buf.push(line); print("  + "+line.slice(0,60),"d"); return;
    }
    if (mode.type==="importmap"){
      print(ps1.textContent+line,"d"); await importMapInput(line); drawMirror(); return;
    }

    if (line.trim().startsWith("/")){ cmd.value=""; drawMirror(); menu(line.trim().slice(1)); return; }
    if (line.trim()){ history.push(line); hIdx=history.length; }
    await run(line);
    drawMirror();
    return;
  }
  if (e.key==="ArrowDown" && mode.type==="normal"){
    e.preventDefault();
    if (cmd.value || navRows().length){ navMove(1); return; }  // rows present -> navigate
    if (hIdx>=history.length) return;                          // else: history
    hIdx++;
    cmd.value = hIdx===history.length ? stash : history[hIdx];
    cmd.setSelectionRange(cmd.value.length,cmd.value.length); drawMirror(); renderLive();
  }
  else if (e.key==="ArrowUp" && mode.type==="normal"){
    e.preventDefault();
    if (navSel()>=0){ navMove(-1); return; }                  // in the list -> move up
    if (cmd.value){                                            // recall history while typing
      if(!history.length) return;
      if (hIdx===history.length) stash=cmd.value;
      hIdx=Math.max(0,hIdx-1); cmd.value=history[hIdx];
      cmd.setSelectionRange(cmd.value.length,cmd.value.length); drawMirror(); renderLive(); return;
    }
    if(!history.length) return;                               // empty prompt -> history
    if (hIdx===history.length) stash=cmd.value;
    hIdx=Math.max(0,hIdx-1); cmd.value=history[hIdx];
    cmd.setSelectionRange(cmd.value.length,cmd.value.length); drawMirror(); renderLive();
  }
  else if (e.key==="Escape"){
    e.preventDefault();
    // Esc peels back one layer at a time; the graph pane is the LAST thing to close.
    if (scanStream){ stopScan(); print("scan cancelled.","d"); drawMirror(); return; }
    if (mode.type!=="normal"){ print("cancelled.","a"); endMode(); }        // a prompt/wizard
    else if (cmd.value){ cmd.value=""; }                                     // typed text
    else if (navSel()>=0){ navPaint(-1); }                                   // a row cursor
    else if (graphMode==="full"){ setGraph("split"); }                       // full -> split (keep graph)
    else if (!isHome()){ home(); }                                           // clear terminal to home, KEEP the split graph
    else if (graphMode!=="off" && gView.kind==="proj"){ setGraphView({kind:"projects"}); } // then step the graph view out
    else if (graphMode==="split"){ setGraph("off"); }                        // finally close the graph
    drawMirror(); live.innerHTML="";
  }
});

cmd.addEventListener("paste", e=>{
