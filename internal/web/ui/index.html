<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover so the layout can reach under a phone's notch; the safe-area
     insets below keep the terminal out from under it. user-scalable is NOT disabled:
     pinch-zoom is how someone reads a bin number in bad light, and taking it away is an
     accessibility failure, not a kiosk feature. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INV.OS — workshop inventory terminal</title>
<meta name="description" content="A keyboard-first inventory terminal for a workshop. Every part, every bin, every project — on one machine, in one file, with no account and no internet.">
<meta name="application-name" content="INV.OS">
<meta name="author" content="INV.OS">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0c0c">
<!-- This is a shop's private inventory. If it is ever reachable from outside, it should
     still never be indexed or archived. -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<!-- Phone browsers otherwise turn bin numbers like 1403 into tappable phone numbers. -->
<meta name="format-detection" content="telephone=no, date=no, address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INV.OS">
<meta property="og:type" content="website">
<meta property="og:site_name" content="INV.OS">
<meta property="og:title" content="INV.OS — workshop inventory terminal">
<meta property="og:description" content="Every part, every bin, every project. One file, no account, no internet.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="INV.OS — workshop inventory terminal">
<meta name="twitter:description" content="Every part, every bin, every project. One file, no account, no internet.">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    /* Windows Terminal cmd defaults: Campbell palette */
    --bg:#0c0c0c; --green:#cccccc; --dimgreen:#767676; --amber:#f9f1a5; --white:#ffffff;
    --cyan:#61d6d6;
    --mono:"Cascadia Mono","Consolas","JetBrains Mono","SF Mono","Menlo","DejaVu Sans Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--green);
    font-family:var(--mono); font-size:14px; line-height:1.5;
    overflow:hidden; display:flex; flex-direction:column;
  }
  @media (prefers-reduced-motion: reduce){
    .blink{animation:none !important; opacity:1 !important}
  }
  #main{flex:1; display:flex; min-height:0; position:relative}
  #graphpane{
    display:none; position:relative; background:#0c0c0c;
    border-left:1px solid #2a2a2a; overflow:hidden;
  }
  body.g-split #graphpane{display:block; width:46%; flex-shrink:0}
  body.g-full #graphpane{display:block; position:absolute; inset:0; width:auto; z-index:20; border-left:none}
  #gcanvas{display:block; width:100%; height:100%; cursor:grab}
  #gcanvas.grabbing{cursor:grabbing}
  #ghint{ font-size:11px; color:var(--dimgreen); pointer-events:none; user-select:none; }
  /* buttons: top-right, tucked just inside the frame's top strip */
  #gbtns{ position:absolute; top:18px; right:18px; display:flex; gap:6px; z-index:6; }
  body:not(.hud-on) #gbtns{ top:6px; right:10px; }
  #gbtns span{
    font-size:11px; color:var(--cyan); border:1px solid rgba(97,214,214,.35);
    border-radius:3px; padding:1px 7px; cursor:pointer; user-select:none; background:rgba(12,12,12,.55);
  }
  #gbtns span:hover{ background:rgba(97,214,214,.14); }
  /* HUD off: hide the frame chrome, keep only the bottom hint */
  body:not(.hud-on) #hud .hc,
  body:not(.hud-on) #hud-top,
  body:not(.hud-on) #hud-live{ display:none; }
  body:not(.hud-on) #hud-bot{ position:absolute; bottom:6px; left:10px; right:96px; }
  /* ── HUD frame overlay ── */
  #hud{ position:absolute; inset:0; pointer-events:none;
        font:11px var(--mono); letter-spacing:.08em; color:var(--dimgreen); z-index:5; }
  body.hud-on #hud{ display:block; }
  #hud .hc{ position:absolute; width:20px; height:20px; }
  #hud .hc::before,#hud .hc::after{ content:""; position:absolute; background:var(--cyan);
    box-shadow:0 0 6px var(--cyan); }
  #hud .hc::before{ width:20px; height:2px; } #hud .hc::after{ width:2px; height:20px; }
  #hud .hc-tl{ top:8px; left:8px; } #hud .hc-tr{ top:8px; right:8px; }
  #hud .hc-tr::before{ right:0; } #hud .hc-tr::after{ right:0; }
  #hud .hc-bl{ bottom:8px; left:8px; } #hud .hc-bl::before{ bottom:0; } #hud .hc-bl::after{ bottom:0; }
  #hud .hc-br{ bottom:8px; right:8px; } #hud .hc-br::before{ bottom:0; right:0; } #hud .hc-br::after{ bottom:0; right:0; }
  #hud-top{ position:absolute; top:20px; left:26px; right:150px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #hud-top b{ color:var(--white); letter-spacing:.14em; }
  #hud-ctx{ color:var(--cyan); margin-left:8px; opacity:.8; }
  #hud-stat{ display:block; color:var(--dimgreen); margin-top:2px; font-size:10px; }
  #hud-bot{ position:absolute; bottom:14px; left:26px; right:26px; text-align:center; }
  #hud-live{ color:var(--cyan); position:absolute; left:0; }
  #glabel{
    position:absolute; top:6px; left:10px; font-size:11px; letter-spacing:.1em;
    color:var(--dimgreen); pointer-events:none; user-select:none;
  }
  body.hud-on #glabel{ display:none; }   /* HUD top strip replaces it */
  #glabel b{color:#e8e8e8}
  #printsheet{display:none}
  @media print{
    body>*{display:none !important}
    #printsheet{display:block !important; color:#000; background:#fff;
      font-family:Consolas,monospace; font-size:12pt; padding:0}
    #printsheet h1{font-size:16pt; letter-spacing:.1em; margin-bottom:2pt}
    #printsheet p{color:#333; margin:2pt 0 8pt}
    #printsheet table{border-collapse:collapse; width:100%}
    #printsheet th{text-align:left; border-bottom:2px solid #000; padding:3pt 8pt 3pt 0; font-size:10pt}
    #printsheet td{border-bottom:1px solid #999; padding:5pt 8pt 5pt 0}
    #printsheet td.bin{font-weight:bold; font-size:14pt}
    #printsheet td.cb{font-size:14pt; width:20pt}
    #printsheet .foot{margin-top:8pt; font-size:9pt; color:#666}
    #printsheet .lblgrid{display:flex; flex-wrap:wrap; gap:3mm}
    #printsheet .lbl{
      width:62mm; height:29mm; border:0.3pt dashed #999; box-sizing:border-box;
      display:flex; align-items:center; gap:2.5mm; padding:2mm; page-break-inside:avoid;
    }
    #printsheet .lbl svg{width:23mm; height:23mm; flex-shrink:0}
    #printsheet .lbl .binno{font-size:20pt; font-weight:bold; line-height:1}
    #printsheet .lbl .sec{font-size:8pt; letter-spacing:.06em; margin-top:1pt}
    #printsheet .lbl .contents{font-size:7pt; color:#444; margin-top:1.5pt;
      overflow:hidden; max-height:16pt}
  }
  #scanpane{display:none; position:fixed; inset:0; z-index:50; background:#000}
  body.scanning #scanpane{display:block}
  #scanvid{width:100%; height:100%; object-fit:cover}
  #scanhint{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    color:var(--amber); font-size:13px; text-shadow:0 0 4px #000;
  }
  #term{
    flex:1; min-width:0; overflow-y:auto; overflow-x:auto; padding:14px 20px 12px;
    scrollbar-width:thin; scrollbar-color:var(--dimgreen) var(--bg);
    display:flex; flex-direction:column;
  }
  #term::-webkit-scrollbar{width:6px;height:6px}
  #term::-webkit-scrollbar-thumb{background:var(--dimgreen)}
  .line{white-space:pre; min-height:1.5em}
  .g{color:var(--green)} .d{color:var(--dimgreen)}
  .a{color:var(--amber)}
  .w{color:var(--white)}
  .c{color:var(--cyan)}
  body.bar-off #bar{ display:none; }
  #bar{
    flex-shrink:0; display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 20px; border-bottom:1px solid #1e1e1e; background:#0e0e0e;
    font-size:11px; color:var(--dimgreen); user-select:none; white-space:pre;
  }
  #barl b{color:#e8e8e8; font-weight:600; letter-spacing:.16em}
  #barr{display:flex; align-items:center; gap:8px}
  /* unified widget buttons — consistent height, centered glyph+label, jarvis glow */
  .warnpill,.barbtn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    height:22px; padding:0 10px; border-radius:4px; font-size:11px; line-height:1;
    letter-spacing:.06em; cursor:pointer; user-select:none; white-space:nowrap;
    border:1px solid rgba(97,214,214,.28); color:var(--cyan);
    background:linear-gradient(rgba(97,214,214,.04),rgba(97,214,214,0));
    transition:background .12s, box-shadow .12s, border-color .12s;
  }
  #toast{ position:fixed; top:14%; left:50%; transform:translateX(-50%);
    background:rgba(12,12,12,.82); color:var(--cyan); border:1px solid rgba(97,214,214,.4);
    border-radius:5px; padding:6px 16px; font:13px var(--mono); letter-spacing:.08em;
    box-shadow:0 0 14px rgba(97,214,214,.2); pointer-events:none; z-index:60;
    opacity:0; transition:opacity .25s; }
  #toast.show{ opacity:1; }
  .warnpill:hover,.barbtn:hover{
    border-color:rgba(97,214,214,.6); background:rgba(97,214,214,.12);
    box-shadow:0 0 8px rgba(97,214,214,.25);
  }
  .warnpill{ color:var(--amber); border-color:rgba(249,241,165,.4); }
  .warnpill:hover{ border-color:rgba(249,241,165,.7); background:rgba(249,241,165,.1);
    box-shadow:0 0 8px rgba(249,241,165,.25); }
  .stepper{ color:var(--cyan); cursor:pointer; }
  .stepper:hover{ color:var(--white); }
  .sel .stepper{ color:var(--bg); }
  .idx{cursor:pointer} .idx:hover,.idx:active{background:rgba(255,255,255,.08)}

  #live{border-left:2px solid var(--dimgreen); margin:2px 0 2px 1px; padding-left:8px}
  #live:empty{display:none}
  .sel{background:var(--green) !important; color:var(--bg) !important}
  .line{padding:0 2px; border-radius:2px}
  /* ── item detail card: text left, HUD-framed photo floats right, text wraps
        under it then flows full width below (Fallout-terminal bibliography look) ── */
  .card{ padding:2px 2px 4px; white-space:normal; }
  .card .chead{ color:var(--white); font-weight:600; letter-spacing:.04em; }
  .card .cmeta{ color:var(--green); }
  .card .cmeta.low{ color:var(--amber); }
  .card .frow{ color:var(--green); line-height:1.55; }
  .card .flabel{ color:var(--dimgreen); }
  .card a{ color:var(--cyan); text-decoration:none; } .card a:hover{ text-decoration:underline; }
  .card .cactions{ color:var(--dimgreen); margin-top:4px; }
  .card .chist{ color:var(--dimgreen); }
  .photo{
    float:right; width:38%; max-width:280px; margin:2px 0 6px 14px;
    position:relative; padding:6px; background:rgba(97,214,214,.03);
  }
  .photo img{ display:block; width:100%; height:auto; image-rendering:auto;
    filter:grayscale(.15) contrast(1.03); }
  /* corner brackets so it reads as a HUD frame, not a pasted-in picture */
  .photo::before,.photo::after,.photo>.br::before,.photo>.br::after{
    content:""; position:absolute; width:12px; height:12px; border:1.5px solid var(--cyan);
    box-shadow:0 0 5px rgba(97,214,214,.4); }
  .photo::before{ top:0; left:0; border-right:none; border-bottom:none; }
  .photo::after{ top:0; right:0; border-left:none; border-bottom:none; }
  .photo>.br::before{ bottom:0; left:0; border-right:none; border-top:none; }
  .photo>.br::after{ bottom:0; right:0; border-left:none; border-top:none; }
  .photo .cap{ margin-top:4px; font-size:10px; color:var(--dimgreen); text-align:center;
    letter-spacing:.08em; }
  .photo.empty{ width:120px; height:96px; display:flex; align-items:center; justify-content:center;
    border:1px dashed var(--dimgreen); color:var(--dimgreen); font-size:10px; text-align:center; }
  .sel span{color:var(--bg) !important}

  #promptrow{display:flex; align-items:baseline; cursor:text; white-space:pre; margin-top:6px}
  #ps1{color:var(--cyan); flex-shrink:0; font-weight:600}
  #inwrap{position:relative; flex:1; display:flex; min-height:1.5em}
  #idle{position:absolute; left:0; top:0; pointer-events:none;
        background:var(--green); color:var(--bg)}
  #ghost{position:absolute; left:0; top:0; pointer-events:none; white-space:pre;
         color:var(--dimgreen); opacity:.55}
  .blink{animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #cmd{
    flex:1; width:100%; border:none; outline:none; font:inherit; padding:0;
    background:transparent; color:var(--green); caret-color:var(--green);
  }

  /* ── tablets and phones ──────────────────────────────────────────────────
     The station is a desktop terminal first, and on a bench tablet it stays one — but
     a 46% side-by-side split is unreadable on a 7" screen, and a 22px button is below
     every touch-target guideline there is. These do not change the desktop layout. */

  /* Anything driven by a finger rather than a mouse, whatever the screen size. */
  @media (hover: none) and (pointer: coarse){
    .warnpill,.barbtn{
      height:34px; padding:0 14px; font-size:13px;   /* ~44px with the row's spacing */
    }
    #bar{ padding:8px 14px; font-size:13px }
    #barr{ gap:10px }
    /* A tap on a row is a click on a line of text; give it somewhere to land. */
    .line.idx{ min-height:2.2em; padding:2px 0 }
    /* iOS zooms the whole page when a focused input is under 16px. That zoom then
       never fully undoes, and the terminal ends up permanently offset. */
    #cmd{ font-size:16px }
  }

  /* Narrow: stack the graph above the terminal instead of beside it. Side by side,
     both halves are too narrow to be worth having. */
  @media (max-width: 760px){
    #main{ flex-direction:column }
    body.g-split #graphpane{
      width:auto; height:42vh; flex-shrink:0;
      border-left:none; border-bottom:1px solid #1e1e1e;
    }
    #term{ padding:10px 12px 10px }
    /* The button row is wider than a phone and was pushing the whole PAGE sideways —
       the classic not-mobile-friendly symptom. Let the bar scroll within itself
       instead: the buttons stay reachable and the page stops moving. */
    #bar{ overflow-x:auto; -webkit-overflow-scrolling:touch }
    #bar::-webkit-scrollbar{ height:0 }
    #barl{ flex-shrink:0 }
    #barr{ flex-shrink:0 }
    /* Flex items refuse to shrink below their content unless told to; without this the
       terminal's long pre-formatted lines widen the page rather than scrolling inside it. */
    #main, #term{ min-width:0 }
    /* Safe-area insets: with viewport-fit=cover the page runs under the notch and the
       home indicator, and the command line is the thing that must never be under them. */
    #promptrow{ padding-bottom:env(safe-area-inset-bottom, 0) }
    #term{ padding-left:max(12px, env(safe-area-inset-left));
           padding-right:max(12px, env(safe-area-inset-right)) }
    #bar{ padding-top:max(6px, env(safe-area-inset-top)) }
  }

  /* Short and wide — a tablet held in landscape. Keep the split, drop the chrome. */
  @media (max-height: 500px) and (orientation: landscape){
    #bar{ padding:3px 14px }
    #term{ padding-top:8px }
  }
</style>
</head>
<body>

<div id="bar"><span id="barl"><b>INVENTORY</b></span><span id="barr"></span></div>
<div id="main">
<div id="term">
  <div id="out"></div>
  <div id="live"></div>
  <div id="promptrow">
    <span id="ps1">&rsaquo; </span><span id="inwrap"><span id="idle" class="blink">&#9608;</span><span id="ghost"></span><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input"></span>
  </div>
</div>
<div id="graphpane"><canvas id="gcanvas"></canvas>
  <div id="hud">
    <span class="hc hc-tl"></span><span class="hc hc-tr"></span><span class="hc hc-bl"></span><span class="hc hc-br"></span>
    <div id="hud-top"><b>INV.OS</b> <span id="hud-ctx">NODE GRAPH</span><span id="hud-stat"></span></div>
    <div id="hud-bot"><span id="hud-live">● LIVE</span><span id="ghint">DRAG · ZOOM · H TO CENTER</span></div>
  </div>
  <div id="glabel"></div>
  <div id="gbtns"><span class="barbtn" id="gb-view" title="switch view (g): inventory / projects / galaxy">◱ view</span><span class="barbtn" id="gb-home" title="recenter (h)">⌂</span><span class="barbtn" id="gb-3d" title="toggle 2D/3D">3D</span><span class="barbtn" id="gb-style" title="toggle look">✦</span><span class="barbtn" id="gb-hud" title="toggle HUD frame">HUD</span></div>
</div>
</div>
<div id="printsheet"></div>
<div id="toast"></div>
<input id="photoinput" type="file" accept="image/*" capture="environment" style="display:none">
<input id="legacyinput" type="file" accept=".json,.txt,application/json" style="display:none">
<input id="sheetinput" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm,.xlsb,.ods,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none">
<div id="scanpane"><video id="scanvid" playsinline muted></video><div id="scanhint">point at a bin label — esc cancels</div></div>

<script>
"use strict";
/* =====================================================================
   COMPONENT INVENTORY v4
   - live search: results appear under the prompt as you type
   - one-line add: `add 10k resistor x50 @112` — shelf guessed from name
   - custom shelves: `class 3 = 3D PRINTING`
   Dewey bins: first digit of the bin = shelf class (000-900).
   ===================================================================== */

const KEY = "compinv-v7";
const PS1 = "\u203a ";
const THEMES = {
  campbell: { label:"CAMPBELL (cmd)",   bg:"#0c0c0c", fg:"#cccccc", dim:"#767676", amber:"#f9f1a5", white:"#ffffff", cyan:"#61d6d6",
              mono:'"Cascadia Mono","Consolas","JetBrains Mono","SF Mono",monospace' },
  phosphor: { label:"GREEN PHOSPHOR",   bg:"#0b0e0c", fg:"#3df07a", dim:"#1e8c48", amber:"#ffb000", white:"#c9ffd6", cyan:"#5bf0c0",
              mono:'"JetBrains Mono","Consolas",monospace' },
  amber:    { label:"AMBER CRT",        bg:"#120d00", fg:"#ffb000", dim:"#8a5e00", amber:"#ffd561", white:"#fff2cc", cyan:"#ffcf6b",
              mono:'"JetBrains Mono","Consolas",monospace' },
  ice:      { label:"ICE (blue)",       bg:"#0a0e14", fg:"#a8c7e0", dim:"#4a6076", amber:"#e0b062", white:"#eaf4ff", cyan:"#6bd6ff",
              mono:'"Cascadia Mono","Consolas",monospace' },
  paper:    { label:"PAPER (light)",    bg:"#f4f1ea", fg:"#2b2b2b", dim:"#8a8577", amber:"#9a6b00", white:"#000000", cyan:"#1f7a8c",
              mono:'"Cascadia Mono","Consolas",monospace' },
  synth:    { label:"SYNTHWAVE",        bg:"#160d23", fg:"#e0b0ff", dim:"#6b4a8a", amber:"#ff8ad6", white:"#fdf0ff", cyan:"#4de2ff",
              mono:'"JetBrains Mono","Consolas",monospace' },
};
const THEME_ORDER = Object.keys(THEMES);
function applyTheme(name){
  const t = THEMES[name] || THEMES.campbell;
  const r = document.documentElement.style;
  r.setProperty("--bg",t.bg); r.setProperty("--green",t.fg); r.setProperty("--dimgreen",t.dim);
  r.setProperty("--amber",t.amber); r.setProperty("--white",t.white); r.setProperty("--cyan",t.cyan);
  r.setProperty("--mono",t.mono);
  const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.setAttribute("content",t.bg);
  state.theme = THEMES[name] ? name : "campbell";
  // holo vs light: paper theme reads better with the clean graph
  if (state.theme==="paper" && gStyle==="holo") gStyle="clean";
}
const DEFAULT_CLASSES = ["GENERAL / CONSUMABLES","ELECTRICAL / ELECTRONICS","FASTENERS / FITTINGS",
  "METALWORKING","WOODWORKING","3D PRINTING","RESIN / CASTING","LEATHER / TEXTILE",
  "PAINT / FINISH / ADHESIVES","TOOLS / MACHINES"];
const DEFAULT_SECTIONS = {
  "11":"RESISTORS","12":"CAPACITORS","13":"ICs / SEMICONDUCTORS","14":"SENSORS",
  "15":"MODULES / DISPLAYS","16":"BOARDS / MCUs","17":"CONNECTORS","18":"WIRE / CABLE",
  "21":"BOLTS / SCREWS","22":"NUTS / WASHERS","23":"RIVETS / PINS","24":"HINGES / BRACKETS",
  "31":"STOCK / BAR / SHEET","32":"CUTTING TOOLS","33":"WELDING",
  "41":"LUMBER / SHEET","42":"DOWELS / TRIM",
  "51":"FILAMENT","52":"NOZZLES / HOTEND","53":"BUILD SURFACES",
  "61":"RESINS","62":"MOLDS / SILICONE",
  "71":"LEATHER / HIDE","72":"THREAD / HARDWARE",
  "81":"PAINT / STAIN","82":"GLUE / ADHESIVES","83":"ABRASIVES / POLISH",
  "91":"BENCH / HAND TOOLS","92":"SOLDERING",
};
const GUESS = [ // [pattern, dept, section] — first match wins, specific before generic
  // electrical (dept 1)
  [/resistor|potentiometer|\bpot\b|trimmer/,1,1],
  [/capacitor|\bcaps?\b(?!\s*screw)|electrolytic/,1,2],
  [/\bic\b|chip|regulator|transistor|diode|mosfet|555|op-?amp|level converter|driver/,1,3],
  [/sensor|ultrasonic|thermist|photores|\bpir\b|accelerometer|gyro|encoder/,1,4],
  [/module|display|oled|lcd|\btft\b|relay|buzzer|keypad|\brtc\b|\bsd card\b|neopixel/,1,5],
  [/arduino|\besp\d+|raspberry|\bpi\b|\bnano\b|\bmega\b|mcu|teensy|attiny|dev ?kit|\bpcb\b/,1,6],
  [/connector|header|socket|\bjst\b|terminal block|\bplug\b|\bjack\b/,1,7],
  [/\bwire\b|cable|jumper|ribbon|\busb\b|hookup/,1,8],
  // fasteners (2)
  [/\bnuts?\b|washer|locknut|wingnut/,2,2],
  [/\bm\d{1,2}(x\d+)?\b|bolt|machine screw|cap screw|wood screw|\bscrews?\b|set screw/,2,1],

const mem = {};
/* ── STORAGE ADAPTER ────────────────────────────────────────────
   The app is LOCAL-FIRST and fully offline by default. A server is
   OPTIONAL: if one is configured (invos-server-url in localStorage),
   the main state key ALSO syncs to it — reads prefer the server when
   reachable, writes go to both, and if the server is down everything
   silently falls back to local so the app never stops working.
   Nothing about the owned/offline experience changes when no server
   is set. ── */
const SERVER = {
  url(){ try{ return localStorage.getItem("invos-server-url")||""; }catch(e){ return ""; } },
  token(){ try{ return localStorage.getItem("invos-server-token")||""; }catch(e){ return ""; } },
  on(){ return !!this.url(); },
  hdr(){ const h={"Content-Type":"application/json"}; const t=this.token(); if(t) h["X-INVOS-Token"]=t; return h; },
  async getState(){
    const r=await fetch(this.url().replace(/\/$/,"")+"/api/state",{headers:this.hdr()});
    if(!r.ok) throw new Error("server "+r.status);
    const j=await r.json();
    return j.blob==null ? null : (typeof j.blob==="string"?j.blob:JSON.stringify(j.blob));
  },
  async putState(env){
    const r=await fetch(this.url().replace(/\/$/,"")+"/api/state",{method:"PUT",headers:this.hdr(),body:env});
    if(!r.ok) throw new Error("server "+r.status);
    return true;
  },
  async getConfig(){
    const r=await fetch(this.url().replace(/\/$/,"")+"/api/config",{headers:this.hdr()});
    if(!r.ok) throw new Error("server "+r.status);
    return r.json();
  }
};
let serverLive=false;   // last-known server reachability (for the health screen)
const store = {
  async get(k){
    // server-first for the MAIN state key when a server is configured
    if (k===KEY && SERVER.on()){
      try{ const v=await SERVER.getState(); serverLive=true; if(v!=null) return v; }
      catch(e){ serverLive=false; }   // fall through to local on any failure
    }
    if (window.storage?.get){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
    try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; }
  },
  async set(k,v){
    // write to the server too (best-effort) for the main state key
    if (k===KEY && SERVER.on()){
      try{ await SERVER.putState(v); serverLive=true; }catch(e){ serverLive=false; }
    }
    if (window.storage?.set){ try{ await window.storage.set(k,v); return; }catch(e){} }
    try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; }
  },
  async del(k){
    if (window.storage?.delete){ try{ await window.storage.delete(k); }catch(e){} }
    try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; }
  }
};

/* ── SERVER DATA LAYER (the exe) ────────────────────────────────
   The app used to keep the WHOLE inventory in memory as one JSON blob and
   rewrite all of it on every change. That is what broke at volume, so it is
   gone: the Go binary owns the database and answers bounded queries.

   `state.items` is no longer the inventory. It is only the rows CURRENTLY ON
   SCREEN — a window. Anything that needs the whole truth (counts, search,
   duplicate checks) must ask the server through DB, never scan state.items.
   DB.viewComplete says whether the window happens to hold everything, and
   commands that cannot work on a partial window check it and say so rather
   than silently acting on 200 of 40,000 rows. ── */
const DB = {
  base: "",
  async req(method, path, body){
    const opt = {method, headers:{}};
    /* Who is at this station. The server puts it on every log row, so a shop can answer
       "who took the last one". It is a claim, not a credential — nobody is authenticated
       — which is exactly why it is a plain header and not a session. */
    if (state.operator) opt.headers["X-INVOS-Operator"] = state.operator;
    /* The shop key, on a device that needs one. Loopback never does — the person at the
       machine can read the database file anyway — so this is empty on the station itself
       and set once, by hand, on each tablet. It lives in this device's own storage and is
       never sent anywhere but back to the station that issued it. */
    if (state.shopKey) opt.headers["X-INVOS-Token"] = state.shopKey;
    if (body !== undefined){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }

    /* THE SEAM. Every one of the forty methods below goes through this one function, so
       this one line is the entire dependency on a server.

       The public demo is the same interface with the same code, answered in the browser
       instead of over a socket. That is deliberate: maintaining a second, diverging copy
       of a 6,000-line UI just to have something to show people is a tax paid forever, and
       the demo drifts from the product exactly when it matters most.

       Nothing is bundled here — the product binary carries no demo code. The demo build
       appends a script that defines this hook. */
    if (window.__invosDemo) return window.__invosDemo(method, path, body);

    const r = await fetch(this.base + path, opt);
    if (r.status === 204) return null;
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch(e){ throw new Error("bad response from server"); }
    if (r.status === 401){
      // Ask rather than fail: a tablet meeting a protected station for the first time
      // should be told what to do, not handed a status code.
      needsKey();
      throw new Error("this station needs a key — type:  key <the shop key>");
    }
    if (!r.ok){
      const err = new Error((data && data.error) || ("server error " + r.status));
      // carry structured detail through, so a caller can render a shortage list rather
      // than just the sentence "not enough stock"
      if (data && data.short) err.short = data.short;
      throw err;
    }
    return data;
  },
  get(p){ return this.req("GET", p); },
  post(p,b){ return this.req("POST", p, b===undefined?{}:b); },
  patch(p,b){ return this.req("PATCH", p, b); },
  put(p,b){ return this.req("PUT", p, b); },
  del(p){ return this.req("DELETE", p); },

  /* items -------------------------------------------------------------- */
  qs(o){
    const u = new URLSearchParams();
    for (const [k,v] of Object.entries(o)) if (v!==undefined && v!==null && v!=="") u.set(k,v);
    const s = u.toString();
    return s ? "?"+s : "";
  },
  // Returns {rows,total,capped} AND parks the rows in the view window so the
  // existing rendering code keeps working unchanged.
  async items(opts){
    const page = await this.get("/api/items"+this.qs(opts));
    setView(page.rows, page.total);
    return page;
  },
  // A read that must NOT disturb what is on screen (lookups, dup checks).
  peek(opts){ return this.get("/api/items"+this.qs(opts)); },
  item(cid){ return this.get("/api/items/"+cid); },
  add(item){ return this.post("/api/items", item); },
  bulk(items, source){ return this.post("/api/items/bulk", {items, source}); },
  edit(cid, patch){ return this.patch("/api/items/"+cid, patch); },
  remove(cid){ return this.del("/api/items/"+cid); },
  adjust(cid, delta){ return this.post("/api/items/"+cid+"/qty", {delta}); },
  nextBin(dept, sec){ return this.get(`/api/bins/next?dept=${dept}&sec=${sec}`); },

  /* layout / summary ---------------------------------------------------- */
  depts(){ return this.get("/api/depts"); },
  sections(dept){ return this.get("/api/sections"+(dept>=0?"?dept="+dept:"")); },
  setDept(n,label){ return this.put("/api/depts/"+n,{label}); },
  setSection(code,label){ return this.put("/api/sections/"+code,{label}); },
  stats(){ return this.get("/api/stats"); },
  log(limit, opts){
    const q = new URLSearchParams({limit: String(limit||20)});
    if (opts && opts.by) q.set("by", opts.by);
    if (opts && opts.cid) q.set("cid", String(opts.cid));
    return this.get("/api/log?"+q.toString());
  },
  undo(){ return this.post("/api/undo"); },
  meta(k){ return this.get("/api/meta/"+encodeURIComponent(k)); },
  setMeta(k,value){ return this.put("/api/meta/"+encodeURIComponent(k), {value}); },

  /* projects ------------------------------------------------------------ */
  projects(){ return this.get("/api/projects"); },
  bom(pid){ return this.get("/api/projects/"+pid+"/bom"); },
  addProject(name){ return this.post("/api/projects", {name}); },
  editProject(pid, patch){ return this.patch("/api/projects/"+pid, patch); },
  delProject(pid){ return this.del("/api/projects/"+pid); },
  activate(pid){ return this.post("/api/projects/"+pid+"/active"); },
  setBom(pid, cid, need){ return this.put(`/api/projects/${pid}/bom/${cid}`, {need}); },
  delBom(pid, cid){ return this.del(`/api/projects/${pid}/bom/${cid}`); },
  sharedParts(){ return this.get("/api/shared-parts"); },
  build(pid, partial){ return this.post(`/api/projects/${pid}/build`, {partial:!!partial}); },

  /* maintenance ---------------------------------------------------------- */
  // allItems pages through the ENTIRE inventory. This deliberately breaks the
  // "never hold everything" rule, and it is only for commands the user explicitly
  // invoked that cannot mean anything on a partial view: doctor, tidy, merge,
  // remap, export. It is a handful of requests for a real shop, and it reports
  // progress so a huge inventory does not look frozen.
  async all(onProgress){
    const out = [];
    const PAGE = 1000;
    for (;;){
      const page = await this.get("/api/items"+this.qs({limit:PAGE, offset:out.length, sort:"bin"}));
      out.push(...page.rows);
      if (onProgress) onProgress(out.length, page.total);
      if (out.length >= page.total || page.rows.length === 0) break;
    }
    return out;
  },
  bulkUpdate(patches, what){ return this.post("/api/items/bulk-update", {patches, what}); },
  merge(keep, drop){ return this.post("/api/items/merge", {keep, drop}); },
  count(cid, actual, scope){ return this.post(`/api/items/${cid}/count`, {actual, scope:scope||""}); },
  countLog(limit){ return this.get("/api/countlog?limit="+(limit||100)); },
  photoIds(){ return this.get("/api/photos"); },
  putPhoto(cid, dataUrl){ return this.put(`/api/items/${cid}/photo`, {dataUrl}); },
  delPhoto(cid){ return this.del(`/api/items/${cid}/photo`); },
  photoURL(cid){ return `/api/items/${cid}/photo`; },
  exportAll(){ return this.get("/api/export"); },
  serverInfo(){ return this.get("/api/server"); },
  setLan(on, tls){ return this.post("/api/lan", tls===undefined ? {on} : {on, tls}); },

  viewComplete: true,   // does state.items currently hold every matching row?
};

/* Renaming a department or a shelf is SHOP data, not a display preference: every
   station has to see it, and it has to survive a reload. These paths used to write to
   the in-memory copy and call save(), which now only persists per-device preferences —
   so a rename looked right on screen and was gone on the next load. */
async function renameDept(n, label){
  try { await DB.setDept(n, label); }
  catch(e){ print("could not rename it: "+e.message,"a"); return false; }
  state.classes[n] = label;
  deptCache = null;
  refreshHome(false);
  graphSync();
  return true;
}

/* An empty label CLEARS the shelf. The server refuses that while the shelf still holds
   items and says so, which is the check that matters — the client-side one is only there
   to give a faster, friendlier message. */
async function renameSection(code, label){
  try { await DB.setSection(code, label); }
  catch(e){ print(e.message,"a"); return false; }
  if (label) state.sections[code] = label; else delete state.sections[code];
  graphSync();
  return true;
}

/* Shown when the station refuses this device for want of a key. Once per session: a
   tablet that has just been told will be making several failing requests at once, and
   five copies of the same instruction is noise, not help. */
let keyPromptShown = false;
function needsKey(){
  if (keyPromptShown) return;
  keyPromptShown = true;
  setTimeout(()=>{
    print("");
    print("This station is protected.","a");
    print("  Ask whoever set it up for the shop key, then type:  key <the key>","d");
    print("  It is stored on this device only, and only sent back to this station.","d");
  }, 0);
}

/* Legacy import — moving a shop off the v20.2 single-file HTML build.

   Staged in two steps on purpose. The first call is a DRY RUN: the server parses the
   file and reports what it would write, including every row it cannot carry over, and
   writes nothing. Only `import legacy confirm` commits. The old build was the only copy
   of some shops' data, so "run it and see" is not an acceptable first move. */
let legacyPending = null;

async function runLegacyImport(src, dry){
  let res;
  try {
    res = await DB.req("POST","/api/import/legacy", {...src, dry});
  } catch(e){
    legacyPending = null;
    print("import failed: "+e.message,"a");
    return;
  }

  if (dry){
    legacyPending = src;
    print(`this file holds ${res.items} items, ${res.projects} projects `
        + `(${res.bomLines} BOM lines), ${res.sections} shelf names.`,"w");
  } else {
    legacyPending = null;
    print(`imported ${res.items} items and ${res.projects} projects.`,"g");
  }

  if (res.skipped && res.skipped.length){
    print(`  ${res.skipped.length} thing${res.skipped.length===1?"":"s"} cannot come across:`,"a");
    for (const line of res.skipped.slice(0,8)) print("    "+line,"d");
    if (res.skipped.length>8) print(`    …and ${res.skipped.length-8} more`,"d");
  }

  if (dry){
    print("  C-IDs are kept exactly as they are, so printed drawer labels stay correct.","d");
    print("  nothing has been written yet. to go ahead:  import legacy confirm","w");
  } else {
    await loadAll();
    refreshHome(false);
    graphSync();
    print("  one step in the log — 'undo' backs the whole import out.","d");
  }
}

/* finishFirstRun records that the shop has been set up. It lives in the database
   rather than this browser, so the welcome screen does not reappear on the next
   tablet that opens the app. */
async function finishFirstRun(){
  state.firstRun = false;
  state.seeded = true;
  try { await DB.setMeta("setup_done","1"); }catch(e){}
}

/* Projects ARE loaded in full, unlike items. A shop has tens of builds with a
   handful of part lines each, so the whole set is small and bounded — and holding
   it lets the graph, galaxy and BOM screens keep working unchanged. Every BOM line
   arrives with the part's name and live stock already joined on, so nothing here
   needs to go looking through the item table. */
async function loadProjects(){
  try {
    const list = await DB.projects();
    const boms = await Promise.all(list.map(p=>DB.bom(p.pid).catch(()=>[])));
    state.projects = list.map((p,i)=>({
      pid: p.pid, name: p.name, status: p.status, notes: p.notes,
      created: p.created, active: p.active,
      bom: (boms[i]||[]).map(l=>({cid:l.cid, need:l.need, have:l.have, name:l.name, bin:l.bin, min:l.min})),
    }));
    const act = state.projects.find(p=>p.active);
    state.activePid = act ? act.pid : null;
  } catch(e){
    print("could not load projects: "+e.message,"a");
  }
  return state.projects;
}


/* setView installs a result page as the on-screen window. */
function setView(rows, total){
  state.items = rows || [];
  DB.viewComplete = (total === undefined) || (state.items.length >= total);
  return state.items;
}

/* notPorted refuses a command whose data would go nowhere. These features still
   write to the old in-memory state, which is no longer persisted now that the
   database is the system of record — so accepting the input would silently lose
   the user's work on the next reload. Refusing is the honest behavior until each
   one is moved onto the API. */
function notPorted(what, next){
  print(`${what} is not connected to the database yet.`,"a");
  print(`  Everything it recorded would be lost on the next reload, so it is`,"d");
  print(`  switched off rather than pretending to work.${next?"  "+next:""}`,"d");
  return true;
}

/* loadAll pulls the ENTIRE inventory into the view for one maintenance command.
   Normal screens are paged — that is the whole point of the exe — but doctor, tidy,
   merge, remap and export are meaningless on a partial view, so they say what they
   are doing and read the lot. Returns false if the read failed. */
async function loadAll(what){
  let announced = false;
  try {
    const rows = await DB.all((got,total)=>{
      if (total > 2000 && !announced){ announced = true; print(`  reading ${total} items…`,"d"); }
    });
    setView(rows, rows.length);
    return true;
  } catch(e){
    print(`${what} could not read the inventory: ${e.message}`,"a");
    return false;
  }
}

/* Settings are per-DEVICE: a tablet at the bench wants a different theme, a different
   graph budget and a different zoom from the office PC, and forcing one set on all of
   them would be worse than useless.

   But a shop setting up its fifth tablet should not have to dial all of it in again. So
   the shop can store a DEFAULT set on the server, which a device with no settings of
   its own picks up on first run. After that the device is on its own — a default is a
   starting point, not a policy. */
const DEVICE_PREF_KEYS = ["theme", "cfg", "hud", "cores"];

function currentPrefs(){
  return { theme: state.theme, cfg: state.cfg, hud: state.hud, cores: state.cores };
}

async function saveShopDefaults(){
  try {
    await DB.setMeta("default_prefs", JSON.stringify(currentPrefs()));
    return true;
  } catch(e){ print("could not save the shop default: "+e.message,"a"); return false; }
}

async function shopDefaults(){
  try {
    const v = (await DB.meta("default_prefs")).value;

}

/* Cached server info, so the titlebar can show shop-access state without asking on
   every repaint. Refreshed on boot and whenever the switch is thrown. */
let serverInfo = null;
/* The build this PAGE was loaded from. An open page does not reload itself when the
   server behind it is replaced, so after an update the app on screen is the OLD one —
   which looks exactly like "the fix did not work". The page remembers what it loaded
   with and notices when the server has moved on. */
let loadedBuild = null;
let updateReady = false;

async function refreshServerInfo(){
  try {
    serverInfo = await DB.serverInfo();
    if (serverInfo && serverInfo.build){
      if (loadedBuild === null) loadedBuild = serverInfo.build;
      else if (serverInfo.build !== loadedBuild && !updateReady){
        updateReady = true;
        updateBadge();
        print("","d");
        print("a newer build of INV.OS is running on the server — this window is still","a");
        print("showing the previous one. reload to pick it up:  ctrl+R  (or click ⟳ update)","a");
      }
    }
  }catch(e){}
  return serverInfo;
}

/* Check periodically and whenever the window is focused again, which is exactly when
   someone has come back after an update.

   The poll skips hidden windows. A shop with six tablets left open on a bench was
   otherwise making a request every thirty seconds each, around the clock, to ask a
   question nobody was there to read the answer to. Coming back to the window checks
   immediately, so nothing is missed by waiting. */
addEventListener("focus", ()=>{ if(!updateReady) refreshServerInfo(); });
addEventListener("visibilitychange", ()=>{
  if (!document.hidden && !updateReady) refreshServerInfo();
});
setInterval(()=>{
  if (document.hidden || updateReady) return;
  refreshServerInfo();
}, 30000);

/* cached summary so the title bar and home screen do not re-query constantly */
let summary = {items:0, pieces:0, bins:0, low:0, projects:0, log:0, dbBytes:0};
async function refreshSummary(){
  try { summary = await DB.stats(); } catch(e){ /* offline: keep the last figures */ }
  return summary;
}

/* ── DATA INTEGRITY ─────────────────────────────────────────────
   Every write is wrapped in a checksummed, versioned envelope and
   mirrored to a second store (localStorage + IndexedDB). Loads verify
   the checksum and fall back through: primary -> mirror -> newest
   snapshot -> auto-backup file -> seed. Nothing loads unverified. */
const SCHEMA = 7;                       // bump when the shape changes
const MIRROR_KEY = KEY + "-mirror";
const SNAP_KEY = KEY + "-snap";         // rolling good-state snapshots
const MAX_SNAPS = 10;
let lastGoodJSON = null, lastSaveTs = 0, lastSaveOk = true;

function checksum(str){                  // fast 32-bit FNV-1a, hex
  let h=0x811c9dc5;
  for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); }
  return (h>>>0).toString(16).padStart(8,"0");
}
function envelope(dataStr){
  return JSON.stringify({ v:SCHEMA, ts:Date.now(), sum:checksum(dataStr), data:dataStr });
}
function openEnvelope(raw){              // -> {ok, data, meta} ; tolerant of legacy bare JSON
  if (raw==null) return {ok:false, reason:"empty"};
  try{
    const env=JSON.parse(raw);
    if (env && typeof env==="object" && env.sum!==undefined && env.data!==undefined){
      const ok = checksum(env.data)===env.sum;
      return { ok, data:env.data, meta:{v:env.v, ts:env.ts, sum:env.sum}, reason: ok?null:"checksum" };
    }
    // legacy: raw was bare state JSON (pre-integrity). accept once, it'll get re-wrapped on next save.
    if (env && env.items) return { ok:true, data:raw, meta:{v:0, legacy:true} };
  }catch(e){}
  return {ok:false, reason:"parse"};
}
async function idbGet(k){ return idb("readonly", st=>st.get(k)); }
/* photos live in their own IdB keys ("photo:<cid>") so the main state blob stays
   small and snapshot/checksum-friendly. Item just carries a boolean `photo`. */
const photoCache={}; let photoTarget=null;
/* Photos live in the database now, so a picture taken on the phone at the bench is
   there on the office PC. photoIds is the set of items that HAVE one, fetched once
   and kept current on write — asking per item would mean a request per row. */
let photoIds = new Set();
async function refreshPhotoIds(){
  try { photoIds = new Set(await DB.photoIds()); }catch(e){}
  return photoIds;
}
function hasPhoto(cid){ return photoIds.has(cid); }

async function getPhoto(cid){
  if (!photoIds.has(cid)) return null;
  // the <img> can point straight at the endpoint; no need to inline the bytes
  return DB.photoURL(cid);
}
async function setPhoto(cid, dataUrl){
  await DB.putPhoto(cid, dataUrl);
  photoIds.add(cid);
  photoCache[cid] = dataUrl;
}
async function delPhoto(cid){
  try { await DB.delPhoto(cid); }catch(e){}
  photoIds.delete(cid);
  delete photoCache[cid];
}
/* downscale any image to a capped data URL before storing */
function downscaleImage(fileOrBlob, maxDim=640, quality=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(fileOrBlob);
    img.onload=()=>{
      let {width:w,height:h}=img;
      if (w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if (h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src=url;
  });
}
async function idbSet(k,v){ return idb("readwrite", st=>st.put(v,k)); }

async function pushSnapshot(dataStr){    // keep the last MAX_SNAPS verified states
  try{
    let snaps=[];
    const raw=await idbGet(SNAP_KEY); if(raw){ try{ snaps=JSON.parse(raw); }catch(e){} }
    if (snaps.length && snaps[snaps.length-1].sum===checksum(dataStr)) return; // no change
    snaps.push({ ts:Date.now(), sum:checksum(dataStr), data:dataStr });
    if (snaps.length>MAX_SNAPS) snaps=snaps.slice(-MAX_SNAPS);
    await idbSet(SNAP_KEY, JSON.stringify(snaps));
  }catch(e){}
}
async function readSnapshots(){
  try{ const raw=await idbGet(SNAP_KEY); return raw?JSON.parse(raw):[]; }catch(e){ return []; }
}

/* save() no longer writes the inventory anywhere — every mutation already went to
   the database through DB, synchronously with its log entry. What is left is the
   per-DEVICE preferences (theme, graph settings, HUD), which should NOT be shared
   between the shop's tablets, so they stay in this browser. */
async function save(){
  try {
    localStorage.setItem(KEY+"-prefs", JSON.stringify({
      theme: state.theme, cfg: state.cfg, hud: state.hud,
      cores: state.cores, activePid: state.activePid,
    }));
  } catch(e){ /* private mode: preferences just do not persist */ }
  updateBadge(); graphSync();
}

async function saveLegacy(){
  const dataStr = JSON.stringify(state);
  const env = envelope(dataStr);
  lastSaveOk = true;
  try{ await store.set(KEY, env); }
  catch(e){ lastSaveOk=false; }
  // verify the primary write actually round-trips (catches quota / corruption)
  try{ const back=await store.get(KEY); const chk=openEnvelope(back); if(!chk.ok||chk.data!==dataStr) lastSaveOk=false; }
  catch(e){ lastSaveOk=false; }
  try{ await idbSet(MIRROR_KEY, env); }catch(e){}      // redundant mirror
  if (lastSaveOk){ lastGoodJSON=dataStr; lastSaveTs=Date.now(); pushSnapshot(dataStr); }
  updateBadge(); graphSync();
  if (backupHandle && ++backupDirty>=5) writeBackup();
  if (dbHandle) syncDb(false);   // mirror to the physical .db (batched, best-effort)
}
/* load() brings up the shell: device preferences from this browser, everything
   else from the database. The inventory itself is NOT loaded — it is queried a
   page at a time, which is the whole point of the exe. */
async function load(){
  state = { classes:[...DEFAULT_CLASSES], sections:{...DEFAULT_SECTIONS},
            projects:[], nextPid:1, items:[], log:[], undo:[],
            counted:{}, countlog:[], cfg:{} };
  let hadOwnPrefs = false;
  try {
    const raw = localStorage.getItem(KEY+"-prefs");
    hadOwnPrefs = !!raw;
    Object.assign(state, JSON.parse(raw || "{}"));
  } catch(e){ /* fall through to defaults */ }

  try {
    const [depts, secs, shop] = await Promise.all([
      DB.depts(), DB.sections(-1), DB.meta("shop_name"),
    ]);
    deptCache = depts;
    state.classes = depts.map(d=>d.label);
    state.sections = {};
    secs.forEach(x=>{ state.sections[x.code] = x.label; });
    state.shopName = shop.value || "";
    await refreshSummary();
    lowDepts = await lowDeptSet();
    // A brand new database is empty; offer the first-run doors as before.
    state.firstRun = (await DB.meta("setup_done")).value !== "1";
    state.seeded = summary.items > 0;
    state.seededDemo = (await DB.meta("demo")).value === "1";
    // A device with no settings of its own starts from the shop's default set, if the
    // shop has saved one. Devices that have been configured are never overwritten.
    if (!hadOwnPrefs){
      const d = await shopDefaults();
      if (d) for (const k of DEVICE_PREF_KEYS) if (d[k] !== undefined) state[k] = d[k];
    }
  } catch(e){
    print("cannot reach the server: "+e.message,"a");
    print("this page is served by the invos program — is it still running?","d");
  }
  state.theme ||= "campbell";
  if (state.cores===undefined) state.cores=true;
  state.cfg = state.cfg || {};
  if (state.hud===undefined) state.hud=true;
  if (state.activePid===undefined) state.activePid=null;
}

async function loadLegacy(){
  let loaded=false, source="";
  const tryParse=(dataStr)=>{ try{ const o=JSON.parse(dataStr); if(o&&o.items){ state=o; return true; } }catch(e){} return false; };

  // 1. primary (checksummed)
  const chk = openEnvelope(await store.get(KEY));
  if (chk.ok && tryParse(chk.data)){ loaded=true; source=chk.meta&&chk.meta.legacy?"primary (legacy)":"primary"; }

  // 2. mirror (IndexedDB)
  if (!loaded){ const m=openEnvelope(await idbGet(MIRROR_KEY).catch(()=>null));
    if (m.ok && tryParse(m.data)){ loaded=true; source="mirror (primary was "+(chk.reason||"missing")+")"; } }

  // 3. newest verified snapshot
  if (!loaded){ const snaps=await readSnapshots();
    for (let i=snaps.length-1;i>=0;i--){ if(checksum(snaps[i].data)===snaps[i].sum && tryParse(snaps[i].data)){
      loaded=true; source="snapshot from "+new Date(snaps[i].ts).toLocaleString(); break; } } }

  if (loaded){
    lastGoodJSON=JSON.stringify(state); lastSaveTs=chk.meta?.ts||Date.now();
    if (source!=="primary") print("data recovered from "+source+".","a");
  } else {
    // 4. seed — nothing verifiable exists yet: start with the DEMO (items + connected
    //    project galaxy) so a fresh open is fully explorable. first-run doors still show;
    //    'demo clear' or picking "just start" wipes it for real use.
    state = { classes:[...DEFAULT_CLASSES], sections:{...DEFAULT_SECTIONS}, projects:[], nextPid:1 };
    loadDemoData();          // fills items + galaxy-connected demo projects, flags demo
    await save();
  }
  state.classes ||= [...DEFAULT_CLASSES];
  state.sections ||= {...DEFAULT_SECTIONS};
  state.projects ||= []; state.nextPid ||= 1;
  state.theme ||= "campbell";
  if (state.cores===undefined) state.cores=true;
  state.cfg=state.cfg||{};
  state.counted=state.counted||{};
  state.countlog=state.countlog||[];
  if (state.shopName===undefined) state.shopName="";
  if (state.firstRun===undefined) state.firstRun=true;   // cleared once the user picks a first-run door
  if (state.hud===undefined) state.hud=true;
  if (state.activePid===undefined) state.activePid=null;
  state.log ||= []; state.undo ||= [];
  state.nextCid ||= Math.max(0,...state.items.map(i=>i.cid))+1;
}

/* ---------- activity log + undo stack ---------- */
function logAct(text, undoEntry){
  const cid = undoEntry?.cid ?? undoEntry?.item?.cid ?? undoEntry?.before?.cid ?? null;
  state.log.push({ts:Date.now(), text, cid});
  if (state.log.length>100) state.log = state.log.slice(-100);
  if (undoEntry){
    undoEntry.desc = text;
    state.undo.push(undoEntry);
    if (state.undo.length>50) state.undo = state.undo.slice(-50);
  }
}
/* Undo is the server's job now: reversing the change and marking the log entry
   happen in one transaction, so the audit trail can never disagree with the data. */
async function doUndo(){
  let res;
  try { res = await DB.undo(); }
  catch(e){ print("undo failed: "+e.message,"a"); return false; }
  if (!res.undone){ print(res.reason || "nothing to undo.","d"); return false; }
  await refreshSummary(); deptCache=null; updateBadge(); graphSync();
  print("undone: "+res.entry.text,"g");
  return true;
}

async function doUndoLegacy(){
  const e = state.undo.pop();
  if (!e){ print("nothing to undo.","d"); return; }
  const find = cid => state.items.find(c=>c.cid===cid);
  switch(e.type){
    case "add":    state.items = state.items.filter(c=>c.cid!==e.cid); break;
    case "del":    state.items.push(e.item); break;
    case "take":   { const c=find(e.cid); if(c) c.qty += e.n; break; }
    case "stock":  { const c=find(e.cid); if(c) c.qty = Math.max(0,c.qty-e.n); break; }
    case "move":   { const c=find(e.cid); if(c) c.bin = e.from; break; }
    case "edit":   { const c=find(e.before.cid); if(c) Object.assign(c,e.before); break; }
    case "import": state.items = state.items.filter(c=>!e.cids.includes(c.cid)); break;
    case "class":  state.classes[e.n] = e.before; break;
    case "section": if (e.before===null) delete state.sections[e.key]; else state.sections[e.key]=e.before; break;
    case "tidy":   e.names.forEach(n=>{ const c=find(n.cid); if(c) c.name=n.before; }); break;
    case "snapshot": state.items = e.items; break;
    case "projsnap": state.projects = e.projects; break;
    case "bomline": {
      const pp=state.projects.find(x=>x.pid===e.pid);
      if (pp){
        if (e.prev===null) pp.bom=pp.bom.filter(l=>l.cid!==e.cid);
        else { const l=pp.bom.find(l=>l.cid===e.cid); if(l) l.need=e.prev; }
      }
      break;
    }
  }
  state.log.push({ts:Date.now(), text:"undid: "+e.desc});
  await save();
  print("undid: "+e.desc,"a");
}

/* The demo now seeds the DATABASE (one bulk insert, one undo step) instead of a
   browser array, so "explore the demo" produces something every device in the shop
   can see — and `undo` backs the whole thing out. */
async function loadDemoData(){
  try {
    await DB.bulk(SEED.map(c=>({
      name:c.name, bin:c.bin, qty:c.qty, min:c.min||0,
      value:c.value||"", pkg:c.pkg||"", part:c.part||"", notes:c.notes||"",
    })), "demo");
    await DB.setMeta("demo","1");
  } catch(e){ print("could not load the demo data: "+e.message,"a"); return; }
  // Rebuild the demo projects in the database. They deliberately SHARE parts, which
  // is what gives the galaxy view its bridges between clusters.
  try {
    const seeded = (await DB.peek({limit:1000, sort:"bin"})).rows;
    const byName = {};
    seeded.forEach(c=>{ byName[norm(c.name)] = c.cid; });
    // Match on a name prefix as well as exactly, so a small wording difference in the
    // seed cannot silently drop a BOM line and leave the galaxy missing a bridge.
    const pick = n => {
      const k = norm(n);
      if (byName[k] != null) return byName[k];
      const hit = seeded.find(c => norm(c.name).startsWith(k));
      return hit ? hit.cid : null;
    };
    const plan = [
      ["Weather Station","building", [["ESP32 DevKit",1],["OLED Display",1],["Resistor 10kΩ",4],["Jumper Wires M-M",20],["Breadboard 830pt",1]]],
      ["Robot Arm","planning",       [["Arduino Uno R3",1],["Logic Level Converter",2],["HC-SR04 Ultrasonic",1],["Jumper Wires M-M",15],["Breadboard 830pt",1]]],
      ["Desk Clock","done",          [["ESP32 DevKit",1],["OLED Display",1],["Capacitor 100µF",2],["Resistor 220Ω",3]]],
      ["Line Follower","planning",   [["Arduino Uno R3",1],["HC-SR04 Ultrasonic",2],["Resistor 220Ω",4],["Jumper Wires M-M",10]]],
    ];
    for (const [name,status,lines] of plan){
      const np = await DB.addProject(name);
      if (status!=="planning") await DB.editProject(np.pid, {status});
      for (const [partName, need] of lines){
        const cid = pick(partName);
        if (cid!=null) await DB.setBom(np.pid, cid, need);
      }
    }
    const first = (await DB.projects())[0];
    if (first) await DB.activate(first.pid);
  } catch(e){ print("demo projects could not be created: "+e.message,"a"); }
  await loadProjects();
  await finishFirstRun();
  state.seededDemo=true;
  deptCache=null; await refreshSummary(); lowDepts=await lowDeptSet();
}

/* home() stays SYNCHRONOUS and paints from cached aggregates, then refreshes them
   in the background. Making it async instead would have raced every caller that
   prints or renders straight after it (and there are a dozen, including bare key
   handlers). The counters are trigger-maintained server-side, so the refresh is a
   couple of cheap reads no matter how large the inventory is. */
let deptCache = null;
let lowDepts = new Set();

async function refreshHome(repaint){
  try {
    const [d] = await Promise.all([DB.depts(), refreshSummary()]);
    deptCache = d;
    lowDepts = await lowDeptSet();
  } catch(e){
    if (deptCache === null){
      out.innerHTML="";
      print("cannot reach the server: "+e.message,"a");
      print("this build is served by the invos program — is it still running?","d");
      return;
    }
  }
  if (repaint && isHome()) home();
}

function home(){
  menuOpen=false; atHome=true;

  setView([], 0);
  const depts = deptCache || [];
  if (deptCache === null) refreshHome(true);   // first paint: fill in as soon as it lands
  if (state.seededDemo) print("── DEMO DATA ──  'demo clear' to start real","a");
  if (state.shopName) print(state.shopName,"w");

const norm = s => String(s).toLowerCase().replace(/µ/g,"u").replace(/Ω/g,"ohm").replace(/ω/g,"ohm");
function hay(c){ return norm([c.name,c.value,c.pkg,c.part,c.notes,"bin "+c.bin,cidStr(c),
  clsLabel(clsNum(c.bin)), secLabel(clsNum(c.bin),secOf(c.bin))||""].join(" ")); }
/* search runs on the server. `approx` is set for live typing: it returns the top
   hits without counting or sorting every match, which is what keeps a keystroke
   fast on a large inventory. Explicit listings ask for the exact set. */
async function search(q, opts){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const o = Object.assign({q, sort:"bin"}, opts||{});
  try {
    const page = await DB.peek(o);
    return page.rows;
  } catch(e){ print("search failed: "+e.message,"a"); return []; }
}
/* resolve turns whatever the user typed into one item: a C-ID, an exact name, or
   a unique search hit. It queries the server, so it works on the whole inventory
   and not just the page on screen. */
async function resolve(q){
  if (!q) return {err:"give a name or C-ID"};
  const m = String(q).trim().match(/^c-?(\d+)$/i);
  if (m){
    try { return {c: await DB.item(parseInt(m[1],10))}; }
    catch(e){ return {err:`no component with id ${q.toUpperCase()}`}; }
  }
  const hits = await search(q, {limit:50});
  const exact = hits.filter(c=>norm(c.name)===norm(q));
  if (exact.length===1) return {c:exact[0]};
  if (hits.length===1) return {c:hits[0]};
  if (hits.length>1) return {many:hits};
  return {err:`no component matches "${q}"`};
}

/* applyCfg makes a settings change take effect NOW.
   Before this, `cfgadj` special-cased exactly one key (launchZoom) and everything else
   only stored a number — so turning orbit motion on in the settings screen changed the
   value and nothing else, and switching the galaxy off while looking at the galaxy left
   you sitting in a view that was supposed to be gone. A setting that stores a value and
   changes nothing is worse than no setting, because it looks like it worked. */
function applyCfg(changedKey){
  gWake();
  // orbit motion is both a stored setting and a running mode; keep them in step
  const wantOrbit = !!cfg("orbit");
  if (wantOrbit !== gOrbit){
    gOrbit = wantOrbit;
    gOrbitInit = false;
    if (gOrbit){
      if (gView.kind!=="galaxy" && gView.kind!=="projects") setGraphView({kind:"galaxy"});
      if (graphMode==="off") setGraph("split");
      gAlpha = Math.max(gAlpha, 0.6);      // settle, then take off
    }
  }
  // if the galaxy has just been switched off, leave it
  if (!galaxyOn() && gView.kind==="galaxy") setGraphView({kind:"projects"});
  // the zoom applies to what is on screen now, not only to the next view opened
  if (changedKey==="launchZoom" && graphMode!=="off"){ gUserAdjusted=false; gZoomRel=0; gScale=gFitScale(); }
  // a different node budget means a different graph
  if (changedKey==="graphNodes"){ graphItemsLoaded=false; graphSync(); }
  /* Orbit size is baked into each node's radius when the orbits are captured, so it can
     only take effect by capturing them again. That is safe to do live: the re-capture
     resets the blend, and the blend is what walks each node from where it is now onto
     its new circle instead of teleporting it there. */
  if (changedKey==="orbitSize" && gOrbitInit){ gOrbitInit=false; gOrbitRamp=0; }
  if (graphMode!=="off") gAlpha=Math.max(gAlpha,0.05);
}

/* The database picks the next free bin — it is the only thing that can see every
   bin already in use. Falls back to the first bin of the section if the server is
   unreachable, which at least keeps `add` usable. */
async function nextFreeBin(n, sec){
  const d = (sec===undefined || sec===null) ? 1 : sec;
  try { return (await DB.nextBin(n, d)).bin; }
  catch(e){ return n*1000 + d*100 + 10; }

/* ---------- name tidier: consistent wording, units, casing ---------- */
const ACRONYMS = new Set("led oled lcd tft ic usb jst pir rtc smd tht mcu pcb i2c spi uart rgb ws2812b hdmi gpio adc dac pwm ntc ptc ir rf bt".split(" "));
const SPECIAL = {wifi:"WiFi",esp32:"ESP32",esp8266:"ESP8266",arduino:"Arduino",raspberry:"Raspberry",
  pi:"Pi",attiny:"ATtiny",neopixel:"NeoPixel",bluetooth:"Bluetooth",uno:"Uno",nano:"Nano",mega:"Mega",
  devkit:"DevKit","m-m":"M-M","m-f":"M-F","f-f":"F-F"};
const TYPE_FIRST = ["resistor","capacitor","inductor","potentiometer"];

function fixUnits(str){
  let t=str;
  t=t.replace(/(\d+(?:\.\d+)?)\s*(k|m(?:eg)?)?\s*(?:ohms?|Ω)(?=\s|$)/gi,
    (m,n,p)=>n+(p ? (p[0].toLowerCase()==="k"?"k":"M") : "")+"Ω");
  t=t.replace(/(\d+(?:\.\d+)?)\s*(?:u|µ)f(?=\s|$)/gi,"$1µF");
  t=t.replace(/(\d+(?:\.\d+)?)\s*nf(?=\s|$)/gi,"$1nF");
  t=t.replace(/(\d+(?:\.\d+)?)\s*pf(?=\s|$)/gi,"$1pF");
  t=t.replace(/(\d+(?:\.\d+)?)\s*v(?=\s|$)/gi,"$1V");
  t=t.replace(/(\d+(?:\.\d+)?)\s*ma(?=\s|$)/gi,"$1mA");
  t=t.replace(/(\d+\/\d+|\d+(?:\.\d+)?)\s*w(?=\s|$)/gi,"$1W");
  t=t.replace(/(\d+(?:\.\d+)?)\s*([kmg])hz(?=\s|$)/gi,(m,n,p)=>n+({k:"k",m:"M",g:"G"})[p.toLowerCase()]+"Hz");
  return t;
}
function caseWord(w){
  const lw=w.toLowerCase();
  if (SPECIAL[lw]) return SPECIAL[lw];
  if (ACRONYMS.has(lw)) return lw.toUpperCase();
  if (/Ω|µF|nF|pF|mA|Hz/.test(w) || /^\d/.test(w)) return w;   // value & digit-led tokens untouched
  if (/^[a-z]+-?\d/i.test(w)) return w.toUpperCase();           // part codes: ts101, mb-102, ssd1306
  if (/^[a-z]$/i.test(w)) return w.toUpperCase();
  return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
}
function tidyName(raw){
  let t=fixUnits(String(raw).trim().replace(/\s+/g," "));
  let words=t.split(" ");
  if (/resistor/i.test(t))                                       // bare 10k / 4.7M gets Ω
    words=words.map(w=>/^\d+(?:\.\d+)?[km]?$/i.test(w)
      ? w.replace(/^(\d+(?:\.\d+)?)([km])?$/i,(m,n,p)=>n+(p?(p.toLowerCase()==="k"?"k":"M"):"")+"Ω") : w);
  if (/capacitor/i.test(t))                                      // bare 100u gets µF
    words=words.map(w=>/^\d+(?:\.\d+)?(u|µ)$/i.test(w) ? w.replace(/(u|µ)$/i,"µF") : w);
  const ti=words.findIndex(w=>TYPE_FIRST.includes(w.toLowerCase()));
  if (ti>0) words=[words[ti],...words.slice(0,ti),...words.slice(ti+1)]; // "10kΩ resistor" -> "Resistor 10kΩ"
  return words.map(caseWord).join(" ");
}

/* ---------- database doctor: dedupe + field repair ---------- */
function fieldFixes(c){
  const fixes=[];
  const clean=v=>String(v??"").trim().replace(/\s+/g," ");
  for (const k of ["value","pkg","part","notes"]){
    let nv=clean(c[k]);
    if (k!=="notes" && /^(-|n\/a|na|none|null)$/i.test(nv)) nv="";
    if (k==="value") nv=fixUnits(nv);
    if (nv!==String(c[k]??"")) fixes.push({k, after:nv});
  }
  if (!Number.isFinite(Number(c.qty)) || Number(c.qty)<0) fixes.push({k:"qty", after:0});
  if (!Number.isFinite(Number(c.min)) || Number(c.min)<0) fixes.push({k:"min", after:0});
  if (!Number.isInteger(c.bin) || c.bin<0 || c.bin>9999){
    const g=guessClass(c.name);
    fixes.push({k:"bin", after: g ? nextFreeBin(g.d,g.s) : nextFreeBin(0)});
  }
  return fixes;
}
function tokSet(name){ return new Set(norm(tidyName(name)).split(/\s+/).filter(Boolean)); }
function doctorScan(){
  const nameFixes=[], fldFixes=[], exact=[], review=[];
  state.items.forEach(c=>{
    const tn=tidyName(c.name);
    if (tn!==c.name) nameFixes.push({c, after:tn});
    const f=fieldFixes(c);
    if (f.length) fldFixes.push({c, f});
  });
  const byName={};
  state.items.forEach(c=>{ const k=norm(tidyName(c.name)); (byName[k] ||= []).push(c); });
  Object.values(byName).forEach(g=>{ if (g.length>1){ g.sort((a,b)=>a.cid-b.cid); exact.push(g); } });
  const uniq=Object.values(byName).map(g=>g[0]);
  for (let i=0;i<uniq.length;i++) for (let j=i+1;j<uniq.length;j++){
    const A=tokSet(uniq[i].name), B=tokSet(uniq[j].name);
    if (A.size<2 || B.size<2) continue;
    const inter=[...A].filter(x=>B.has(x)).length;
    if (inter && (inter===A.size || inter===B.size)) review.push([uniq[i], uniq[j]]);
  }
  return {nameFixes, fldFixes, exact, review};
}
function mergeInto(surv, dup){
  surv.qty += dup.qty;
  surv.min = Math.max(surv.min, dup.min);
  for (const k of ["value","pkg","part"]) if (!surv[k] && dup[k]) surv[k]=dup[k];
  if (dup.notes && dup.notes!==surv.notes) surv.notes = surv.notes ? surv.notes+"; "+dup.notes : dup.notes;
  state.items = state.items.filter(x=>x!==dup);
}
function snapshotUndo(desc){
  logAct(desc, {type:"snapshot", items: JSON.parse(JSON.stringify(state.items))});
}

function guessClass(name){
  const t = norm(name);
  for (const [re,d,sec] of GUESS) if (re.test(t)) return {d, s:sec};
  return null;
}
function secOf(bin){ return Math.floor(bin/100)%10; }
function secLabel(d,t){ return state.sections?.[""+d+t] || null; }
async function infoCard(c){

function countStep(){

  const c=m.queue[m.idx], n=clsNum(c.bin), sl=secLabel(n,secOf(c.bin));

  print(`  BIN ${binStr(c.bin)}${sl?" · "+sl:""} · system says ${c.qty}`,"g");
  setPS1(`  actual [${c.qty}]: `);
}
async function countInput(line){
  const m=mode, c=m.queue[m.idx], t=line.trim().toLowerCase();
  if (t==="cancel"||t==="stop"){ endMode(`count stopped — ${m.checked} checked, ${m.fixed} corrected.`,"a"); return; }
  if (t==="skip"||t==="s"){ m.idx++; countStep(); return; }
  let actual = t==="" ? c.qty : parseInt(t,10);
  if (isNaN(actual)||actual<0){ print("  number, blank to confirm, 'skip', or 'stop'","a"); countStep(); return; }
  m.checked++;
  const was = c.qty;
  // The count is booked server-side: the corrected quantity, the counted-at stamp and
  // the discrepancy row all land in one transaction, and it is a single undo step.
  try {
    const updated = await DB.count(c.cid, actual, m.scope||"");
    c.qty = updated.qty;
  } catch(e){ print("  could not record the count: "+e.message,"a"); }
  if (actual!==was){
    m.fixed++;
    print(`  corrected → ${actual}${actual<=c.min?"  <LOW>":""}`, actual<=c.min?"a":"g");
    if (actual<=c.min) print(`  ⚠ now at/below min (${c.min}) — reorder`,"a");
  } else print("  ok","g");
  await refreshSummary(); deptCache=null; updateBadge();
  m.idx++; countStep();
}

const VERBS = ["add","edit","del","rm","take","stock","add-stock","list","ls","l","bins","low","stats","tidy","doctor","normalize","fsck","merge","map","remap","sec","proj","project","build","graph","labels","label","scan","install","backup","create","new","keys","menu","theme","settings","config","set","cfgadj","cfgreset","bar","titlebar","health","status","rollback","photo","count","template","server","db","database","setup","shop","demo","welcome","firstrun","__fr_import","__fr_fresh","__fr_demo","__fr_go","sections","shelves","__secedit","__secadd","galaxy","report","lan","__lantoggle","__toggle","__shopdefault","who","iam","tutorial","tour","skip","license","about","source","feedback","bug","key","shopkey",
               "export","import","help","clear","cls","home","reset","find","f","class","classes","move","info","undo","u","recent","log","y","n","yes","no","cancel","end"];
/* Live search now crosses the network on every keystroke, which introduces a
   hazard the in-memory version did not have: a slow reply for "wid" can land
   after the reply for "widget" and repaint stale results. liveSeq stamps each
   run and a stale one throws its results away.

   It asks for an approximate page — the top 8 plus a capped total — so the
   server never counts or sorts thousands of matches for a keystroke. */
let liveSeq = 0;
async function renderLive(){
  const seq = ++liveSeq;
  if (mode.type!=="normal"){ live.innerHTML=""; return; }
  const t = cmd.value.trim();
  live.innerHTML="";
  if (!t) return;
  const first = t.split(/\s+/)[0].toLowerCase();
  if (VERBS.includes(first)) return;                       // it's a command, stay quiet
  if (/^\d{1,4}$/.test(t)){
    const el=document.createElement("div"); el.className="line d";
    let what;
    if (t.length===1) what=`dept ${t}000 ${clsLabel(+t)}`;
    else if (t.length===2) what=`section ${t}00 ${secLabel(+t[0],+t[1])||clsLabel(+t[0])}`;
    else what="BIN "+binStr(+t);
    el.textContent=`  ↵ opens ${what}`;
    live.appendChild(el); return;
  }
  const page = await DB.peek({q:t, limit:8, approx:1, sort:"bin"}).catch(()=>null);
  if (seq !== liveSeq) return;              // a newer keystroke superseded this one
  if (!page){ return; }
  const r = page.rows;
  if (!r.length){
    liveItems=[]; liveSel=-1;
    const el=document.createElement("div"); el.className="line d";
    el.textContent=`  no matches — ↵ to add "${t}"? type: add ${t}`;
    live.appendChild(el); return;
  }
  liveItems = r.slice(0,8);
  if (liveSel >= liveItems.length) liveSel = liveItems.length-1;
  liveItems.forEach((c,i)=>{
    const el=rowEl(c);
    if (i===liveSel) el.classList.add("sel");
    el.dataset.i=i;
    live.appendChild(el);
  });
  const more = page.total - liveItems.length;
  const tail=document.createElement("div"); tail.className="line d";
  tail.textContent = (more>0 ? `  +${more}${page.capped?"+":""} more · ` : `  `)
    + (liveSel>=0 ? "↵ info · ^↵ take · ⇧↵ stock · p project" : "↓ select");
  live.appendChild(tail);
  term.scrollTop = term.scrollHeight;
}

/* ── ROBUST SPREADSHEET IMPORT ─────────────────────────────────
   Accepts CSV/TSV (built-in, zero-dep), and .xlsx/.xls/.xlsm/.ods/
   Google-Sheets exports via SheetJS loaded lazily from a local file
   (deploy/xlsx.full.min.js) so the base app stays lean & offline. */
let _sheetjs=null;
async function loadSheetJS(){
  if (_sheetjs) return _sheetjs;
  if (window.XLSX) return (_sheetjs=window.XLSX);
  // try a few local paths so it works from deploy/ or a flat folder
  for (const src of ["xlsx.full.min.js","./xlsx.full.min.js","deploy/xlsx.full.min.js"]){
    try{
      await new Promise((res,rej)=>{ const el=document.createElement("script");
        el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); });
      if (window.XLSX) return (_sheetjs=window.XLSX);
    }catch(e){}
  }
  return null;
}
/* delimiter sniff for text: comma vs tab vs semicolon (EU exports) */
function sniffDelim(text){
  const line=(text.split(/\r?\n/).find(l=>l.trim())||"");
  const counts={",":0,"\t":0,";":0};
  let inQ=false;
  for (const ch of line){ if(ch==='"')inQ=!inQ; else if(!inQ&&counts[ch]!==undefined)counts[ch]++; }
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][1] ? Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0] : ",";
}
function parseDelimited(text, delim){
  // full RFC-ish parser: quotes, escaped quotes, embedded newlines, CRLF
  const rows=[]; let row=[], cur="", inQ=false;
  text=text.replace(/^\uFEFF/,"");                  // strip BOM
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (inQ){
      if (ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=ch;
    } else if (ch==='"') inQ=true;
    else if (ch===delim){ row.push(cur); cur=""; }
    else if (ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if (ch==="\r"){ /* handled by \n */ }
    else cur+=ch;
  }
  if (cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
/* universal: any file -> array-of-rows (each row = array of string cells) */
async function fileToRows(file){
  const name=(file.name||"").toLowerCase();
  const isText = /\.(csv|tsv|txt)$/.test(name) || file.type==="text/csv" || file.type==="text/plain";
  if (isText){
    const text=await file.text();
    return parseDelimited(text, sniffDelim(text));
  }
  // binary spreadsheet -> SheetJS
  const X=await loadSheetJS();
  if (!X) throw new Error("nosheetjs");
  const buf=await file.arrayBuffer();
  const wb=X.read(buf,{type:"array", cellDates:false, raw:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(ws,{header:1, blankrows:false, defval:""})
    .map(r=>r.map(c=>c==null?"":String(c)));
}
/* pasted text (Google Sheets / Excel copy) -> rows */
function textToRows(text){ return parseDelimited(text, sniffDelim(text)); }

/* map arbitrary spreadsheet headers to our fields via keyword synonyms */
const FIELD_SYNONYMS = {
  // includes column names used by Sortly / Zoho Inventory / inFlow / Square exports
  name:     ["name","item","description","desc","product","part name","title","component","material","tool","label","item name","itemname","entry name","item title"],
  bin:      ["bin","location","loc","shelf","slot","place","where","position","bin #","bin no","binnumber","spot","drawer","folder","folder path","zone","warehouse","storage location"],
  qty:      ["qty","quantity","count","on hand","onhand","stock","in stock","instock","amount","number","have","units","q ty","current quantity","quantity in stock","available","stock on hand","qty in stock"],
  min:      ["min","minimum","min qty","reorder","reorder point","threshold","safety","par","min stock","minimum quantity","min level","reorder level","low stock alert","minimum stock"],
  value:    ["value","rating","spec","size","voltage","ohms","rated","specification","val","price","unit price","cost","unit cost","item price"],
  pkg:      ["package","pkg","form","case","footprint","packaging","type","unit","unit of measure","uom"],
  part:     ["part","part number","part no","part#","partno","mpn","sku","model","catalog","cat no","manufacturer part","upc","barcode","item id","serial","serial number","asset tag","asset id"],
  supplier: ["supplier","vendor","source","brand","manufacturer","mfg","maker","seller","distributor","from","vendor name","supplier name"],
  source:   ["where to find","find","aisle","store","supplier location","pick location","source location","sublocation","sub-location","area"],
  link:     ["link","url","website","web","product link","product url","href","page","photo url","image url","attachment"],
  notes:    ["notes","note","comment","comments","remarks","memo","info","details","description2","tags","custom notes"],
};
const norm2=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function scoreHeader(header){
  // returns {field, score} best guess for a single header cell
  const h=norm2(header);
  if (!h) return {field:null, score:0};
  let best={field:null, score:0};
  for (const [field, syns] of Object.entries(FIELD_SYNONYMS)){
    for (const syn of syns){
      const sy=norm2(syn);
      let sc=0;
      if (h===sy) sc=100;
      else if (h.replace(/ /g,"")===sy.replace(/ /g,"")) sc=95;
      else if (h.includes(sy)||sy.includes(h)) sc=70 - Math.abs(h.length-sy.length);
      else { const hw=new Set(h.split(" ")), sw=sy.split(" ");
        const hit=sw.filter(w=>hw.has(w)).length; if(hit) sc=40+hit*10; }
      if (sc>best.score) best={field, score:sc};
    }
  }
  return best;
}
/* is the first row a header? heuristic: mostly non-numeric + matches some fields */
function looksLikeHeader(row){
  if (!row||!row.length) return false;
  const nonNum=row.filter(c=>c!==""&&isNaN(parseFloat(c))).length;
  const matched=row.filter(c=>scoreHeader(c).score>=60).length;
  return (nonNum >= row.length*0.6) && matched>=1;
}
/* build an auto-mapping: column index -> field (best, de-duplicated) */
function autoMap(headerRow){
  const scored=headerRow.map((h,i)=>({i, ...scoreHeader(h)}));
  const used=new Set(); const map={};
  scored.slice().sort((a,b)=>b.score-a.score).forEach(s=>{
    if (s.field && s.score>=40 && !used.has(s.field)){ map[s.i]=s.field; used.add(s.field); }
  });
  return map;   // {colIndex: field}
}
/* turn rows + mapping into item drafts, applying all the messy-real-world rules */
function rowsToItems(rows, map, hasHeader){
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const items=[], skipped=[];
  const nameCol = Object.keys(map).find(k=>map[k]==="name");
  for (const r of dataRows){
    if (!r || r.every(c=>String(c).trim()==="")) continue;               // blank row
    const joined=r.join(" ").toLowerCase();
    if (/^\s*(total|totals|subtotal|grand total|sum)\b/.test(String(r[0]||"").toLowerCase())) continue; // trailing total
    const it={value:"",pkg:"",part:"",supplier:"",source:"",link:"",notes:""};
    for (const [ci,field] of Object.entries(map)){
      let v=String(r[ci]??"").trim();
      if (field==="qty"||field==="min"){ const n=parseInt(v.replace(/[^0-9-]/g,""),10); it[field]=isNaN(n)?(field==="min"?1:0):Math.max(0,n); }
      else if (field==="bin"){ const n=parseInt(String(v).replace(/[^0-9]/g,""),10); it.bin=isNaN(n)?null:n; }
      else it[field]=v;
    }
    if (nameCol===undefined && !it.name){ it.name = String(r[0]??"").trim(); } // no name col: use col 0
    if (!it.name){ skipped.push({r, why:"no name"}); continue; }
    if (it.qty===undefined) it.qty=0;
    if (it.min===undefined) it.min=1;
    items.push(it);
  }
  return {items, skipped};
}
