/* ---------- input plumbing ---------- */
/* ghost text — an example of the current command, revealed/erased as you type */
const GHOSTS = {
  add:    "add 10k resistor x50 @1101",
  take:   "take resistor 5",
  stock:  "stock resistor 20",
  move:   "move resistor 1102",
  edit:   "edit resistor",
  del:    "del resistor",
  info:   "info resistor",
  find:   "find resistor",
  labels: "labels 1",
  project:"project new drone",
  build:  "build drone",
  class:  "class 51 = PLA",
  merge:  "merge C-001 C-002",
  remap:  "remap 15 35",
};
const IDLE_GHOST = "type to search, or / for commands";
function drawMirror(){
  idle.style.display = cmd.value ? "none" : "";
  const g=document.getElementById("ghost"); if(!g) return;
  if (mode.type!=="normal"){ g.textContent=""; return; }
  const v=cmd.value;
  if (!v){                                   // empty prompt: faint invitation past the cursor
    g.style.left="1ch";
    g.textContent = " "+IDLE_GHOST;
    return;
  }
  if (v.startsWith("/")){ g.textContent=""; return; }
  // find a template that STARTS WITH what's typed so far (case-insensitive)
  const first=v.split(/\s+/)[0].toLowerCase();
  const tmpl=GHOSTS[first];
  if (tmpl && tmpl.toLowerCase().startsWith(v.toLowerCase()) && tmpl.length>v.length){
    // ghost shows only the remainder, offset by the typed length
    g.style.left = v.length+"ch";
    g.textContent = tmpl.slice(v.length);
  } else {
    g.textContent="";
  }
}
cmd.addEventListener("input",()=>{
  liveSel=-1; browseSel=-1; tabState={base:null,cands:[],idx:0};
  const v=cmd.value;
  if (v.startsWith("/")){ menu(v.slice(1)); return; }
  if (menuOpen){ menuOpen=false; home(); }
});
["input","keyup","click","focus"].forEach(ev=>cmd.addEventListener(ev,()=>{ drawMirror(); renderLive(); }));

cmd.addEventListener("keydown", async e=>{
  if (e.ctrlKey && e.key.toLowerCase()==="u"){           // ctrl+u: clear the line
    e.preventDefault(); cmd.value=""; liveSel=-1; drawMirror(); renderLive(); return;
  }
  if (e.ctrlKey && e.key.toLowerCase()==="l"){           // ctrl+l: clear the screen
    e.preventDefault(); if (mode.type==="normal"){ cmd.value=""; liveSel=-1; drawMirror(); home(); } return;
  }
  if (e.ctrlKey && e.key.toLowerCase()==="a"){ e.preventDefault(); cmd.setSelectionRange(0,0); return; }
  if (e.ctrlKey && e.key.toLowerCase()==="e"){ e.preventDefault(); const L=cmd.value.length; cmd.setSelectionRange(L,L); return; }
  if (e.ctrlKey && e.key.toLowerCase()==="w"){           // ctrl+w: delete word back
    e.preventDefault();
    const c=cmd.selectionStart??cmd.value.length;
    const left=cmd.value.slice(0,c).replace(/\S+\s*$/,"");
    cmd.value=left+cmd.value.slice(c);
    cmd.setSelectionRange(left.length,left.length);
    liveSel=-1; drawMirror(); renderLive(); return;
  }
  if (e.ctrlKey && e.key.toLowerCase()==="k"){           // ctrl+k: kill to end
    e.preventDefault();
    const c=cmd.selectionStart??cmd.value.length;
    cmd.value=cmd.value.slice(0,c);
    liveSel=-1; drawMirror(); renderLive(); return;
  }
  if (e.key==="PageUp" || e.key==="PageDown"){           // scrollback paging
    e.preventDefault();
    term.scrollBy({top:(e.key==="PageUp"?-0.9:0.9)*term.clientHeight});
    return;
  }
  if (e.key==="F1"){ e.preventDefault(); cmd.value=""; drawMirror(); menu(""); return; }
  if (e.key==="F2" && mode.type==="normal"){ e.preventDefault(); await run("doctor"); return; }
  if (e.key==="F3" && mode.type==="normal"){ e.preventDefault(); await run("graph 3d"); return; }
  if (e.key==="F4" && mode.type==="normal"){ e.preventDefault(); await run("bar"); return; }
  if (e.key==="h" && mode.type==="normal" && !cmd.value && graphMode!=="off" && navSel()<0){ e.preventDefault(); graphHome(); return; }
  if (e.key==="g" && mode.type==="normal" && !cmd.value && graphMode!=="off" && navSel()<0){ e.preventDefault(); cycleView(); return; }
  if ((e.key==="ArrowLeft"||e.key==="ArrowRight") && mode.type==="normal" && !cmd.value){
    const rows=navRows(), i=navSel();
    if (i>=0 && rows[i] && rows[i].dataset.cfg){
      e.preventDefault();
      await run("cfgadj "+rows[i].dataset.cfg+" "+(e.key==="ArrowRight"?"up":"down"));
      return;
    }
  }
  if (e.key==="Tab" && mode.type==="normal" && !cmd.value){
    e.preventDefault();
    navMove(e.shiftKey ? -1 : 1);            // Tab = next row, Shift+Tab = previous
    return;
  }
  if (e.key==="Tab"){                                    // tab completion (mid-type)
    e.preventDefault();
    if (mode.type!=="normal") return;
    const val=cmd.value;
    const m=val.match(/^(.*?)(\S*)$/), before=m[1], tok=m[2];
    if (!val.trim()) return;
    const key=before+tok;
    if (tabState.base!==key || !tabState.cands.length){
      let cands;
      if (!before.trim()){
        const MAIN=["add","take","stock","move","edit","del","info","find","list","bins","low","stats",
                    "count","photo","recent","undo","tidy","doctor","merge","map","remap","proj","project","build","graph",
                    "labels","scan","template","health","rollback","theme","settings","bar","keys","menu",
                    "install","backup","create","class","classes","export","import","help","clear","home","reset"];
        cands=MAIN.filter(v=>v.startsWith(tok.toLowerCase()));
      } else {
        const nt=norm(tok);
        cands=state.items.map(c=>c.name).filter(n=>norm(n).startsWith(nt));
        if (!cands.length && nt) cands=state.items.map(c=>c.name).filter(n=>norm(n).includes(nt));
      }
      if (!cands.length) return;
      tabState={base:key, cands, idx:0};
    } else {
      tabState.idx=(tabState.idx+1)%tabState.cands.length;
    }
    cmd.value=before+tabState.cands[tabState.idx]+(before.trim()?"":" ");
    const L=cmd.value.length; cmd.setSelectionRange(L,L);
    liveSel=-1; drawMirror(); renderLive();
    return;
  }
  /* p: toss the selected part into the active project */
  if (e.key==="p" && mode.type==="normal" && !cmd.value && navSel()>=0){
    e.preventDefault();
    const rows=navRows(), el=rows[navSel()];
    const cid = el.dataset.cid ? +el.dataset.cid : (liveItems[navSel()]?.cid);
    const it = cid!=null ? state.items.find(c=>c.cid===cid) : null;
    if (!it) return;
    const ap=state.projects.find(x=>x.pid===state.activePid);
    if (!ap){ print("no active project — proj new <name>, or proj use <name>","a"); return; }
    const line=ap.bom.find(l=>l.cid===it.cid);
    logAct(`bom: +1x ${it.name} -> ${ap.name}`, {type:"bomline", pid:ap.pid, cid:it.cid, prev: line?line.need:null});
    if (line) line.need++; else ap.bom.push({cid:it.cid, need:1});
    await save();
    print(`+1x ${it.name} -> ${ap.name} (need ${line?line.need:1})`,"g");
    return;
  }

  /* unified cursor: ↓ / ↑ walk the rows on screen; Esc clears it */
  if (mode.type==="normal" && !cmd.value){
    if (e.key==="ArrowDown"){
      if (navRows().length){ e.preventDefault(); navMove(1); return; }
    } else if (e.key==="ArrowUp"){
      if (navSel()>=0){ e.preventDefault(); navMove(-1); return; }
    } else if (e.key==="Escape" && navSel()>=0){
      e.preventDefault(); navPaint(-1); return;
    }
  }

  if (e.key==="Enter"){
    e.preventDefault();
    if (mode.type==="normal" && navSel()>=0){
      const mod = e.ctrlKey ? "take" : e.shiftKey ? "stock" : "info";
      if (await navOpen(mod)) return;
    }
    const line=cmd.value; cmd.value=""; drawMirror(); live.innerHTML=""; liveSel=-1; liveItems=[]; browseSel=-1;

    if (mode.type==="wizard"){ print(ps1.textContent+line,"d"); await wizardInput(line); drawMirror(); return; }
    if (mode.type==="count"){ print(ps1.textContent+line,"d"); await countInput(line); drawMirror(); return; }
    if (mode.type==="setup"){ print(ps1.textContent+line,"d"); await setupInput(line); drawMirror(); return; }
    if (mode.type==="secedit"){ print(ps1.textContent+line,"d"); await secEditInput(line); drawMirror(); return; }
    if (mode.type==="secadd"){ print(ps1.textContent+line,"d"); await secAddInput(line); drawMirror(); return; }

    if (mode.type==="pickclass"){
      print(ps1.textContent+line,"d");
      const t=line.trim();
      if (t.toLowerCase()==="cancel"){ endMode("cancelled.","a"); return; }
      if (!/^\d$/.test(t)){ print("  enter a digit 0-9 (or 'cancel')","a"); return; }
      mode.draft.bin=await nextFreeBin(+t);
      const d=mode.draft; endMode();
      await commitAdd(d); return;
    }

    if (mode.type==="confirm"){
      print(ps1.textContent+line,"d");
      if (mode.demoClear){
        if (line.trim().toLowerCase().startsWith("y")){
          state.items=[]; state.nextCid=1; state.seededDemo=false; state.seeded=true;
          await save(); print("demo data cleared — starting real.","g"); home();
        } else print("kept the demo data.","g");
        endMode(); drawMirror(); return;
      }
      if (mode.demoLoad){
        endMode();
        if (line.trim().toLowerCase().startsWith("y")){
          await loadDemoData(); await save(); home();
          if (graphMode==="off") setGraph("split");
          g3d=true; setGraphView({kind:"galaxy"});
          print("demo loaded — galaxy open. 'demo clear' to wipe.","g");
        } else print("kept your data.","g");
        drawMirror(); return;
      }
      if (line.trim().toLowerCase().startsWith("y")){
        await DB.remove(mode.c.cid);
        setView(state.items.filter(x=>x!==mode.c));
        await refreshSummary(); deptCache=null;
        if (mode.c.photo) delPhoto(mode.c.cid);
        logAct(`deleted ${mode.c.name} (was BIN ${mode.c.bin}, qty ${mode.c.qty})`, {type:"del", item:{...mode.c}});
        await save(); print(`deleted ${mode.c.name}.`,"a");
      } else print("kept it.","g");
      endMode(); drawMirror(); return;
    }

    if (mode.type==="confirmbin"){
      print(ps1.textContent+line,"d");
      if (line.trim().toLowerCase().startsWith("y")){
        snapshotUndo(`emptied BIN ${binStr(mode.bin)} (${mode.items.length} entries)`);
        const gone=mode.items;
        gone.forEach(g=>{ if(g.photo) delPhoto(g.cid); });
        state.items=state.items.filter(c=>!gone.includes(c));
        await save();
        print(`BIN ${binStr(mode.bin)} emptied — ${gone.length} entries removed. (undo restores)`,"a");
      } else print("kept them.","g");
      endMode(); drawMirror(); return;
    }

    if (mode.type==="importpaste"){
      const t=line.trim();
      if (t.toLowerCase()==="cancel"){ endMode("import cancelled.","a"); return; }
      if (t.toLowerCase()==="end"){
        const buf=mode.buf.join("\n"); endMode();
        if (buf.trim()) startImportWizard(textToRows(buf), "pasted data");
        else print("nothing to import.","a");
        return;
      }
      mode.buf.push(line); print("  + "+line.slice(0,60),"d"); return;
    }
    if (mode.type==="importmap"){
      print(ps1.textContent+line,"d"); await importMapInput(line); drawMirror(); return;
    }

    if (line.trim().startsWith("/")){ cmd.value=""; drawMirror(); menu(line.trim().slice(1)); return; }
    if (line.trim()){ history.push(line); hIdx=history.length; }
    await run(line);
    drawMirror();
    return;
  }
  if (e.key==="ArrowDown" && mode.type==="normal"){
    e.preventDefault();
    if (cmd.value || navRows().length){ navMove(1); return; }  // rows present -> navigate
    if (hIdx>=history.length) return;                          // else: history
    hIdx++;
    cmd.value = hIdx===history.length ? stash : history[hIdx];
    cmd.setSelectionRange(cmd.value.length,cmd.value.length); drawMirror(); renderLive();
  }
  else if (e.key==="ArrowUp" && mode.type==="normal"){
    e.preventDefault();
    if (navSel()>=0){ navMove(-1); return; }                  // in the list -> move up
    if (cmd.value){                                            // recall history while typing
      if(!history.length) return;
      if (hIdx===history.length) stash=cmd.value;
      hIdx=Math.max(0,hIdx-1); cmd.value=history[hIdx];
      cmd.setSelectionRange(cmd.value.length,cmd.value.length); drawMirror(); renderLive(); return;
    }
    if(!history.length) return;                               // empty prompt -> history
    if (hIdx===history.length) stash=cmd.value;
    hIdx=Math.max(0,hIdx-1); cmd.value=history[hIdx];
    cmd.setSelectionRange(cmd.value.length,cmd.value.length); drawMirror(); renderLive();
  }
  else if (e.key==="Escape"){
    e.preventDefault();
    // Esc peels back one layer at a time; the graph pane is the LAST thing to close.
    if (scanStream){ stopScan(); print("scan cancelled.","d"); drawMirror(); return; }
    if (mode.type!=="normal"){ print("cancelled.","a"); endMode(); }        // a prompt/wizard
    else if (cmd.value){ cmd.value=""; }                                     // typed text
    else if (navSel()>=0){ navPaint(-1); }                                   // a row cursor
    else if (graphMode==="full"){ setGraph("split"); }                       // full -> split (keep graph)
    else if (!isHome()){ home(); }                                           // clear terminal to home, KEEP the split graph
    else if (graphMode!=="off" && gView.kind==="proj"){ setGraphView({kind:"projects"}); } // then step the graph view out
    else if (graphMode==="split"){ setGraph("off"); }                        // finally close the graph
    drawMirror(); live.innerHTML="";
  }
});

cmd.addEventListener("paste", e=>{
  const txt=(e.clipboardData||window.clipboardData).getData("text");
  if (mode.type==="import" && txt.includes("\n")){
    e.preventDefault();
    txt.split(/\r?\n/).forEach(l=>{ if(l.trim()) mode.buf.push(l); });
    print(`  + pasted ${txt.split(/\r?\n/).filter(l=>l.trim()).length} lines — type 'end' to import`,"d");
  }
});

/* tap any printed/live row that carries a command */
async function rowTap(e){
  const stp=e.target.closest(".stepper");
  if (stp && stp.dataset.adj){ await run("cfgadj "+stp.dataset.adj); cmd.focus(); return; }
  // section manager: + adds a section under a dept, - clears a section
  const addEl=e.target.closest("[data-add]");
  if (addEl){ await run("__secadd "+addEl.dataset.add); cmd.focus(); return; }
  const delEl=e.target.closest("[data-del]");
  if (delEl){ await run("__secedit "+delEl.dataset.del); cmd.focus(); return; }
  const row=e.target.closest(".idx");
  if (!row){ if(!getSelection().toString()) cmd.focus(); return; }
  // menu rows (theme picker, COMMANDS button, etc.) carry dataset.menu
  if (row.dataset.menu){
    const m=row.dataset.menu; browseSel=-1; menuOpen=false;
    live.innerHTML=""; cmd.value=""; drawMirror();
    if (m.startsWith("run:")){ const c=m.slice(4); if(c) await run(c); else home(); }
    else { const pre=m.slice(5); out.innerHTML=""; live.innerHTML=""; home(); cmd.value=pre; drawMirror(); renderLive(); }
    cmd.focus(); return;
  }
  const c=row.dataset.cmd;
  if (!c){ cmd.focus(); return; }
  live.innerHTML=""; cmd.value=""; drawMirror();
  await run(c); cmd.focus();
}
out.addEventListener("click", rowTap);
live.addEventListener("click", rowTap);
// hovering a component row in the terminal lights its node in the graph
function rowHover(e){
  if (graphMode==="off") return;
  const row=e.target.closest(".idx");
  graphHighlightCid(row ? rowCid(row) : null);
}
out.addEventListener("mousemove", rowHover);
live.addEventListener("mousemove", rowHover);
out.addEventListener("mouseleave", ()=>graphHighlightCid(null));
live.addEventListener("mouseleave", ()=>graphHighlightCid(null));
term.addEventListener("click", e=>{ if (!e.target.closest("#out") && !e.target.closest("#live") && !getSelection().toString()) cmd.focus(); });
document.addEventListener("keydown", ()=>{ if(document.activeElement!==cmd) cmd.focus(); });

/* ---------- photo capture wiring ---------- */
async function attachPhoto(cid, fileOrBlob){
  try{
    const url=await downscaleImage(fileOrBlob);
    await setPhoto(cid, url);
    const it=state.items.find(x=>x.cid===cid); if(it){ it.photo=true; await save(); }
    print(`photo attached to C-${String(cid).padStart(3,"0")}. (info to view)`,"g");
    if (graphMode!=="off"){ gAlpha=Math.max(gAlpha,0.05); }
  }catch(e){ print("couldn't read that image.","a"); }
}
$("sheetinput").addEventListener("change", async e=>{
  const f=e.target.files&&e.target.files[0];
  if (!f) return;
  try{
    print("reading "+f.name+" …","d");
    const rows=await fileToRows(f);
    startImportWizard(rows, f.name);
  }catch(err){
    if (String(err.message).includes("nosheetjs"))
      print("that format needs the spreadsheet engine (xlsx.full.min.js) next to the app. CSV/paste works without it — try: import paste","a");
    else print("couldn't read that file: "+err.message,"a");
  }
});
$("photoinput").addEventListener("change", async e=>{
  const f=e.target.files&&e.target.files[0];
  if (f && photoTarget){ const cid=photoTarget.cid; photoTarget=null; await attachPhoto(cid,f); }
});
/* drag an image onto the window -> attaches to the last-viewed / selected item */
["dragover","drop"].forEach(ev=>document.addEventListener(ev, e=>{
  if (ev==="dragover"){ e.preventDefault(); return; }
  e.preventDefault();
  const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith("image/"));
  if (!f) return;
  // target: explicit photoTarget, else the selected row's item, else last info card
  let cid = photoTarget?.cid;
  if (cid==null){ const rows=navRows(), i=navSel(); if(i>=0&&rows[i]&&rows[i].dataset.cid) cid=+rows[i].dataset.cid; }
  if (cid==null){ const last=out.querySelector(".card[data-cid]:last-of-type, .card[data-cid]"); if(last) cid=+last.dataset.cid; }
  if (cid==null){ print("drop an image after opening an item (info <id>), or use: photo <id>","a"); return; }
  photoTarget=null; attachPhoto(cid,f);
}));

/* ---------- warning badge: live doctor status in the titlebar ---------- */
let issueMarks = new Map();   // cid -> "⚠" | "=1" (same-name dup group) | "~2" (possible pair)
function updateBadge(){
  try{
    const d = doctorScan();
    issueMarks = new Map();
    d.nameFixes.forEach(x=>issueMarks.set(x.c.cid,"⚠"));
    d.fldFixes.forEach(x=>issueMarks.set(x.c.cid,"⚠"));
    let g=0;
    d.exact.forEach(grp=>{ g++; grp.forEach(c=>issueMarks.set(c.cid,"="+g)); });
    d.review.forEach(pr=>{ g++; pr.forEach(c=>issueMarks.set(c.cid,"~"+g)); });
    const safe = d.nameFixes.length + d.fldFixes.length + d.exact.reduce((s,x)=>s+x.length-1,0);
    const n = safe + d.review.length;
    const pcs = summary.pieces;
    const ap=state.projects?.find(x=>x.pid===state.activePid);
    barl.innerHTML = state.shopName ? `<b>${esc(state.shopName)}</b>` : `<b>INVENTORY</b>`;
    const stale = state.lastBackup && (Date.now()-state.lastBackup > 6048e5);
    barr.innerHTML = ``
      + (installPrompt ? `<span class="warnpill" id="pinst" title="install this app">⤓ install</span>` : ``)
      + (stale && !backupHandle ? `<span class="warnpill" id="pbak" title="last backup is old">⁂ backup</span>` : ``)
      + (!lastSaveOk ? `<span class="warnpill" id="phealth" title="save failed — open health">⚠ save</span>` : ``)
      + (n ? `<span class="warnpill" id="pdoc" title="doctor report (F2)">▲ ${n}</span>` : ``)
      + `<span class="barbtn" id="pgraph" title="node graph (F3)">graph</span>`
      + `<span class="barbtn" id="ptheme" title="theme &amp; display">theme</span>`
      + `<span class="barbtn" id="pset" title="settings">settings</span>`
      + `<span class="barbtn" id="phelp" title="commands (F1)">help</span>`;
  }catch(e){}
}
barr.addEventListener("click", async e=>{
  if (mode.type!=="normal") return;
  const id=e.target.closest("[id]")?.id;
  if (id==="pinst")  return void await run("install");
  if (id==="pbak")   return void await run("backup");
  if (id==="ptheme") return void await run("theme");
  if (id==="pgraph") return void await run("graph 3d");
  if (id==="pset")   return void await run("settings");
  if (id==="phelp")  return void await run("help");
  if (id==="phealth")return void await run("health");
  if (id==="pdoc" || issueMarks.size) await run("doctor");
  cmd.focus();
});

load().then(async ()=>{
  applyTheme(state.theme||"campbell"); hudOn=state.hud!==false; gCores=state.cores!==false;
  document.body.classList.toggle("bar-off", !!state.barOff);
  if (state.firstRun && !state.shopName && (state.seededDemo || (state.seeded && state.items.length))){
    updateBadge(); firstRun(); cmd.focus();
  } else { updateBadge(); home(); cmd.focus(); }
  await restoreBackupHandle();
  await restoreDbHandle();
  if (backupHandle) updateBadge();
  // optional: let a server override sections/departments per-client
  if (SERVER.on()){
    try{
      const cfg=await SERVER.getConfig(); serverLive=true;
      if (cfg && cfg.classes && Array.isArray(cfg.classes)){ state.classes=cfg.classes; }
      if (cfg && cfg.sections && typeof cfg.sections==="object"){ state.sections=cfg.sections; }
      if (cfg.classes||cfg.sections){ home(); print("sections loaded from server.","d"); }
    }catch(e){ serverLive=false; }
  }
  // startup integrity check: verify the mirror agrees, warn once if anything's off
  try{
    const prim=openEnvelope(await store.get(KEY));
    if (!prim.ok) print("⚠ primary store failed verification on load — running on a recovered copy. run 'health'.","a");
    const days = state.lastExport ? (Date.now()-state.lastExport)/864e5 : 999;
    if (!backupHandle && days>14)
      print(`⚠ last off-machine backup ${state.lastExport?Math.round(days)+" days ago":"never"} — run 'backup' or 'export' to protect your data.`,"a");
  }catch(e){}
});
